<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공장·창고 화재안전실태조사 관계법령</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#0e1b2c;--sub:#5a6b80;--line:#e2e8f0;--navy:#0f2a4a;--navy2:#1a4272;--ac:#1565c0;--acs:#e8f1fc;--hl:#ffb300;--hlink:#2a1c00;--dim:#8a99ab;--tb:#0d7a6b;--tbs:#def5f1;--ts:#6b3fc2;--tss:#ece5fa;--sh:0 1px 2px rgba(15,42,74,.06),0 10px 24px -14px rgba(15,42,74,.25);--gl:rgba(242,245,249,.86)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a121c;--card:#121e2d;--ink:#e8eef6;--sub:#9fb0c4;--line:#22324a;--navy:#0c2038;--navy2:#143a66;--ac:#6cb2f5;--acs:#16314f;--dim:#6a7d94;--tb:#5fd3c1;--tbs:#12332f;--ts:#b79cf5;--tss:#2a1f47;--sh:0 1px 0 rgba(255,255,255,.03);--gl:rgba(10,18,28,.86)}}
:root[data-theme="dark"]{--bg:#0a121c;--card:#121e2d;--ink:#e8eef6;--sub:#9fb0c4;--line:#22324a;--navy:#0c2038;--navy2:#143a66;--ac:#6cb2f5;--acs:#16314f;--dim:#6a7d94;--tb:#5fd3c1;--tbs:#12332f;--ts:#b79cf5;--tss:#2a1f47;--sh:0 1px 0 rgba(255,255,255,.03);--gl:rgba(10,18,28,.86)}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
svg{flex:none}
mark{background:var(--hl);color:var(--hlink);font-weight:700;padding:.02em .22em;border-radius:4px}
#app{max-width:640px;margin:0 auto;padding:0 16px 32px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;min-height:56px;margin:0 -16px 8px;padding:8px 16px;background:var(--gl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar h1{font-size:16px;font-weight:700;margin:0;flex:1;line-height:1.35}
.ib{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden;margin:16px 0 14px;padding:28px 22px 24px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(135deg,var(--navy),var(--navy2));background-size:26px 26px,26px 26px,auto}
.eb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:#b9d3f2;text-transform:uppercase}
.eb:before{content:"";width:22px;height:2px;background:var(--hl);border-radius:2px}
.hero h2{font-size:27px;line-height:1.3;font-weight:900;margin:10px 0 10px;letter-spacing:-.03em}
.hero p{margin:0;color:#c9d8ec;font-size:14.5px}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--sh);transition:transform .15s}
.act:active{transform:scale(.985)}
.ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--acs);color:var(--ac)}
.act b{display:block;font-size:17px;line-height:1.35}
.act span.d{display:block;color:var(--sub);font-size:13.5px;line-height:1.45;margin-top:2px}
.act .ch{margin-left:auto;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:20px;font-weight:900;color:var(--ac);line-height:1.2}
.st span{font-size:12px;color:var(--sub)}
.foot{margin:18px 4px 0;font-size:12.5px;color:var(--dim);line-height:1.6;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.card label{display:block;font-weight:700;margin-bottom:10px}
.card input{width:100%;font:inherit;font-size:20px;font-weight:500;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.card p{margin:10px 2px 0;font-size:13px;color:var(--sub)}
.go{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--navy2),var(--ac));color:#fff;font-weight:700;font-size:17px;box-shadow:0 10px 20px -10px var(--ac)}
.go[disabled]{opacity:.4;box-shadow:none}
.ban{display:flex;align-items:center;gap:10px;background:var(--acs);color:var(--ac);border-radius:14px;padding:11px 14px;margin:6px 0 14px;font-size:14px;font-weight:500}
.ban b{font-weight:900}
.cat{margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.cat>button{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;padding:16px;text-align:left}
.no{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--acs);color:var(--ac);font-weight:900;font-size:15px}
.cat>button strong{font-size:17px;flex:1}
.cat>button small{color:var(--sub);font-size:12.5px}
.cat .cv{transition:transform .2s;color:var(--dim)}
.cat.on .cv{transform:rotate(180deg)}
.cat.on>button .no{background:var(--navy2);color:#fff}
.items{padding:2px 12px 12px}
.it{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 6px;font-size:15px;font-weight:500;line-height:1.5}
.it.sb{margin-left:14px;width:calc(100% - 14px);border-left:2px solid var(--line);border-top:0;border-radius:0;padding:9px 6px 9px 14px;font-size:14.5px;font-weight:400}
.it.off{cursor:default}
.it.off .t{color:var(--dim)}
.tg{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:4px 7px;border-radius:6px;margin-right:7px;vertical-align:1px;white-space:nowrap}
.tg-r{background:var(--acs);color:var(--ac)}.tg-b{background:var(--tbs);color:var(--tb)}.tg-s{background:var(--tss);color:var(--ts)}
.pl{justify-self:end;display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--acs);color:var(--ac)}
.pl.no2{background:var(--bg);color:var(--dim);font-weight:500}
.pl.wt{background:transparent;color:var(--dim);border:1px dashed var(--line);font-weight:500}
.cap{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-weight:700;margin:14px 2px 4px}
.hint{font-size:13px;color:var(--sub);margin:0 2px 12px}
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 18px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.vc{flex:none;width:138px;scroll-snap-align:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);position:relative}
.vc:first-child{border:2px solid var(--ac)}
.vc em{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ac);min-height:1.4em}
.vc b{display:block;font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.03em;margin-top:4px}
.vc span{display:block;font-size:14px;color:var(--sub)}
.vc small{display:block;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.ov{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .in{max-width:640px;margin:0 auto;padding:0 16px 56px}
.ovh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;margin:0 -16px;padding:10px 16px;background:var(--gl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lt{margin:18px 0 14px}
.lt .ln{font-size:13px;color:var(--sub);margin:6px 0 2px}
.lt h2{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin:0}
.lt .mt{font-size:13px;color:var(--sub);margin-top:6px}
.law{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px 14px;box-shadow:var(--sh);word-break:keep-all;overflow-wrap:anywhere;font-size:16px;line-height:1.8}
.law div{margin:0 0 8px}
.law .ar{font-weight:700;font-size:17px;margin:18px 0 10px;padding:8px 0 8px 12px;border-left:4px solid var(--ac);background:var(--acs);border-radius:0 10px 10px 0}
.law .ar:first-child{margin-top:0}
</style>
</head>
<body>
<div id="app"></div>

미터 이상으로 하여야 한다.","  ②문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 장례식장 또는 위락시설 중 유흥주점의 용도에 쓰이는 건축물의 관람석 또는 집회실로서 그 바닥면적이 200제곱미터 이상인 것의 반자의 높이는 제1항의 규정에 불구하고 4미터(노대의 아랫부분의 높이는 2.7미터)이상이어야 한다. 다만, 기계환기장치를 설치하는 경우에는 그러하지 아니하다. <개정 2010.4.7>"]},{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제16조(거실의 반자높이) ①영 제50조의 규정에 의하여 설치하는 거실의 반자(반자가 없는 경우에는 보 또는 바로 윗층의 바닥판의 밑면 기타 이와 유사한 것을 말한다. 이하같다)는 그 높이를 2.1미터 이상으로 하여야 한다.","  ②문화 및 집회시설(전시장 및 동ㆍ식물원은 제외한다), 종교시설, 장례식장 또는 위락시설 중 유흥주점의 용도에 쓰이는 건축물의 관람실 또는 집회실로서 그 바닥면적이 200제곱미터 이상인 것의 반자의 높이는 제1항에도 불구하고 4미터(노대의 아랫부분의 높이는 2.7미터)이상이어야 한다. 다만, 기계환기장치를 설치하는 경우에는 그렇지 않다. <개정 2010.4.7, 2019.8.6>"]}],"거실의_채광":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제51조(거실의 채광 및 환기) ①주택의 거실, 학교의 교실, 의료시설의 병실, 숙박시설의 객실 또는 기숙사의 침실에 채광을 위하여 설치하는 창문등의 면적은 그 거실의 바닥면적의 10분의 1이상이어야 한다. 다만, 건설부령이 정하는 바에 의하여 조명장치를 한 경우에는 그러하지 아니하다.","  ②환기를 위하여 거실에 설치하는 창문등의 면적은 그 거실의 바닥면적의 20분의 1이상이어야 한다. 다만, 건설부령이 정하는 바에 의하여 위생에 지장이 없는 환기장치를 설치한 경우에는 그러하지 아니하다.","  ③수시로 개방할 수 있는 미달이로 구획된 2개의 거실은 제1항 및 제2항을 적용함에 있어서는 이를 1개의 거실로 본다."]},{"d":"1996-01-06","m":"[대통령령 제14891호, 1995. 12. 30, 일부개정]","l":["제51조(거실의 채광 및 환기) ①주택의 거실, 학교의 교실, 의료시설의 병실, 숙박시설의 객실 또는 기숙사의 침실에 채광을 위하여 설치하는 창문등의 면적은 그 거실의 바닥면적의 10분의 1이상이어야 한다. 다만, 건설교통부령이 정하는 바에 의하여 조명장치를 한 경우에는 그러하지 아니하다.<개정 1994ㆍ12ㆍ23>","  ②환기를 위하여 거실에 설치하는 창문등의 면적은 그 거실의 바닥면적의 20분의 1이상이어야 한다. 다만, 건설교통부령이 정하는 바에 의하여 위생에 지장이 없는 환기장치를 설치한 경우에는 그러하지 아니하다.<개정 1994ㆍ12ㆍ23>","  ③수시로 개방할 수 있는 미달이로 구획된 2개의 거실은 제1항 및 제2항을 적용함에 있어서는 이를 1개의 거실로 본다."]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제51조(거실의 채광등) ①법 제39조제2항의 규정에 의하여 단독주택 및 공동주택의 거실, 교육연구 및 복지시설중 학교의 교실, 의료시설의 병실 또는 숙박시설의 객실에는 건설교통부령이 정하는 기준에 따라 채광 및 환기를 위한 창문등 또는 설비를 설치하여야 한다.","  ②법 제39조제2항의 규정에 의하여 6층이상의 건축물로서 문화 및 집회시설, 판매 및 영업시설, 의료시설, 교육연구 및 복지시설중 연구소ㆍ아동관련시설ㆍ노인복지시설 및 유스호스텔, 운동시설, 업무시설, 숙박시설, 위락시설 또는 관광휴게시설의 거실에는 건설교통부령이 정하는 기준에 따라 배연설비를 설치하여야 한다. 다만, 피난층인 경우에는 그러하지 아니하다.","  [전문개정 1999.4.30]"]},{"d":"2008-02-29","m":"[대통령령 제20722호, 200 및 제5항에 따라 대피공간 등을 설치한 아파트","  2. 「주택건설기준 등에 관한 규정」 제15조제2항에 따라 비상용승강기를 설치한 아파트","  [전문개정 2008.10.29]"]}],"건축물_바깥쪽으로의_출구_설치":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제39조(건축물의 바깥쪽으로의 출구) ①피난층에 있어서 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다 이하 같다)는 제34조제1항의 규정에 의한 거리 이하로 하고, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 제34조제1항의 규정에 의한 거리의 2배이하로 하여야 한다.","  ②관람집회시설ㆍ종교집회장ㆍ무도유흥음식점 및 장례식장의 용도에 쓰이는 건축물의 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여서는 아니된다.","  ③제2항의 경우에 관람석의 바닥면적의 합계가 300제곱미터이상인 공연장에 있어서는 건축물의 바깥쪽으로의 주된 출구외에 보조출구 또는 비상구를 2이상 설치하여야 한다.","  ④판매시설의 용도에 쓰이는 피난층에 설치하는 건축물의 바깥쪽으로의 출구의 유효너비의 합계는 당해 용도에 쓰이는 바닥면적이 최대인 층에 있어서의 당해 용도의 바닥면적 100제곱미터마다 0.6미터이상의 비율로 산정한 너비이상으로 하여야 한다.","  ⑤근린공공시설ㆍ공공업무시설ㆍ연면적이 5천제곱미터이상인 판매시설 및 학교나 승강기를 설치하여야 하는 건축물의 피난층 또는 피난층의 승강장으로부터 건축물 바깥쪽에 이르는 통로에는 제49조의 규정에 의한 경사로를 설치하여야 한다."]},{"d":"1996-01-06","m":"[대통령령 제14891호, 1995. 12. 30, 일부개정]","l":["제39조(건축물의 바깥쪽으로의 출구) ①피난층에 있어서 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다 이하 같다)는 제34조제1항의 규정에 의한 거리 이하로 하고, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 제34조제1항의 규정에 의한 거리의 2배이하로 하여야 한다.","  ②관람집회시설ㆍ종교집회장ㆍ위락시설 및 장례식장의 용도에 쓰이는 건축물의 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여서는 아니된다.<신설 1995ㆍ12ㆍ30>","  ③제2항의 경우에 관람석의 바닥면적의 합계가 300제곱미터이상인 공연장에 있어서는 건축물의 바깥쪽으로의 주된 출구외에 보조출구 또는 비상구를 2이상 설치하여야 한다.","  ④판매시설의 용도에 쓰이는 피난층에 설치하는 건축물의 바깥쪽으로의 출구의 유효너비의 합계는 당해 용도에 쓰이는 바닥면적이 최대인 층에 있어서의 당해 용도의 바닥면적 100제곱미터마다 0.6미터이상의 비율로 산정한 너비이상으로 하여야 한다.","  ⑤근린공공시설ㆍ공공업무시설ㆍ연면적이 5천제곱미터이상인 판매시설 및 학교나 승강기를 설치하여야 하는 건축물의 피난층 또는 피난층의 승강장으로부터 건축물 바깥쪽에 이르는 통로에는 제48조의 규정에 의한 경사로를 설치하여야 한다.<개정 1995ㆍ12ㆍ30>"]},{"d":"1997-09-09","m":"[대통령령 제15476호, 1997. 9. 9, 일부개정]","l":["제39조 (건축물의 바깥쪽으로의 출구) ①피난층에 있어서 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다 이하 같다)는 제34조제1항의 규정에 의한 거리 이하로 하고, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 제34조제1항의 규정에 의한 거리의 2배이하로 하여야 한다.","  ②관람집회시설·종교집회장·위락시설 및 장례식장의 용도에 쓰이는 건축물의 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여서는 아니된다.<신설 1995·12·30>","  ③제2항의 경우에 관람석의 바닥면적의 합계가 300제곱미터이상인 공연장에 있어서는 건축물의 바깥쪽으로의 주된 출구외에 보조출구 또는 비상구를 2이상 설치하여야 한다.","  ④판매시설의 용도에 쓰이는 피난층에 설치하는 건축물의 바깥쪽으로의 출구의 유효너비의 합계는 당해 용도에 쓰이는 바닥면적이 최대인 층에 있어서의 당해 용도의 바닥면적 100제곱미터마다 0.6미터이상의 비율로 산정한 너비이상으로 하여야 한다.","  ⑤근린공공시설·공공업무시설·연면적이 5천제곱미터이상인 판매시설 및 학교나 승강기를 설치하여야 하는 건축물의 피난층 또는 피난층의 승강장으로부터 건축물 바깥쪽에 이르는 통로에는 제48조의 규정에 의한 경사로를 설치하여야 한다.<개정 1995·12·30>"]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제39조(건축물의 바깥쪽으로의 출구의 설치) ①법 제39조제1항의 규정에 의하여 다음 각호의 1에 해당하는 건축물에는 건설교통부령이 정하는 기준에 따라 당해건축물로부터 바깥쪽으로 나가는 출구를 설치하여야 한다.","  1. 문화 및 집회시설(전시장 및 동ㆍ식물원을 제외한다)","  2. 판매 및 영업시설중 도매시장ㆍ소매시장 및 상점","  3. 의료시설중 장례식장","  4. 업무시설중 국가 또는 지방자치단체의 청사","  5. 위락시설","  6. 연면적이 5천제곱미터이상인 창고시설","  7. 교육연구 및 복지시설중 학교","  8. 승강기를 설치하여야 하는 건축물","  ②법 제39조제1항의 규정에 의하여 건축물의 출입구에 설치하는 회전문은 건설교통부령이 정하는 기준에 적합하게 설치하여야 한다.","  [전문개정 1999.4.30]"]},{"d":"2000-07-01","m":"[대통령령 제16874호, 2000. 6. 27, 일부개정]","l":["제39조(건축물의 바깥쪽으로의 출구의 설치) ①법 제39조제1항의 규정에 의하여 다음 각호의 1에 해당하는 건축물에는 건설교통부령이 정하는 기준에 따라 당해건축물로부터 바깥쪽으로 나가는 출구를 설치하여야 한다.","  1. 문화 및 집회시설(전시장 및 동ㆍ식물원을 제외한다)","  2. 판매 및 영업시설중 도매시장ㆍ소매시장 및 상점","  3. 의료시설중 장례식장","  4. 업무시설중 국가 또는 지방자치단체의 청사","  5. 위락시설","  6. 연면적이 5천제곱미터이상인 창고시설","  7. 교육연구 및 복지시설중 학교","  8. 승강기를 설치하여야 하는 건축물","  ②법 제39조제1항의 규정에 의하여 건축물의 출입구에 설치하는 회전문은 건설교통부령이 정하는 기준에 적합하게 설치하여야 한다.","  [전문개정 1999.4.30]"]},{"d":"2008-10-29","m":"[대통령령 제21098호, 2008. 10. 29, 일부개정]","l":["제39조 (건축물 바깥쪽으로의 출구 설치) ① 법 제49조제1항에 따라 다음 각 호의 어느 하나에 해당하는 건축물에는 국토해양부령으로 정하는 기준에 따라 그 건축물로부터 바깥쪽으로 나가는 출구를 설치하여야 한다.","  1. 문화 및 집회시설(전시장 및 동·식물원은 제외한다)","  2. 종교시설","  3. 판매시설","  4. 업무시설 중 국가 또는 지방자치단체의 청사","  5. 위락시설","  6. 연면적이 5천 제곱미터 이상인 창고시설","  7. 교육연구시설 중 학교","  8. 장례식장","  9. 승강기를 설치하여야 하는 건축물","  ② 법 제49조제1항에 따라 건축물의 출입구에 설치하는 회전문은 국토해양부령으로 정하는 기준에 적합하여야 한다.","  [전문개정 2008.10.29]"]},{"d":"2014-03-24","m":"[대통령령 제25273호, 2014. 3. 24, 일부개정]","l":["제39조(건축물 바깥쪽으로의 출구 설치) ① 법 제49조제1항에 따라 다음 각 호의 어느 하나에 해당하는 건축물에는 국토교통부령으로 정하는 기준에 따라 그 건축물로부터 바깥쪽으로 나가는 출구를 설치하여야 한다. <개정 2013.3.23, 2014.3.24>","  1. 제2종 근린생활시설 중 공연장·종교집회장·인터넷컴퓨터게임시설제공업소(해당 용도로 쓰는 바닥면적의 합계가 각각 300제곱미터 이상인 경우만 해당한다)","  2. 문화 및 집회시설(전시장 및 동·식물원은 제외한다)","  3. 종교시설","  4. 판매시설","  5. 업무시설 중 국가 또는 지방자치단체의 청사","  6. 위락시설","  7. 연면적이 5천 제곱미터 이상인 창고시설","  8. 교육연구시설 중 학교","  9. 장례식장","  10. 승강기를 설치하여야 하는 건축물","  ② 법 제49조제1항에 따라 건축물의 출입구에 설치하는 회전문은 국토교통부령으로 정하는 기준에 적합하여야 한다. <개정 2013.3.23>","  [전문개정 2008.10.29]"]}],"건축물_바깥쪽으로의_출구의_설치기준":[{"d":"1999-05-09","m":"[건설교통부령 제184호, 1999. 5. 7, 제정]","l":["제11조 (건축물의 바깥쪽으로의 출구의 설치기준) ①영 제39조제1항의 규정에 의하여 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 피난층의 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다. 이하 같다)는 영 제34조제1항의 규정에 의한 거리이하로 하여야 하며, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 영 제34조제1항의 규정에 의한 거리의 2배이하로 하여야 한다.","  ②영 제39조제1항의 규정에 의하여 건축물의 바깥쪽으로 나가는 출구를 설치하는 건축물중 문화 및 집회시설(전시장 및 동ㆍ식물원을 제외한다), 의료시설중 장례식장 또는 위락시설의 용도에 쓰이는 건축물의 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여서는 아니된다.","  ③영 제39조제1항의 규정에 의하여 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 관람석의 바닥면적의 합계가 300제곱미터이상인 집회장 또는 공연장에 있어서는 주된 출구외에 보조출구 또는 비상구를 2개소이상 설치하여야 한다.","  ④판매 및 영업시설(도매시장ㆍ소매시장 및 상점에 한한다. 이하 이 조에서 같다)의 용도에 쓰이는 피난층에 설치하는 건축물의 바깥쪽으로의 출구의 유효너비의 합계는 당해용도에 쓰이는 바닥면적이 최대인 층에 있어서의 당해용도의 바닥면적 100제곱미터마다 0.6미터의 비율로 산정한 너비이상으로 하여야 한다.","  ⑤다음 각호의 1에 해당하는 건축물의 피난층 또는 피난층의 승강장으로부터 건축물의 바깥쪽에 이르는 통로에는 제15조제5항의 규정에 의한 경사로를 설치하여야 한다.","  1. 제1종 근린생활시설중 동사무소ㆍ경찰관파출소ㆍ소방서ㆍ우체국ㆍ전신전화국ㆍ방송국ㆍ보건소ㆍ공공도서관ㆍ지역의료보험조합 기타 이와 유사한 것으로서 동일한 건축물안에서 당해용도에 쓰이는 바닥면적의 합계가 1천제곱미터미만인 것","  2. 제1종 근린생활시설중 마을공회당ㆍ마을공동작업소ㆍ마을공동구판장ㆍ변전소ㆍ양수장ㆍ정수장ㆍ대피소ㆍ공중화장실 기타 이와 유사한 것","  3. 연면적이 5천제곱미터이상인 판매 및 영업시설","  4. 교육연구 및 복지시설중 학교","  5. 업무시설중 국가 또는 지방자치단체의 청사와 외국공관의 건축물로서 제1종 근린생활시설에 해당하지 아니하는 것","  6. 승강기를 설치하여야 하는 건축물"]},{"d":"2000-06-03","m":"[건설교통부령 제241호, 2000. 6. 3, 일부개정]","l":["제11조 (건축물의 바깥쪽으로의 출구의 설치기준) ①영 제39조제1항의 규정에 의하여 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 피난층의 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다. 이하 같다)는 영 제34조제1항의 규정에 의한 거리이하로 하여야 하며, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 영 제34조제1항의 규정에 의한 4. 교육연구시설 중 학교","  5. 업무시설중 국가 또는 지방자치단체의 청사와 외국공관의 건축물로서 제1종 근린생활시설에 해당하지 아니하는 것","  6. 승강기를 설치하여야 하는 건축물","  ⑥「건축법」(이하 법\"이라 한다) 제49조제1항에 따라 영 제39조제1항 각 호의 어느 하나에 해당하는 건축물의 바깥쪽으로 나가는 출입문에 유리를 사용하는 경우에는 안전유리를 사용하여야 한다. <신설 2006.6.29"]},{"d":"2022-02-11","m":"[국토교통부령 제884호, 2021. 9. 3, 일부개정]","l":["제11조(건축물의 바깥쪽으로의 출구의 설치기준) ①영 제39조제1항의 규정에 의하여 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 피난층의 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다. 이하 같다)는 영 제34조제1항의 규정에 의한 거리이하로 하여야 하며, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 영 제34조제1항의 규정에 의한 거리의 2배 이하로 하여야 한다.","  ②영 제39조제1항에 따라 건축물의 바깥쪽으로 나가는 출구를 설치하는 건축물중 문화 및 집회시설(전시장 및 동ㆍ식물원을 제외한다), 종교시설, 장례식장 또는 위락시설의 용도에 쓰이는 건축물의 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여서는 아니된다. <개정 2010.4.7>","  ③영 제39조제1항에 따라 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 관람실의 바닥면적의 합계가 300제곱미터 이상인 집회장 또는 공연장은 주된 출구 외에 보조출구 또는 비상구를 2개소 이상 설치해야 한다. <개정 2019.8.6>","  ④판매시설의 용도에 쓰이는 피난층에 설치하는 건축물의 바깥쪽으로의 출구의 유효너비의 합계는 해당 용도에 쓰이는 바닥면적이 최대인 층에 있어서의 해당 용도의 바닥면적 100제곱미터마다 0.6미터의 비율로 산정한 너비 이상으로 하여야 한다. <개정 2010.4.7>","  ⑤다음 각 호의 어느 하나에 해당하는 건축물의 피난층 또는 피난층의 승강장으로부터 건축물의 바깥쪽에 이르는 통로에는 제15조제5항에 따른 경사로를 설치하여야 한다. <개정 2010.4.7>","  1. 제1종 근린생활시설 중 지역자치센터ㆍ파출소ㆍ지구대ㆍ소방서ㆍ우체국ㆍ방송국ㆍ보건소ㆍ공공도서관ㆍ지역건강보험조합 기타 이와 유사한 것으로서 동일한 건축물안에서 당해 용도에 쓰이는 바닥면적의 합계가 1천제곱미터 미만인 것","  2. 제1종 근린생활시설 중 마을회관ㆍ마을공동작업소ㆍ마을공동구판장ㆍ변전소ㆍ양수장ㆍ정수장ㆍ대피소ㆍ공중화장실 기타 이와 유사한 것","  3. 연면적이 5천제곱미터 이상인 판매시설, 운수시설","  4. 교육연구시설 중 학교","  5. 업무시설중 국가 또는 지방자치단체의 청사와 외국공관의 건축물로서 제1종 근린생활시설에 해당하지 아니하는 것","  6. 승강기를 설치하여야 하는 건축물","  ⑥「건축법」(이하 법\"이라 한다) 제49조제1항에 따라 영 제39조제1항 각 호의 어느 하나에 해당하는 건축물의 바깥쪽으로 나가는 출입문에 유리를 사용하는 경우에는 안전유리를 사용하여야 한다. <신설 2006.6.29"]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제11조(건축물의 바깥쪽으로의 출구의 설치기준) ①영 제39조제1항의 규정에 의하여 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 피난층의 계단으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리(가장 가까운 출구와의 보행거리를 말한다. 이하 같다)는 영 제34조제1항의 규정에 의한 거리이하로 하여야 하며, 거실(피난에 지장이 없는 출입구가 있는 것을 제외한다)의 각 부분으로부터 건축물의 바깥쪽으로의 출구에 이르는 보행거리는 영 제34조제1항의 규정에 의한 거리의 2배 이하로 하여야 한다.","  ②영 제39조제1항에 따라 건축물의 바깥쪽으로 나가는 출구를 설치하는 건축물중 문화 및 집회시설(전시장 및 동ㆍ식물원을 제외한다), 종교시설, 장례식장 또는 위락시설의 용도에 쓰이는 건축물의 바깥쪽으로의 출구로 쓰이는 문은 안여닫이로 하여서는 아니된다. <개정 2010.4.7>","  ③영 제39조제1항에 따라 건축물의 바깥쪽으로 나가는 출구를 설치하는 경우 관람실의 바닥면적의 합계가 300제곱미터 이상인 집회장 또는 공연장은 주된 출구 외에 보조출구 또는 비상구를 2개소 이상 설치해야 한다. <개정 2019.8.6>","  ④판매시설의 용도에 쓰이는 피난층에 설치하는 건축물의 바깥쪽으로의 출구의 유효너비의 합계는 해당 용도에 쓰이는 바닥면적이 최대인 층에 있어서의 해당 용도의 바닥면적 100제곱미터마다 0.6미터의 비율로 산정한 너비 이상으로 하여야 한다. <개정 2010.4.7>","  ⑤다음 각 호의 어느 하나에 해당하는 건축물의 피난층 또는 피난층의 승강장으로부터 건축물의 바깥쪽에 이르는 통로에는 제15조제5항에 따른 경사로를 설치하여야 한다. <개정 2010.4.7>","  1. 제1종 근린생활시설 중 지역자치센터ㆍ파출소ㆍ지구대ㆍ소방서ㆍ우체국ㆍ방송국ㆍ보건소ㆍ공공도서관ㆍ지역건강보험조합 기타 이와 유사한 것으로서 동일한 건축물안에서 당해 용도에 쓰이는 바닥면적의 합계가 1천제곱미터 미만인 것","  2. 제1종 근린생활시설 중 마을회관ㆍ마을공동작업소ㆍ마을공동구판장ㆍ변전소ㆍ양수장ㆍ정수장ㆍ대피소ㆍ공중화장실 기타 이와 유사한 것","  3. 연면적이 5천제곱미터 이상인 판매시설, 운수시설","  4. 교육연구시설 중 학교","  5. 업무시설중 국가 또는 지방자치단체의 청사와 외국공관의 건축물로서 제1종 근린생활시설에 해당하지 아니하는 것","  6. 승강기를 설치하여야 하는 건축물","  ⑥「건축법」(이하 법\"이라 한다) 제49조제1항에 따라 영 제39조제1항 각 호의 어느 하나에 해당하는 건축물의 바깥쪽으로 나가는 출입문에 유리를 사용하는 경우에는 안전유리를 사용하여야 한다. <신설 2006.6.29"]}],"건축물의_내화구조":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제56조(건축물의 내화구조) 법 제40조제1항의 규정에 의하여 다음 각호의 1에 해당하는 건축물의 주요구조부는 이를 내화구조로 하여야 한다. 다만, 단층으로서 연면적이 50제곱미터이하인 부속건축물로서 외벽 및 처마밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다.","  1. 위험물저장및처리시설(자가난방 및 자가발전등의 용도에 쓰이는 시설을 포함한다)의 용도에 쓰이는 건축물","  2. 관람집회시설ㆍ종교집회장ㆍ무도유흥음식점 및 장례식장의 용도에 쓰이는 건축물로서 관람석 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천제곱미터)이상인 건축물","  3. 체육관, 운동장, 위락시설(무도유흥음식점을 제외한다), 전시시설, 운수시설(다중이 이용하는 시설에 한한다), 관광휴게시설(다중이 이용하는 시설에 한한다), 생활권청소년시설, 판매시설, 방송ㆍ통신시설, 화장장, 창고시설 및 자동차관련시설의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 500제곱미터이상인 건축물","  4. 공장의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 2천제곱미터이상인 건축물","  5. 건축물의 2층이 숙박시설ㆍ유스호스텔ㆍ의료시설ㆍ아동시설ㆍ노인시설ㆍ근린생활시설(의료의 용도에 쓰이는 시설에 한한다)ㆍ다중주택ㆍ공동주택ㆍ기숙사 및 오피스텔의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 400제곱미터이상인 건축물","  6. 3층이상의 건축물 및 지하층이 있는 건축물. 다만, 단독주택ㆍ공관ㆍ축사ㆍ식물관련시설ㆍ교정시설ㆍ군사시설 및 묘지관련시설(화장장을 제외한다)의 용도에 쓰이는 건축물을 제외한다."]},{"d":"1994-12-23","m":"[대통령령 제14447호, 1994. 12. 23, 타법개정]","l":["제56조(건축물의 내화구조) 법 제40조제1항의 규정에 의하여 다음 각호의 1에 해당하는 건축물의 주요구조부는 이를 내화구조로 하여야 한다. 다만, 단층으로서 연면적이 50제곱미터이하인 부속건축물로서 외벽 및 처마밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다.","  1. 위험물저장및처리시설(자가난방 및 자가발전등의 용도에 쓰이는 시설을 포함한다)의 용도에 쓰이는 건축물","  2. 관람집회시설ㆍ종교집회장ㆍ무도유흥음식점 및 장례식장의 용도에 쓰이는 건축물로서 관람석 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천제곱미터)이상인 건축물","  3. 체육관, 운동장, 위락시설(무도유흥음식점을 제외한다), 전시시설, 운수시설(다중이 이용하는 시설에 한한다), 관광휴게시설(다중이 이용하는 시설에 한한다), 생활권청소년시설, 판매시설, 방송ㆍ통신시설, 화장장, 창고시설 및 자동차관련시설의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 500제곱미터이상인 건축물","  4. 공장의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 2천제곱미터이상인 건축물","  5. 건축물의 2층이 숙박시설ㆍ유스호스텔ㆍ의료시설ㆍ아동시설ㆍ노인시설ㆍ근린생활시설(의료의 용도에 쓰이는 시설에 한한다)ㆍ다중주택ㆍ공동주택ㆍ기숙사 및 오피스텔의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 400제곱미터이상인 건축물","  6. 3층이상의 건축물 및 지하층이 있는 건축물. 다만, 단독주택ㆍ공관ㆍ축사ㆍ식물관련시설ㆍ교정시설ㆍ군사시설 및 묘지관련시설(화장장을 제외한다)의 용도에 쓰이는 건축물을 제외한다."]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제56조(건축물의 내화구조) ①법 제40조제1항의 규정에 의하여 다음 각호의 1에 해당하는 건축물(제6호에 해당하는 건축물로서 2층이하인 건축물의 경우에는 지하층부분에 한한다)의 주요구조부는 이를 내화구조로 하여야 한다. 다만, 연면적이 50제곱미터이하인 단층의 부속건축물로서 외벽 및 처마밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다.<개정 1995ㆍ12ㆍ30, 1997ㆍ9ㆍ9, 1999.4.30>","  1. 삭제<1995ㆍ12ㆍ30>","  2. 문화 및 집회시설(전시장 및 동ㆍ식물원을 제외한다), 의료시설중 장례식장 또는 위락시설중 주점영업의 용도에 쓰이는 건축물로서 관람석 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천제곱미터)이상인 건축물","  3. 문화 및 집회시설중 전시장 및 동ㆍ식물원, 판매 및 영업시설, 교육연구 및 복지시설중 생활권수련시설, 운동시설중 체육관 및 운동장, 위락시설(주점영업의 용도에 쓰이는 것을 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차관련시설, 공공용시설중 방송국ㆍ전신전화국 및 촬영소, 묘지관련시설중 화장장 또는 관광휴게시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 500제곱미터이상인 건축물","  4. 공장의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 2천제곱미터이상인 건축물. 다만, 화재의 위험이 적은 공장으로서 건설교통부령이 정하는 공장을 제외한다.","  5. 건축물의 2층이 단독주택중 다중주택, 공동주택, 제1종 근린생활시설(의료의 용도에 쓰이는 시설에 한한다), 의료시설, 교육연구 및 복지시설중 아동관련시설ㆍ노인복지시설 및 유스호스텔, 업무시설중 오피스텔 또는 숙박시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 400제곱미터이상인 건축물","  6. 3층이상의 건축물 및 지하층이 있는 건축물. 다만, 단독주택, 동물 및 식물관련시설, 공공용시설중 교도소 및 감화원 또는 묘지관련시설(화장장을 제외한다)의 용도에 쓰이는 건축물을 제외한다.","  ②제1항제2호 및 제3호에 해당하는 용도에 쓰이지 아니하는 건축물로서 그 지붕을 불연재료로 한 경우에는 당해 지붕을 내화구조로 하지 아니할 수 있다.<신설 1995ㆍ12ㆍ30>"]},{"d":"2006-05-09","m":"[대통령령 제19466호, 2006. 5. 8, 일부개정]","l":["제56조 (건축물의 내화구조) ①법 제40조제1항의 규정에 의하여 다음 각 호의 어느 하나에 해당하는 건축물(제6호에 해당하는 건축물로서 2층이하인 건축물의 경우에는 지하층부분에 한한다)의 주요구조부는 이를 내화구조로 하여야 한다. 다만, 연면적이 50제곱미터이하인 단층의 부속건축물로서 외벽 및 처마밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다. <개정 1995.12.30, 1997.9.9, 1999.4.30, 2000.6.27, 2005.7.18, 2006.5.8>","  1. 삭제 <1995.12.30>","  2. 문화 및 집회시설(전시장 및 동·식물원을 제외한다), 종교시설, 의료시설 중 장례식장 또는 위락시설 중 주점영업의 용도에 쓰이는 건축물로서 관람석 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천제곱미터)이상인 건축물","  3. 문화 및 집회시설 중 전시장 및 동·식물원, 판매시설, 운수시설, 수련시설, 운동시설 중 체육관 및 운동장, 위락시설(주점영업의 용도에 쓰이는 것을 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차관련시설, 방송통신시설 중 방송국·전신전화국 및 촬영소, 묘지관련시설 중 화장장 또는 관광휴게시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 500제곱미터이상인 건축물","  4. 공장의 용도에 쓰이는 건축물로서 그 용도에 사용하는 바닥면적의 합계가 2천제곱미터이상인 건축물. 다만, 화재의 위험이 적은 공장으로서 건설교통부령이 정하는 공장을 제외한다.","  5. 건축물의 2층이 단독주택중 다중주택·다가구주택, 공동주택, 제1종 근린생활시설(의료의 용도에 쓰이는 시설에 한한다), 의료시설, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔 또는 숙박시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 400제곱미터이상인 건축물","  6. 3층이상의 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택을 제외한다), 동물 및 식물관련시설, 발전시설(발전소의 부속용도로 사용되는 시설을 제외한다), 교도소 및 감화원 또는 묘지관련시설(화장장을 제외한다)의 용도에 쓰이는 건축물을 제외한다.","  ②제1항제2호 및 제3호에 해당하는 용도에 쓰이지 아니하는 건축물로서 그 지붕틀을 불연재료로 한 경우에는 당해 지붕틀을 내화구조로 하지 아니할 수 있다. <신설 1995.12.30, 2000.6.27>"]},{"d":"2008-02-22","m":"[대통령령 제20647호, 2008. 2. 22, 일부개정]","l":["제56조 (건축물의 내화구조) ①법 제40조제1항에 따라 다음 각 호의 어느 하나에 해당하는 건축물(제6호에 해당하는 건축물로서 2층이하인 건축물의 경우에는 지하층부분에 한한다)의 주요구조부는 이를 내화구조로 하여야 한다. 다만, 연면적이 50제곱미터이하인 단층의 부속건축물로서 외벽 및 처마밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다. <개정 1995.12.30, 1997.9.9, 1999.4.30, 2000.6.27, 2005.7.18, 2006.5.8, 2008.2.22>","  1. 삭제 <1995.12.30>","  2. 문화 및 집회시설(전시장 및 동·식물원을 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도에 쓰이는 건축물로서 관람석 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천제곱미터)이상인 건축물","  3. 문화 및 집회시설 중 전시장 및 동·식물원, 판매시설, 운수시설, 수련시설, 운동시설 중 체육관 및 운동장, 위락시설(주점영업의 용도에 쓰이는 것을 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차관련시설, 방송통신시설 중 방송국·전신전화국 및 촬영소, 묘지관련시설 중 화장장 또는 관광휴게시설의 용도에 쓰이는 건축물로서 그 용도에 쓰이는 바닥면적의 합계가 500제곱미터이상인 건축물","  4. 공장의 용도에 쓰이 . 3층 이상인 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택은 제외한다), 동물 및 식물 관련 시설, 발전시설(발전소의 부속용도로 쓰는 시설은 제외한다), 교도소·감화원 또는 묘지 관련 시설(화장장은 제외한다)의 용도로 쓰는 건축물과 철강 관련 업종의 공장 중 제어실로 사용하기 위하여 연면적 50제곱미터 이하로 증축하는 부분은 제외한다.","  ② 제1항제1호 및 제2호에 해당하는 용도로 쓰지 아니하는 건축물로서 그 지붕틀을 불연재료로 한 경우에는 그 지붕틀을 내화구조로 아니할 수 있다.","  [전문개정 2008.10.29]"]},{"d":"2010-08-17","m":"[대통령령 제22351호, 2010. 8. 17, 일부개정]","l":["제56조(건축물의 내화구조) ① 법 제50조제1항에 따라 다음 각 호의 어느 하나에 해당하는 건축물(제5호에 해당하는 건축물로서 2층 이하인 건축물은 지하층 부분만 해당한다)의 주요구조부는 내화구조로 하여야 한다. 다만, 연면적이 50제곱미터 이하인 단층의 부속건축물로서 외벽 및 처마 밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다. <개정 2009.6.30, 2010.2.18, 2010.8.17>","  1. 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 및 장례식장의 용도로 쓰는 건축물로서 관람석 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천 제곱미터) 이상인 건축물","  2. 문화 및 집회시설 중 전시장 또는 동·식물원, 판매시설, 운수시설, 교육연구시설에 설치하는 체육관·강당, 수련시설, 운동시설 중 체육관·운동장, 위락시설(주점영업의 용도로 쓰는 것은 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차 관련 시설, 방송통신시설 중 방송국·전신전화국·촬영소, 묘지 관련 시설 중 화장장 또는 관광휴게시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 500제곱미터 이상인 건축물","  3. 공장의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 2천 제곱미터 이상인 건축물. 다만, 화재의 위험이 적은 공장으로서 국토해양부령으로 정하는 공장은 제외한다.","  4. 건축물의 2층이 단독주택 중 다중주택 및 다가구주택, 공동주택, 제1종 근린생활시설(의료의 용도로 쓰는 시설만 해당한다), 제2종 근린생활시설 중 고시원, 의료시설, 노유자시설 중 아동 관련 시설 및 노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔, 숙박시설 또는 장례식장의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 400제곱미터 이상인 건축물","  5. 3층 이상인 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택은 제외한다), 동물 및 식물 관련 시설, 발전시설(발전소의 부속용도로 쓰는 시설은 제외한다), 교도소·감화원 또는 묘지 관련 시설(화장장은 제외한다)의 용도로 쓰는 건축물과 철강 관련 업종의 공장 중 제어실로 사용하기 위하여 연면적 50제곱미터 이하로 증축하는 부분은 제외한다.","  ② 제1항제1호 및 제2호에 해당하는 용도로 쓰지 아니하는 건축물로서 그 지붕틀을 불연재료로 한 경우에는 그 지붕틀을 내화구조로 아니할 수 있다.","  [전문개정 2008.10.29]"]},{"d":"2012-03-17","m":"[대통령령 제23469호, 2011. 12. 30, 일부개정]","l":["제56조(건축물의 내화구조) ① 법 제50조제1항에 따라 다음 각 호의 어느 하나에 해당하는 건축물(제5호에 해당하는 건축물로서 2층 이하인 건축물은 지하층 부분만 해당한다)의 주요구조부는 내화구조로 하여야 한다. 다만, 연면적이 50제곱미터 이하인 단층의 부속건축물로서 외벽 및 처마 밑면을 방화구조로 한 것과 무대의 바닥은 그러하지 아니하다. <개정 2009.6.30, 2010.2.18, 2010.8.17>","  1. 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 및 장례식장의 용도로 쓰는  2층이 단독주택 중 다중주택 및 다가구주택, 공동주택, 제1종 근린생활시설(의료의 용도로 쓰는 시설만 해당한다), 제2종 근린생활시설 중 다중생활시설, 의료시설, 노유자시설 중 아동 관련 시설 및 노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔, 숙박시설 또는 장례시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 400제곱미터 이상인 건축물","  5. 3층 이상인 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택은 제외한다), 동물 및 식물 관련 시설, 발전시설(발전소의 부속용도로 쓰는 시설은 제외한다), 교도소·감화원 또는 묘지 관련 시설(화장시설 및 동물화장시설은 제외한다)의 용도로 쓰는 건축물과 철강 관련 업종의 공장 중 제어실로 사용하기 위하여 연면적 50제곱미터 이하로 증축하는 부분은 제외한다.","  ② 제1항제1호 및 제2호에 해당하는 용도로 쓰지 아니하는 건축물로서 그 지붕틀을 불연재료로 한 경우에는 그 지붕틀을 내화구조로 아니할 수 있다.","  [전문개정 2008.10.29]"]},{"d":"2019-10-24","m":"[대통령령 제30145호, 2019. 10. 22, 일부개정]","l":["제56조(건축물의 내화구조) ① 법 제50조제1항 본문에 따라 다음 각 호의 어느 하나에 해당하는 건축물(제5호에 해당하는 건축물로서 2층 이하인 건축물은 지하층 부분만 해당한다)의 주요구조부와 지붕은 내화구조로 해야 한다. 다만, 연면적이 50제곱미터 이하인 단층의 부속건축물로서 외벽 및 처마 밑면을 방화구조로 한 것과 무대의 바닥은 그렇지 않다. <개정 2009.6.30, 2010.2.18, 2010.8.17, 2013.3.23, 2014.3.24, 2017.2.3, 2019.8.6, 2019.10.22>","  1. 제2종 근린생활시설 중 공연장ㆍ종교집회장(해당 용도로 쓰는 바닥면적의 합계가 각각 300제곱미터 이상인 경우만 해당한다), 문화 및 집회시설(전시장 및 동ㆍ식물원은 제외한다), 종교시설, 위락시설 중 주점영업 및 장례시설의 용도로 쓰는 건축물로서 관람실 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천 제곱미터) 이상인 건축물","  2. 문화 및 집회시설 중 전시장 또는 동ㆍ식물원, 판매시설, 운수시설, 교육연구시설에 설치하는 체육관ㆍ강당, 수련시설, 운동시설 중 체육관ㆍ운동장, 위락시설(주점영업의 용도로 쓰는 것은 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차 관련 시설, 방송통신시설 중 방송국ㆍ전신전화국ㆍ촬영소, 묘지 관련 시설 중 화장시설ㆍ동물화장시설 또는 관광휴게시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 500제곱미터 이상인 건축물","  3. 공장의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 2천 제곱미터 이상인 건축물. 다만, 화재의 위험이 적은 공장으로서 국토교통부령으로 정하는 공장은 제외한다.","  4. 건축물의 2층이 단독주택 중 다중주택 및 다가구주택, 공동주택, 제1종 근린생활시설(의료의 용도로 쓰는 시설만 해당한다), 제2종 근린생활시설 중 다중생활시설, 의료시설, 노유자시설 중 아동 관련 시설 및 노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔, 숙박시설 또는 장례시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 400제곱미터 이상인 건축물","  5. 3층 이상인 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택은 제외한다), 동물 및 식물 관련 시설, 발전시설(발전소의 부속용도로 쓰는 시설은 제외한다), 교도소ㆍ감화원 또는 묘지 관련 시설(화장시설 및 동물화장시설은 제외한다)의 용도로 쓰는 건축물과 철강 관련 업종의 공장 중 제어실로 사용하기 위하여 연면적 50제곱미터 이하로 증축하는 부분은 제외한다.","  ② 법 제50조제1항 단서에 따라 막구조의 건축물은 주요구조부에만 내화구조로 할 수 있다. <개정 2019.10.22>","  [전문개정 2008.10.29]"]},{"d":"2020-10-08","m":"[대통령령 제31100호, 2020. 10. 8, 일부개정]","l":["제56조(건축물의 내화구조) ① 법 제50조제1항 본문에 따라 다음 각 호의 어느 하나에 해당하는 건축물(제5호에 해당하는 건축물로서 2층 이하인 건축물은 지하층 부분만 해당한다)의 주요구조부와 지붕은 내화구조로 해야 한다. 다만, 연면적이 50제곱미터 이하인 단층의 부속건축물로서 외벽 및 처마 밑면을 방화구조로 한 것과 무대의 바닥은 그렇지 않다. <개정 2009.6.30, 2010.2.18, 2010.8.17, 2013.3.23, 2014.3.24, 2017.2.3, 2019.8.6, 2019.10.22>","  1. 제2종 근린생활시설 중 공연장·종교집회장(해당 용도로 쓰는 바닥면적의 합계가 각각 300제곱미터 이상인 경우만 해당한다), 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 및 장례시설의 용도로 쓰는 건축물로서 관람실 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천 제곱미터) 이상인 건축물","  2. 문화 및 집회시설 중 전시장 또는 동·식물원, 판매시설, 운수시설, 교육연구시설에 설치하는 체육관·강당, 수련시설, 운동시설 중 체육관·운동장, 위락시설(주점영업의 용도로 쓰는 것은 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차 관련 시설, 방송통신시설 중 방송국·전신전화국·촬영소, 묘지 관련 시설 중 화장시설·동물화장시설 또는 관광휴게시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 500제곱미터 이상인 건축물","  3. 공장의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 2천 제곱미터 이상인 건축물. 다만, 화재의 위험이 적은 공장으로서 국토교통부령으로 정하는 공장은 제외한다.","  4. 건축물의 2층이 단독주택 중 다중주택 및 다가구주택, 공동주택, 제1종 근린생활시설(의료의 용도로 쓰는 시설만 해당한다), 제2종 근린생활시설 중 다중생활시설, 의료시설, 노유자시설 중 아동 관련 시설 및 노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔, 숙박시설 또는 장례시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 400제곱미터 이상인 건축물","  5. 3층 이상인 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택은 제외한다), 동물 및 식물 관련 시설, 발전시설(발전소의 부속용도로 쓰는 시설은 제외한다), 교도소·감화원 또는 묘지 관련 시설(화장시설 및 동물화장시설은 제외한다)의 용도로 쓰는 건축물과 철강 관련 업종의 공장 중 제어실로 사용하기 위하여 연면적 50제곱미터 이하로 증축하는 부분은 제외한다.","  ② 법 제50조제1항 단서에 따라 막구조의 건축물은 주요구조부에만 내화구조로 할 수 있다. <개정 2019.10.22>","  [전문개정 2008.10.29]"]},{"d":"2022-04-29","m":"[대통령령 제32614호, 2022. 4. 29, 일부개정]","l":["제56조(건축물의 내화구조) ① 법 제50조제1항 본문에 따라 다음 각 호의 어느 하나에 해당하는 건축물(제5호에 해당하는 건축물로서 2층 이하인 건축물은 지하층 부분만 해당한다)의 주요구조부와 지붕은 내화구조로 해야 한다. 다만, 연면적이 50제곱미터 이하인 단층의 부속건축물로서 외벽 및 처마 밑면을 방화구조로 한 것과 무대의 바닥은 그렇지 않다. <개정 2009.6.30, 2010.2.18, 2010.8.17, 2013.3.23, 2014.3.24, 2017.2.3, 2019.8.6, 2019.10.22, 2021.1.5>","  1. 제2종 근린생활시설 중 공연장·종교집회장(해당 용도로 쓰는 바닥면적의 합계가 각각 300제곱미터 이상인 경우만 해당한다), 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 및 장례시설의 용도로 쓰는 건축물로서 관람실 또는 집회실의 바닥면적의 합계가 200제곱미터(옥외관람석의 경우에는 1천 제곱미터) 이상인 건축물","  2. 문화 및 집회시설 중 전시장 또는 동·식물원, 판매시설, 운수시설, 교육연구시설에 설치하는 체육관·강당, 수련시설, 운동시설 중 체육관·운동장, 위락시설(주점영업의 용도로 쓰는 것은 제외한다), 창고시설, 위험물저장 및 처리시설, 자동차 관련 시설, 방송통신시설 중 방송국·전신전화국·촬영소, 묘지 관련 시설 중 화장시설·동물화장시설 또는 관광휴게시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 500제곱미터 이상인 건축물","  3. 공장의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 2천 제곱미터 이상인 건축물. 다만, 화재의 위험이 적은 공장으로서 국토교통부령으로 정하는 공장은 제외한다.","  4. 건축물의 2층이 단독주택 중 다중주택 및 다가구주택, 공동주택, 제1종 근린생활시설(의료의 용도로 쓰는 시설만 해당한다), 제2종 근린생활시설 중 다중생활시설, 의료시설, 노유자시설 중 아동 관련 시설 및 노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔, 숙박시설 또는 장례시설의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 400제곱미터 이상인 건축물","  5. 3층 이상인 건축물 및 지하층이 있는 건축물. 다만, 단독주택(다중주택 및 다가구주택은 제외한다), 동물 및 식물 관련 시설, 발전시설(발전소의 부속용도로 쓰는 시설은 제외한다), 교도소·소년원 또는 묘지 관련 시설(화장시설 및 동물화장시설은 제외한다)의 용도로 쓰는 건축물과 철강 관련 업종의 공장 중 제어실로 사용하기 위하여 연면적 50제곱미터 이하로 증축하는 부분은 제외한다.","  ② 법 제50조제1항 단서에 따라 막구조의 건축물은 주요구조부에만 내화구조로 할 수 있다. <개정 2019.10.22>","  [전문개정 2008.10.29]"]}],"건축물의_마감재료_등":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제61조(건축물의 내장) ①법 제43조의 규정에 의하여 다음 각호의 1에 해당하는 건축물은 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 같다)의 마감을 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하고, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자가 실내에 접하는 부분의 마감을 불연재료 또는 준불연재료로 하여야 한다. 다만, 주요구조부가 내화구조 또는 불연재료로된 건축물로서 그 거실의 바닥면적(스프링클러 기타 이와 유사한 자동식소화설비를 설치한 부분의 바닥면적을 뺀 면적으로 한다. 이하 이 조에서 같다) 200제곱미터이내마다 방화구획이 되어 있는 경우에는 그러하지 아니하다.","  1. 관람집회시설ㆍ종교집회장ㆍ위락시설ㆍ전시시설 및 판매시설의 용도에 쓰이는 건축물로서 당해 용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  2. 숙박시설ㆍ유스호스텔ㆍ의료시설ㆍ아동시설ㆍ노인시설ㆍ다중주택ㆍ공동주택ㆍ기숙사 및 오피스텔의 용도에 쓰이는 건축물로서 3층이상의 층의 당해 용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  3. 위험물저장 및 처리시설(자가난방ㆍ자가발전소등의 용도에 쓰이는 시설을 포함한다),발전소, 방송ㆍ통신시설(전신전화국을 제외한다) 및 자동차관련시설의 용도에 쓰이는 건축물","  4. 5층이상인 건축물로서 5층이상의 층의 거실의 바닥면적의 합계가 500제곱미터이상인 건축물","  ②제1항제1호 내지 제3호의 규정에 의한 용도에 쓰이는 거실등을 지하층 또는 지하의 공작물에 설치한 경우에는 제1항의 규정에 불구하고 그 거실과 거실에서 지상으로 통하는 복도ㆍ계단 기타 통로의 벽 및 통로의 벽 및 반자가 실내에 면하는 부분의 마감을 불연재료 또는 준불연재료로 하여야 한다."]},{"d":"1996-01-06","m":"[대통령령 제14891호, 1995. 12. 30, 일부개정]","l":["제61조(건축물의 내장) ①법 제43조의 규정에 의하여 다음 각호의 1에 해당하는 건축물은 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 같다)의 마감을 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하고, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자가 실내에 접하는 부분의 마감을 불연재료 또는 준불연재료로 하여야 한다. 다만, 주요구조부가 내화구조 또는 불연재료로된 건축물로서 그 거실의 바닥면적(스프링클러 기타 이와 유사한 자동식소화설비를 설치한 부분의 바닥면적을 뺀 면적으로 한다. 이하 이 조에서 같다) 200제곱미터이내마다 방화구획이 되어 있는 경우에는 그러하지 아니하다.<개정 1995ㆍ12ㆍ30>","  1. 관람집회시설ㆍ종교집회장ㆍ위락시설ㆍ전시시설 및 판매시설의 용도에 쓰이는 건축물로서 당해 용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  2. 숙박시설ㆍ유스호스텔ㆍ의료시설ㆍ아동시설ㆍ노인시설ㆍ다중주택ㆍ공동주택ㆍ기숙사 및 오피스텔의 용도에 쓰이는 건축물로서 3층이상의 층의 당해 용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  3. 위험물저장 및 처리시설(자가난방ㆍ자가발전등의 용도에 쓰이는 시설을 포함한다),발전소, 방송ㆍ통신시설(전신전화국을 제외한다), 공장 및 자동차관련시설의 용도에 쓰이는 건축물","  4. 5층이상인 건축물로서 5층이상의 층의 거실의 바닥면적의 합계가 500제곱미터이상인 건축물","  ②제1항제1호 내지 제3호의 규정에 의한 용도에 쓰이는 거실등을 지하층 또는 지하의 공작물에 설치한 경우에는 제1항의 규정에 불구하고 그 거실과 거실에서 지상으로 통하는 복도ㆍ계단 기타 통로의 벽 및 통로의 벽 및 반자가 실내에 면하는 부분의 마감을 불연재료 또는 준불연재료로 하여야 한다.","  ③노래연습장ㆍ단란주점 및 유흥주점의 용도에 쓰이는 건축물의 경우에는 제1항의 규정에 불구하고 당해 용도에 쓰이는 거실의 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료 또는 준불연재료로 하여야 한다.<신설 1995ㆍ12ㆍ30>"]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제61조(건축물의 내부마감재료) 법 제43조의 규정에 의하여 다음 각호의 1에 해당하는 건축물의 내부마감재료는 건설교통부령이 정하는 기준에 적합한 것이어야 한다. 다만, 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 그 거실의 바닥면적(스프링클러 기타 이와 유사한 자동식소화설비를 설치한 부분의 바닥면적을 뺀 면적으로 한다. 이하 이 조에서 같다) 200제곱미터이내마다 방화구획이 되어 있는 경우에는 그러하지 아니하다.","  1. 문화 및 집회시설, 판매 및 영업시설 또는 위락시설의 용도에 쓰이는 건축물로서 당해용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  2. 단독주택중 다중주택, 공동주택, 숙박시설, 의료시설, 교육연구 및 복지시설중 아동관련시설ㆍ노인복지시설 및 유스호스텔 또는 업무시설중 오피스텔의 용도에 쓰이는 건축물로서 3층이상의 층의 당해용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  3. 위험물저장 및 처리시설(자가난방ㆍ자가발전등의 용도에 쓰이는 시설을 포함한다), 공장, 자동차관련시설 또는 공공용시설중 발전소ㆍ방송국 및 촬영소로 사용되는 건축물","   4. 5층이상의 층의 거실의 바닥면적의 합계가 500제곱미터이상인 건축물","  [전문개정 1999.4.30]"]},{"d":"2008-02-29","m":"[대통령령 제20722호, 2008. 2. 29, 타법개정]","l":["제61조 (건축물의 내부마감재료) 법 제43조에서 대통령령이 정하는 용도 및 규모의 건축물\"이란 다음 각 호의 어느 하나에 해당하는 건축물을 말한다. 다만","  1. 문화 및 집회시설(예식장을 제외한다), 종교시설, 판매시설, 운수시설 또는 위락시설(단란주점 및 주점영업을 제외한다)의 용도에 쓰이는 건축물로서 당해용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  2. 단독주택 중 다중주택·다가구주택, 공동주택, 제2종 근린생활시설 중 학원·독서실, 숙박시설(여관 및 여인숙을 제외한다), 의료시설, 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔 또는 장례식장의 용도에 쓰이는 건축물로서 3층이상의 층의 해당용도에 쓰이는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터)이상인 건축물","  3. 위험물저장 및 처리시설(자가난방·자가발전등의 용도에 쓰이는 시설을 포함한다), 자동차관련시설, 방송통신시설 중 방송국·촬영소 또는 발전시설로 사용되는 건축물","  4. 공장의 용도에 사용되는 건축물. 다만, 건축물이 1층 이하이고, 연면적이 1천제곱미터 미만으로서 다음 각 목의 요건을 모두 갖춘 경우를 제외한다.","    가. 국토해양부령이 정하는 화재위험이 적은 공장용도로 사용할 것","    나. 화재시 대피가 가능한 국토해양부령이 정하는 출구를 갖출 것","    다. 국토해양부령이 정하는 성능을 갖춘 복합자재(불연성인 재료와 불연성이 아닌 재료가 복합된 자재로서 양면 철판과 심재(心材)로 구성된 것을 말한다)를 내부마감재료로 사용할 것","  5. 5층이상의 층의 거실의 바닥면적의 합계가 500제곱미터이상인 건축물","  6. 제2종 근린생활시설 중 공연장·당구장, 문화 및 집회시설 중 예식장, 교육연구시설 중 학교(초등학교에 한한다), 수련시설, 숙박시설 중 여관·여인숙, 위락시설 중 주점영업 또는 「다중이용업소의 안전관리에 관한 특별법 시행령」 제2조의 규정에 의한 다중이용업(유흥주점영업을 제외한다)의 용도에 쓰이는 건축물","  [전문개정 1999.4.30]"]},{"d":"2008-10-29","m":"[대통령령 제21098호, 2008. 10. 29, 일부개정]","l":["제61조 (건축물의 내부 마감재료) 법 제52조에서 대통령령으로 정하는 용도 및 규모의 건축물\"이란 다음 각 호의 어느 하나에 해당하는 건축물을 말한다. 다만","  1. 문화 및 집회시설(예식장은 제외한다), 종교시설, 판매시설, 운수시설 및 위락시설(단란주점 및 주점영업은 제외한다)의 용도로 쓰는 건축물로서 그 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터) 이상인 건축물","  2. 단독주택 중 다중주택·다가구주택, 공동주택, 제2종 근린생활시설 중 학원·독서실, 숙박시설(여관 및 여인숙은 제외한다), 의료시설, 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔 및 장례식장의 용도로 쓰는 건축물로서 3층 이상인 층의 그 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터) 이상인 건축물","  3. 위험물저장 및 처리시설(자가난방과 자가발전 등의 용도로 쓰는 시설을 포함한다), 자동차 관련 시설, 방송통신시설 중 방송국·촬영소 또는 발전시설의 용도로 쓰는 건축물","  4. 공장의 용도로 쓰는 건축물. 다만, 건축물이 1층 이하이고, 연면적 1천 제곱미터 미만으로서 다음 각 목의 요건을 모두 갖춘 경우는 제외한다.","    가. 국토해양부령으로 정하는 화재위험이 적은 공장용도로 쓸 것","    나. 화재 시 대피가 가능한 국토해양부령으로 정하는 출구를 갖출 것","    다. 국토해양부령으로 정하는 성능을 갖춘 복합자재[불연성인 재료와 불연성이 아닌 재료가 복합된 자재로서 양면 철판과 심재(心材)로 구성된 것을 말한다]를 내부 마감재료로 쓸 것","  5. 5층 이상인 층 거실의 바닥면적의 합계가 500제곱미터 이상인 건축물","  6. 제2종 근린생활시설 중 공연장·당구장, 문화 및 집회시설 중 예식장, 교육연구시설 중 학교(초등학교만 해당한다), 수련시설, 숙박시설 중 여관·여인숙, 위락시설 중 주점영업 또는 「다중이용업소의 안전관리에 관한 특별법 시행령」 제2조에 따른 다중이용업(유흥주점영업은 제외한다)의 용도로 쓰는 건축물","  [전문개정 2008.10.29]"]},{"d":"2013-03-23","m":"[대통령령 제24443호, 2013. 3. 23, 타법개정]","l":["제61조(건축물의 마감재료) ①법 제52조제1항에서 대통령령으로 정하는 용도 및 규모의 건축물\"이란 다음 각 호의 어느 하나에 해당하는 건축물을 말한다. 다만","  1. 문화 및 집회시설(예식장은 제외한다), 종교시설, 판매시설, 운수시설 및 위락시설(단란주점 및 주점영업은 제외한다)의 용도로 쓰는 건축물로서 그 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터) 이상인 건축물","  2. 단독주택 중 다중주택ㆍ다가구주택, 공동주택, 제2종 근린생활시설 중 학원ㆍ독서실ㆍ고시원, 숙박시설(여관 및 여인숙은 제외한다), 의료시설, 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설ㆍ노인복지시설, 수련시설 중 유스호스텔, 업무시설 중 오피스텔 및 장례식장의 용도로 쓰는 건축물로서 3층 이상인 층의 그 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터(주요구조부가 내화구조 또는 불연재료로 된 건축물의 경우에는 400제곱미터) 이상인 건축물","  3. 위험물저장 및 처리시설(자가난방과 자가발전 등의 용도로 쓰는 시설을 포함한다), 자동차 관련 시설, 방송통신시설 중 방송국ㆍ촬영소 또는 발전시설의 용도로 쓰는 건축물","  4. 공장의 용도로 쓰는 건축물. 다만, 건축물이 1층 이하이고, 연면적 1천 제곱미터 미만으로서 다음 각 목의 요건을 모두 갖춘 경우는 제외한다.","    가. 국토교통부령으로 정하는 화재위험이 적은 공장용도로 쓸 것","    나. 화재 시 대피가 가능한 국토교통부령으로 정하는 출구를 갖출 것","    다. 국토교통부령으로 정하는 성능을 갖춘 복합자재[불연성인 재료와 불연성이 아닌 재료가 복합된 자재로서 양면 철판과 심재(心材)로 구성된 것을 말한다]를 내부 마감재료로 쓸 것","  5. 5층 이상인 층 거실의 바닥면적의 합계가 500제곱미터 이상인 건축물","  6. 제2종 근린생활시설 중 공연장ㆍ당구장, 문화 및 집회시설 중 예식장, 교육연구시설 중 학교(초등학교만 해당한다), 수련시설, 숙박시설 중 여관ㆍ여인숙, 위락시설 중 주점영업 또는 「다중이용업소의 안전관리에 관한 특별법 시행령」 제2조에 따른 다중이용업(유흥주점영업은 제외한다)의 용도로 쓰는 건축물","  7. 창고로 쓰이는 바닥면적 3천 제곱미터(스프링클러나 그 밖에 이와 비슷한 자동식 소화설비를 설치한 경우에는 6천 제곱미터) 이상인 건축물","  ② 법 제52조제2항에서 대통령령으로 정하는 건축물\"이란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <신설 2010.12.13","  1. 상업지역(근린상업지역은 제외한다)의 건축물로서 다음 각 목의 어느 하나에 해당하는 것","    가. 「다중이용업소의 안전관리에 관한 특별법」 제2조제1항제1호에 따른 다중이용업의 용도로 쓰는 건축물로서 그 용도로 쓰는 바닥면적의 합계가 2천제곱미터 이상인 건축물","    나. 공장(국토교통부령으로 정하는 화재 위험이 적은 공장은 제외한다)의 용도로 쓰는 건축물로부터 6미터 이내에 위치한 건축물","  2. 고층건축물","  [전문개정 2008.10.29]","  [제목개정 2010.12.13]"]}],"건축물의_마감재료_등_1":[{"d":"1999-05-09","m":"[건설교통부령 제184호, 1999. 5. 7, 제정]","l":["제24조 (건축물의 내장) ①건축법 제43조의 규정에 의하여 영 제61조 각호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하며, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자의 실내에 접하는 부분의 마감은 불연재료 또는 준불연재료로 하여야 한다.","  ②영 제61조 각호의 건축물중 다음 각호의 1에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항의 규정에 불구하고 불연재료 또는 준불연재료로 하여야 한다.","  1. 영 제61조제1호 내지 제3호의 규정에 의한 용도에 쓰이는 거실등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실","  2. 제2종 근린생활시설중 단란주점 및 노래연습장 또는 위락시설중 단란주점 및 주점영업의 용도에 쓰이는 건축물의 거실"]},{"d":"2003-01-06","m":"[건설교통부령 제348호, 2003. 1. 6, 일부개정]","l":["제24조 (건축물의 내부마감재료<개정 2003.1.6>) ①건축법 제43조의 규정에 의하여 영 제61조 각호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하며, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자의 실내에 접하는 부분의 마감은 불연재료 또는 준불연재료로 하여야 한다.","  ②영 제61조 각호의 건축물중 다음 각호의 1에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항의 규정에 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6>","  1. 영 제61조제1호 내지 제3호의 규정에 의한 용도에 쓰이는 거실등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실","  2. 영 제61조제5호의 규정에 의한 용도에 쓰이는 건축물의 거실","  ③영 제61조 각호외의 부분 본문에서 내부마감재료\"라 함은 건축물 내부의 천장ㆍ반자ㆍ벽(간막이벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만"]},{"d":"2005-07-22","m":"[건설교통부령 제461호, 2005. 7. 22, 일부개정]","l":["제24조 (건축물의 내부마감재료<개정 2003.1.6>) ①「건축법」 제43조의 규정에 의하여 영 제61조 각호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하며, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자의 실내에 접하는 부분의 마감은 불연재료 또는 준불연재료로 하여야 한다. <개정 2005.7.22>","  ②영 제61조 각 호의 건축물중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항의 규정에 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22>","  1. 영 제61조제1호 내지 제4호의 규정에 의한 용도에 쓰이는 거실등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실","  2. 영 제61조제6호의 규정에 의한 용도에 쓰이는 건축물의 거실","  ③법 제43조에서 내부마감재료\"라 함은 건축물 내부의 천장ㆍ반자ㆍ벽(간막이벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만"]},{"d":"2006-06-29","m":"[건설교통부령 제523호, 2006. 6. 29, 일부개정]","l":["제24조 (건축물의 내부마감재료<개정 2003.1.6>) ①「건축법」 제43조의 규정에 의하여 영 제61조 각호의 건축물에 대하여는 그 거실의 벽 및 반 외기(外氣)에 면하는 천장 및 벽체를 포함한다]에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 항 및 제6항에서 같다)로 사용하여야 한다. 다만, 외벽 마감재료를 구성하는 재료 전체를 하나로 보아 불연재료 또는 준불연재료에 해당하는 경우 마감재료 중 단열재는 난연재료로 사용할 수 있다. <개정 2015.10.7>","  ⑥ 제5항에도 불구하고 영 제61조제2항제2호에 해당하는 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연재료를 마감재료로 사용할 수 있다. <개정 2015.10.7>","  [제목개정 2010.12.30]"]},{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제24조(건축물의 마감재료) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하며, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자의 실내에 접하는 부분의 마감은 불연재료 또는 준불연재료로 하여야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30>","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ④영 제61조제1항제2호에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용하여서는 아니 된다. <신설 2006.6.29, 2010.12.30>","  ⑤ 영 제61조제2항제1호부터 제3호까지의 규정에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우 난연재료(제2호의 경우 단열재만 해당한다)를 사용할 수 있다. <개정 2019.8.6>","  1. 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우","  2. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우","  ⑥ 제5항에도 불구하고 영 제61조제2항제1호 및 제3호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료를 마감재료로 사용할 수 있다. <개정 2019.8.6>","  ⑦ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기(外氣)에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. 다만, 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우 난연재료를 단열재로 사용할 수 있다. <신설 2019.8.6>","  [제목개정 2010.12.30]"]},{"d":"2021-07-05","m":"[국토교통부령 제868호, 2021. 7. 5, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하며, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자의 실내에 접하는 부분의 마감은 불연재료 또는 준불연재료로 하여야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30>","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ④영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26>","  ⑤ 영 제61조제2항제1호부터 제3호까지의 규정에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우 난연재료(제2호의 경우 단열재만 해당한다)를 사용할 수 있다. <개정 2019.8.6>","  1. 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우","  2. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우","  ⑥ 제5항에도 불구하고 영 제61조제2항제1호 및 제3호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료를 마감재료로 사용할 수 있다. <개정 2019.8.6>","  ⑦ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스크링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제5항 및 제6항을 적용하지 않을 수 있다. <신설 2021.7.5>","  ⑧ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기(外氣)에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. 다만, 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우 난연재료를 단열재로 사용할 수 있다. <신설 2019.8.6, 2021.7.5>","  ⑨ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창[「산업표준화법」에 따른 한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]으로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창으로 설치하지 않을 수 있다. <신설 2021.7.5>","  [제목개정 2021.7.5]"]},{"d":"2021-08-07","m":"[국토교통부령 제832호, 2021. 3. 26, 일부개정]","l":["제24조(건축물의 마감재료) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하여야 하며, 그 거실에서 지상으로 통하는 주된 복도ㆍ계단 기타 통로의 벽 및 반자의 실내에 접하는 부분의 마감은 불연재료 또는 준불연재료로 하여야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30>","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ④영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26>","  ⑤ 영 제61조제2항제1호부터 제3호까지의 규정에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우 난연재료(제2호의 경우 단열재만 해당한다)를 사용할 수 있다. <개정 2019.8.6>","  1. 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우","  2. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우","  ⑥ 제5항에도 불구하고 영 제61조제2항제1호 및 제3호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료를 마감재료로 사용할 수 있다. <개정 2019.8.6>","  ⑦ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기(外氣)에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. 다만, 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우 난연재료를 단열재로 사용할 수 있다. <신설 2019.8.6>","  [제목개정 2010.12.30]"]},{"d":"2022-02-11","m":"[국토교통부령 제884호, 2021. 9. 3, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감재료(영 제61조제1항제4호에 해당하는 건축물의 경우에는 단열재를 포함한다)는 불연재료ㆍ준불연재료 또는 난연재료를 사용해야 한다. 다만, 다음 각 호에 해당하는 부분의 마감재료는 불연재료 또는 준불연재료를 사용해야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30, 2021.9.3>","  1. 거실에서 지상으로 통하는 주된 복도ㆍ계단, 그 밖의 벽 및 반자의 실내에 접하는 부분","  2. 강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③ 제1항 및 제2항에도 불구하고 영 제61조제1항제4호에 해당하는 건축물에서 단열재를 사용하는 경우로서 해당 건축물의 구조, 설계 또는 시공방법 등을 고려할 때 단열재로 불연재료ㆍ준불연재료 또는 난연재료를 사용하는 것이 곤란하여 법 제4조에 따른 건축위원회(시ㆍ도 및 시ㆍ군ㆍ구에 두는 건축위원회를 말한다)의 심의를 거친 경우에는 단열재를 불연재료ㆍ준불연재료 또는 난연재료가 아닌 것으로 사용할 수 있다. <신설 2021.9.3>","  ④법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ⑤영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26, 2021.9.3>","  ⑥ 영 제61조제2항제1호부터 제3호까지의 규정 및 제5호에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우 난연재료(제2호의 경우 단열재만 해당한다)를 사용할 수 있다. <개정 2019.8.6, 2021.9.3>","  1. 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우","  2. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우","  ⑦ 제6항에도 불구하고 영 제61조제2항제1호ㆍ제3호 및 제5호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료를 마감재료로 사용할 수 있다. <개정 2019.8.6, 2021.9.3>","  ⑧ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스크링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제6항 및 제7항을 적용하지 않을 수 있다. <신설 2021.7.5, 2021.9.3>","  ⑨ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. 다만, 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 고시하는 기준에 따라 난연성능을 시험한 결과 불연재료 또는 준불연재료에 해당하는 경우 난연재료를 단열재로 사용할 수 있다. <신설 2019.8.6, 2021.7.5, 2021.9.3>","  ⑩ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창[「산업표준화법」에 따른 한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]으로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창으로 설치하지 않을 수 있다. <신설 2021.7.5, 2021.9.3>","  [제목개정 2021.7.5]"]},{"d":"2022-02-11","m":"[국토교통부령 제1106호, 2022. 2. 10, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감재료(영 제61조제1항제4호에 해당하는 건축물의 경우에는 단열재를 포함한다)는 불연재료ㆍ준불연재료 또는 난연재료를 사용해야 한다. 다만, 다음 각 호에 해당하는 부분의 마감재료는 불연재료 또는 준불연재료를 사용해야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30, 2021.9.3>","  1. 거실에서 지상으로 통하는 주된 복도ㆍ계단, 그 밖의 벽 및 반자의 실내에 접하는 부분","  2. 강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③ 제1항 및 제2항에도 불구하고 영 제61조제1항제4호에 해당하는 건축물에서 단열재를 사용하는 경우로서 해당 건축물의 구조, 설계 또는 시공방법 등을 고려할 때 단열재로 불연재료ㆍ준불연재료 또는 난연재료를 사용하는 것이 곤란하여 법 제4조에 따른 건축위원회(시ㆍ도 및 시ㆍ군ㆍ구에 두는 건축위원회를 말한다)의 심의를 거친 경우에는 단열재를 불연재료ㆍ준불연재료 또는 난연재료가 아닌 것으로 사용할 수 있다. <신설 2021.9.3>","  ④법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ⑤영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26, 2021.9.3>","  ⑥ 영 제61조제2항제1호부터 제3호까지의 규정 및 제5호에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 마감재료를 설치하는 경우에는 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  1. 삭제 <2022.2.10>","  2. 삭제 <2022.2.10>","  ⑦ 제6항에도 불구하고 영 제61조제2항제1호ㆍ제3호 및 제5호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  ⑧ 제6항 및 제7항에 따른 마감재료가 둘 이상의 재료로 제작된 것인 경우 해당 마감재료는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10>","  1. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험(실제 시공될 건축물의 구조와 유사한 모형으로 시험하는 것을 말한다. 이하 같다)을 한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 마감재료를 구성하는 각각의 재료에 대하여 난연성능을 시험한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  ⑨ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스크링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제6항부터 제8항까지의 규정을 적용하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10>","  ⑩ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. <신설 2019.8.6, 2021.7.5, 2021.9.3, 2022.2.10>","  ⑪ 강판과 심재로 이루어진 복합자재를 마감재료로 사용하는 경우 해당 복합자재는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10>","  1. 강판과 심재 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험을 실시한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 강판: 다음 각 목의 구분에 따른 기준을 모두 충족할 것","    가. 두께[도금 이후 도장(塗裝) 전 두께를 말한다]: 0.5밀리미터 이상","    나. 앞면 도장 횟수: 2회 이상","    다. 도금의 부착량: 도금의 종류에 따라 다음의 어느 하나에 해당할 것. 이 경우 도금의 종류는 한국산업표준에 따른다.","      1) 용융 아연 도금 강판: 180g/㎡ 이상","      2) 용융 아연 알루미늄 마그네슘 합금 도금 강판: 90g/㎡ 이상","      3) 용융 55% 알루미늄 아연 마그네슘 합금 도금 강판:  90g/㎡ 이상","      4) 용융 55% 알루미늄 아연 합금 도금 강판: 90g/㎡ 이상","      5) 그 밖의 도금: 국토교통부장관이 정하여 고시하는 기준 이상","  3. 심재: 강판을 제거한 심재가 다음 각 목의 어느 하나에 해당할 것","    가. 한국산업표준에 따른 그라스울 보온판 또는 미네랄울 보온판으로서 국토교통부장관이 정하여 고시하는 기준에 적합한 것","    나. 불연재료 또는 준불연재료인 것","  ⑫ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창[한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]으로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창으로 설치하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10>","  [제목개정 2021.7.5]"]},{"d":"2023-08-31","m":"[국토교통부령 제1247호, 2023. 8. 31, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감재료(영 제61조제1항제4호에 해당하는 건축물의 경우에는 단열재를 포함한다)는 불연재료ㆍ준불연재료 또는 난연재료를 사용해야 한다. 다만, 다음 각 호에 해당하는 부분의 마감재료는 불연재료 또는 준불연재료를 사용해야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30, 2021.9.3>","  1. 거실에서 지상으로 통하는 주된 복도ㆍ계단, 그 밖의 벽 및 반자의 실내에 접하는 부분","  2. 강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③ 제1항 및 제2항에도 불구하고 영 제61조제1항제4호에 해당하는 건축물에서 단열재를 사용하는 경우로서 해당 건축물의 구조, 설계 또는 시공방법 등을 고려할 때 단열재로 불연재료ㆍ준불연재료 또는 난연재료를 사용하는 것이 곤란하여 법 제4조에 따른 건축위원회(시ㆍ도 및 시ㆍ군ㆍ구에 두는 건축위원회를 말한다)의 심의를 거친 경우에는 단열재를 불연재료ㆍ준불연재료 또는 난연재료가 아닌 것으로 사용할 수 있다. <신설 2021.9.3>","  ④법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ⑤영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26, 2021.9.3>","  ⑥ 영 제61조제2항제1호부터 제3호까지의 규정 및 제5호에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 마감재료를 설치하는 경우에는 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  1. 삭제 <2022.2.10>","  2. 삭제 <2022.2.10>","  ⑦ 제6항에도 불구하고 영 제61조제2항제1호ㆍ제3호 및 제5호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  ⑧ 제6항 및 제7항에 따른 마감재료가 둘 이상의 재료로 제작된 것인 경우 해당 마감재료는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10, 2023.8.31>","  1. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험(실제 시공될 건축물의 구조와 유사한 모형으로 시험하는 것을 말한다. 이하 같다)을 한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 마감재료를 구성하는 각각의 재료에 대하여 난연성능을 시험한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것. 다만, 제6조제1호에 따른 불연재료 사이에 다른 재료(두께가 5밀리미터 이하인 경우만 해당한다)를 부착하여 제작한 재료의 경우에는 해당 재료 전체를 하나의 재료로 보고 난연성능을 시험할 수 있으며, 같은 호에 따른 불연재료에 0.1밀리미터 이하의 두께로 도장을 한 재료의 경우에는 불연재료의 성능기준을 충족한 것으로 보고 난연성능 시험을 생략할 수 있다.","  ⑨ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스크링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제6항부터 제8항까지의 규정을 적용하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10>","  ⑩ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. <신설 2019.8.6, 2021.7.5, 2021.9.3, 2022.2.10>","  ⑪ 강판과 심재로 이루어진 복합자재를 마감재료로 사용하는 경우 해당 복합자재는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10>","  1. 강판과 심재 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험을 실시한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 강판: 다음 각 목의 구분에 따른 기준을 모두 충족할 것","    가. 두께[도금 이후 도장(塗裝) 전 두께를 말한다]: 0.5밀리미터 이상","    나. 앞면 도장 횟수: 2회 이상","    다. 도금의 부착량: 도금의 종류에 따라 다음의 어느 하나에 해당할 것. 이 경우 도금의 종류는 한국산업표준에 따른다.","      1) 용융 아연 도금 강판: 180g/㎡ 이상","      2) 용융 아연 알루미늄 마그네슘 합금 도금 강판: 90g/㎡ 이상","      3) 용융 55% 알루미늄 아연 마그네슘 합금 도금 강판:  90g/㎡ 이상","      4) 용융 55% 알루미늄 아연 합금 도금 강판: 90g/㎡ 이상","      5) 그 밖의 도금: 국토교통부장관이 정하여 고시하는 기준 이상","  3. 심재: 강판을 제거한 심재가 다음 각 목의 어느 하나에 해당할 것","    가. 한국산업표준에 따른 그라스울 보온판 또는 미네랄울 보온판으로서 국토교통부장관이 정하여 고시하는 기준에 적합한 것","    나. 불연재료 또는 준불연재료인 것","  ⑫ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창[한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]으로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창으로 설치하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10>","  [제목개정 2021.7.5]"]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감재료(영 제61조제1항제4호에 해당하는 건축물의 경우에는 단열재를 포함한다)는 불연재료ㆍ준불연재료 또는 난연재료를 사용해야 한다. 다만, 다음 각 호에 해당하는 부분의 마감재료는 불연재료 또는 준불연재료를 사용해야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30, 2021.9.3>","  1. 거실에서 지상으로 통하는 주된 복도ㆍ계단, 그 밖의 벽 및 반자의 실내에 접하는 부분","  2. 강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③ 제1항 및 제2항에도 불구하고 영 제61조제1항제4호에 해당하는 건축물에서 단열재를 사용하는 경우로서 해당 건축물의 구조, 설계 또는 시공방법 등을 고려할 때 단열재로 불연재료ㆍ준불연재료 또는 난연재료를 사용하는 것이 곤란하여 법 제4조에 따른 건축위원회(시ㆍ도 및 시ㆍ군ㆍ구에 두는 건축위원회를 말한다)의 심의를 거친 경우에는 단열재를 불연재료ㆍ준불연재료 또는 난연재료가 아닌 것으로 사용할 수 있다. <신설 2021.9.3>","  ④법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ⑤영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26, 2021.9.3>","  ⑥ 영 제61조제2항제1호부터 제3호까지의 규정 및 제5호에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 마감재료를 설치하는 경우에는 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  1. 삭제 <2022.2.10>","  2. 삭제 <2022.2.10>","  ⑦ 제6항에도 불구하고 영 제61조제2항제1호ㆍ제3호 및 제5호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  ⑧ 제6항 및 제7항에 따른 마감재료가 둘 이상의 재료로 제작된 것인 경우 해당 마감재료는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10, 2023.8.31>","  1. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험(실제 시공될 건축물의 구조와 유사한 모형으로 시험하는 것을 말한다. 이하 같다)을 한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 마감재료를 구성하는 각각의 재료에 대하여 난연성능을 시험한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것. 다만, 제6조제1호에 따른 불연재료 사이에 다른 재료(두께가 5밀리미터 이하인 경우만 해당한다)를 부착하여 제작한 재료의 경우에는 해당 재료 전체를 하나의 재료로 보고 난연성능을 시험할 수 있으며, 같은 호에 따른 불연재료에 0.1밀리미터 이하의 두께로 도장을 한 재료의 경우에는 불연재료의 성능기준을 충족한 것으로 보고 난연성능 시험을 생략할 수 있다.","  ⑨ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스크링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제6항부터 제8항까지의 규정을 적용하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10>","  ⑩ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. <신설 2019.8.6, 2021.7.5, 2021.9.3, 2022.2.10>","  ⑪ 강판과 심재로 이루어진 복합자재를 마감재료로 사용하는 경우 해당 복합자재는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10>","  1. 강판과 심재 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험을 실시한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 강판: 다음 각 목의 구분에 따른 기준을 모두 충족할 것","    가. 두께[도금 이후 도장(塗裝) 전 두께를 말한다]: 0.5밀리미터 이상","    나. 앞면 도장 횟수: 2회 이상","    다. 도금의 부착량: 도금의 종류에 따라 다음의 어느 하나에 해당할 것. 이 경우 도금의 종류는 한국산업표준에 따른다.","      1) 용융 아연 도금 강판: 180g/㎡ 이상","      2) 용융 아연 알루미늄 마그네슘 합금 도금 강판: 90g/㎡ 이상","      3) 용융 55% 알루미늄 아연 마그네슘 합금 도금 강판:  90g/㎡ 이상","      4) 용융 55% 알루미늄 아연 합금 도금 강판: 90g/㎡ 이상","      5) 그 밖의 도금: 국토교통부장관이 정하여 고시하는 기준 이상","  3. 심재: 강판을 제거한 심재가 다음 각 목의 어느 하나에 해당할 것","    가. 한국산업표준에 따른 그라스울 보온판 또는 미네랄울 보온판으로서 국토교통부장관이 정하여 고시하는 기준에 적합한 것","    나. 불연재료 또는 준불연재료인 것","  ⑫ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창호[한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 창틀과 유리 등으로 구성된 유리구획을 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창호로 설치하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10, 2024.11.15>","  [제목개정 2021.7.5]"]},{"d":"2025-09-19","m":"[국토교통부령 제1524호, 2025. 9. 19, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감재료(영 제61조제1항제4호에 해당하는 건축물의 경우에는 단열재를 포함한다)는 불연재료ㆍ준불연재료 또는 난연재료를 사용해야 한다. 다만, 다음 각 호에 해당하는 부분의 마감재료는 불연재료 또는 준불연재료를 사용해야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30, 2021.9.3>","  1. 거실에서 지상으로 통하는 주된 복도ㆍ계단, 그 밖의 벽 및 반자의 실내에 접하는 부분","  2. 강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③ 제1항 및 제2항에도 불구하고 영 제61조제1항제4호에 해당하는 건축물에서 단열재를 사용하는 경우로서 해당 건축물의 구조, 설계 또는 시공방법 등을 고려할 때 단열재로 불연재료ㆍ준불연재료 또는 난연재료를 사용하는 것이 곤란하여 법 제4조에 따른 건축위원회(시ㆍ도 및 시ㆍ군ㆍ구에 두는 건축위원회를 말한다)의 심의를 거친 경우에는 단열재를 불연재료ㆍ준불연재료 또는 난연재료가 아닌 것으로 사용할 수 있다. <신설 2021.9.3>","  ④법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ⑤영 제61조제1항제1호의2에 따른 공동주택에는 「다중이용시설 등의 실내공기질관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따라 환경부장관이 고시한 오염물질방출 건축자재를 사용해서는 안 된다. <신설 2006.6.29, 2010.12.30, 2021.3.26, 2021.9.3>","  ⑥ 영 제61조제2항제1호부터 제3호까지의 규정 및 제5호에 해당하는 건축물의 외벽에는 법 제52조제2항 후단에 따라 불연재료 또는 준불연재료를 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)로 사용해야 한다. 다만, 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 마감재료를 설치하는 경우에는 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  1. 삭제 <2022.2.10>","  2. 삭제 <2022.2.10>","  ⑦ 제6항에도 불구하고 영 제61조제2항제1호ㆍ제3호 및 제5호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  ⑧ 제6항 및 제7항에 따른 마감재료가 둘 이상의 재료로 제작된 것인 경우 해당 마감재료는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10, 2023.8.31>","  1. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험(실제 시공될 건축물의 구조와 유사한 모형으로 시험하는 것을 말한다. 이하 같다)을 한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 마감재료를 구성하는 각각의 재료에 대하여 난연성능을 시험한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것. 다만, 제6조제1호에 따른 불연재료 사이에 다른 재료(두께가 5밀리미터 이하인 경우만 해당한다)를 부착하여 제작한 재료의 경우에는 해당 재료 전체를 하나의 재료로 보고 난연성능을 시험할 수 있으며, 같은 호에 따른 불연재료에 0.1밀리미터 이하의 두께로 도장을 한 재료의 경우에는 불연재료의 성능기준을 충족한 것으로 보고 난연성능 시험을 생략할 수 있다.","  ⑨ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스프링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제6항부터 제8항까지의 규정을 적용하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10, 2025.9.19>","  ⑩ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. <신설 2019.8.6, 2021.7.5, 2021.9.3, 2022.2.10>","  ⑪ 강판과 심재로 이루어진 복합자재를 마감재료로 사용하는 경우 해당 복합자재는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10>","  1. 강판과 심재 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험을 실시한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 강판: 다음 각 목의 구분에 따른 기준을 모두 충족할 것","    가. 두께[도금 이후 도장(塗裝) 전 두께를 말한다]: 0.5밀리미터 이상","    나. 앞면 도장 횟수: 2회 이상","    다. 도금의 부착량: 도금의 종류에 따라 다음의 어느 하나에 해당할 것. 이 경우 도금의 종류는 한국산업표준에 따른다.","      1) 용융 아연 도금 강판: 180g/㎡ 이상","      2) 용융 아연 알루미늄 마그네슘 합금 도금 강판: 90g/㎡ 이상","      3) 용융 55% 알루미늄 아연 마그네슘 합금 도금 강판:  90g/㎡ 이상","      4) 용융 55% 알루미늄 아연 합금 도금 강판: 90g/㎡ 이상","      5) 그 밖의 도금: 국토교통부장관이 정하여 고시하는 기준 이상","  3. 심재: 강판을 제거한 심재가 다음 각 목의 어느 하나에 해당할 것","    가. 한국산업표준에 따른 그라스울 보온판 또는 미네랄울 보온판으로서 국토교통부장관이 정하여 고시하는 기준에 적합한 것","    나. 불연재료 또는 준불연재료인 것","  ⑫ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창호[한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 창틀과 유리 등으로 구성된 유리구획을 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창호로 설치하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10, 2024.11.15>","  [제목개정 2021.7.5]"]},{"d":"2026-10-06","m":"[국토교통부령 제1631호, 2026. 10. 6, 일부개정]","l":["제24조(건축물의 마감재료 등) ①법 제52조제1항에 따라 영 제61조제1항 각 호의 건축물에 대하여는 그 거실의 벽 및 반자의 실내에 접하는 부분(반자돌림대ㆍ창대 기타 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감재료(영 제61조제1항제4호에 해당하는 건축물의 경우에는 단열재를 포함한다)는 불연재료ㆍ준불연재료 또는 난연재료를 사용해야 한다. 다만, 다음 각 호에 해당하는 부분의 마감재료는 불연재료 또는 준불연재료를 사용해야 한다. <개정 2005.7.22, 2010.4.7, 2010.12.30, 2021.9.3>","  1. 거실에서 지상으로 통하는 주된 복도ㆍ계단, 그 밖의 벽 및 반자의 실내에 접하는 부분","  2. 강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분","  ②영 제61조제1항 각 호의 건축물 중 다음 각 호의 어느 하나에 해당하는 거실의 벽 및 반자의 실내에 접하는 부분의 마감은 제1항에도 불구하고 불연재료 또는 준불연재료로 하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2010.4.7, 2010.12.30>","  1. 영 제61조제1항 각 호에 따른 용도에 쓰이는 거실 등을 지하층 또는 지하의 공작물에 설치한 경우의 그 거실(출입문 및 문틀을 포함한다)","  2. 영 제61조제1항제6호에 따른 용도에 쓰이는 건축물의 거실","  ③ 제1항 및 제2항에도 불구하고 영 제61조제1항제4호에 해당하는 건축물에서 단열재를 사용하는 경우로서 해당 건축물의 구조, 설계 또는 시공방법 등을 고려할 때 단열재로 불연재료ㆍ준불연재료 또는 난연재료를 사용하는 것이 곤란하여 법 제4조에 따른 건축위원회(시ㆍ도 및 시ㆍ군ㆍ구에 두는 건축위원회를 말한다)의 심의를 거친 경우에는 단열재를 불연재료ㆍ준불연재료 또는 난연재료가 아닌 것으로 사용할 수 있다. <신설 2021.9.3>","  ④법 제52조제1항에서 내부마감재료\"란 건축물 내부의 천장ㆍ반자ㆍ벽(경계벽 포함)ㆍ기둥 등에 부착되는 마감재료를 말한다. 다만","  ⑤ 영 제61조제1항제1호의2에 따른 공동주택에는 「실내공기질 관리법」 제11조제1항 및 같은 법 시행규칙 제10조에 따른 오염물질 방출 기준을 초과하지 않는 건축자재를 사용해야 한다. <개정 2026.10.6>","  ⑥ 법 제52조제2항 후단에 따라 영 제61조제2항제1호부터 제3호까지, 제5호 및 제6호에 해당하는 건축물의 외벽에는 다음 각 호의 구분에 따른 마감재료(단열재, 도장 등 코팅재료 및 그 밖에 마감재료를 구성하는 모든 재료를 포함한다. 이하 이 조에서 같다)를 사용해야 한다. <개정 2026.10.6>","  1. 영 제61조제2항제1호부터 제3호까지 및 제5호에 해당하는 건축물의 경우: 불연재료 또는 준불연재료를 마감재료로 사용할 것. 다만, 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 마감재료를 설치하는 경우에는 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 사용할 수 있다.","  2. 영 제61조제2항제6호에 해당하는 건축물의 경우: 불연재료를 마감재료로 사용할 것","  ⑦ 제6항에도 불구하고 영 제61조제2항제1호ㆍ제3호 및 제5호에 해당하는 건축물로서 5층 이하이면서 높이 22미터 미만인 건축물의 경우 난연재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 할 수 있다. 다만, 건축물의 외벽을 국토교통부장관이 정하여 고시하는 화재 확산 방지구조 기준에 적합하게 설치하는 경우에는 난연성능이 없는 재료(강판과 심재로 이루어진 복합자재가 아닌 것으로 한정한다)를 마감재료로 사용할 수 있다. <개정 2019.8.6, 2021.9.3, 2022.2.10>","  ⑧ 제6항 및 제7항에 따른 마감재료가 둘 이상의 재료로 제작된 것인 경우 해당 마감재료는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10, 2023.8.31>","  1. 마감재료를 구성하는 재료 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험(실제 시공될 건축물의 구조와 유사한 모형으로 시험하는 것을 말한다. 이하 같다)을 한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 마감재료를 구성하는 각각의 재료에 대하여 난연성능을 시험한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것. 다만, 제6조제1호에 따른 불연재료 사이에 다른 재료(두께가 5밀리미터 이하인 경우만 해당한다)를 부착하여 제작한 재료의 경우에는 해당 재료 전체를 하나의 재료로 보고 난연성능을 시험할 수 있으며, 같은 호에 따른 불연재료에 0.1밀리미터 이하의 두께로 도장을 한 재료의 경우에는 불연재료의 성능기준을 충족한 것으로 보고 난연성능 시험을 생략할 수 있다.","  ⑨ 영 제14조제4항 각 호의 어느 하나에 해당하는 건축물 상호 간의 용도변경 중 영 별표 1 제3호다목(목욕장만 해당한다)ㆍ라목, 같은 표 제4호가목ㆍ사목ㆍ카목ㆍ파목(골프연습장, 놀이형시설만 해당한다)ㆍ더목ㆍ러목, 같은 표 제7호다목2) 및 같은 표 제16호가목ㆍ나목에 해당하는 용도로 변경하는 경우로서 스프링클러 또는 간이 스프링클러의 헤드가 창문등으로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 제6항부터 제8항까지의 규정을 적용하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10, 2025.9.19>","  ⑩ 영 제61조제2항제4호에 해당하는 건축물의 외벽[필로티 구조의 외기에 면하는 천장 및 벽체를 포함한다] 중 1층과 2층 부분에는 불연재료 또는 준불연재료를 마감재료로 해야 한다. <신설 2019.8.6, 2021.7.5, 2021.9.3, 2022.2.10>","  ⑪ 강판과 심재로 이루어진 복합자재를 마감재료로 사용하는 경우 해당 복합자재는 다음 각 호의 요건을 모두 갖춘 것이어야 한다. <신설 2022.2.10>","  1. 강판과 심재 전체를 하나로 보아 국토교통부장관이 정하여 고시하는 기준에 따라 실물모형시험을 실시한 결과가 국토교통부장관이 정하여 고시하는 기준을 충족할 것","  2. 강판: 다음 각 목의 구분에 따른 기준을 모두 충족할 것","    가. 두께[도금 이후 도장(塗裝) 전 두께를 말한다]: 0.5밀리미터 이상","    나. 앞면 도장 횟수: 2회 이상","    다. 도금의 부착량: 도금의 종류에 따라 다음의 어느 하나에 해당할 것. 이 경우 도금의 종류는 한국산업표준에 따른다.","      1) 용융 아연 도금 강판: 180g/㎡ 이상","      2) 용융 아연 알루미늄 마그네슘 합금 도금 강판: 90g/㎡ 이상","      3) 용융 55% 알루미늄 아연 마그네슘 합금 도금 강판:  90g/㎡ 이상","      4) 용융 55% 알루미늄 아연 합금 도금 강판: 90g/㎡ 이상","      5) 그 밖의 도금: 국토교통부장관이 정하여 고시하는 기준 이상","  3. 심재: 강판을 제거한 심재가 다음 각 목의 어느 하나에 해당할 것","    가. 한국산업표준에 따른 그라스울 보온판 또는 미네랄울 보온판으로서 국토교통부장관이 정하여 고시하는 기준에 적합한 것","    나. 불연재료 또는 준불연재료인 것","  ⑫ 법 제52조제4항에 따라 영 제61조제2항 각 호에 해당하는 건축물의 인접대지경계선에 접하는 외벽에 설치하는 창호(窓戶)와 인접대지경계선 간의 거리가 1.5미터 이내인 경우 해당 창호는 방화유리창호[한국산업표준 KS F 2845(유리구획 부분의 내화 시험방법)에 규정된 방법에 따라 창틀과 유리 등으로 구성된 유리구획을 시험한 결과 비차열 20분 이상의 성능이 있는 것으로 한정한다]로 설치해야 한다. 다만, 스프링클러 또는 간이 스프링클러의 헤드가 창호로부터 60센티미터 이내에 설치되어 건축물 내부가 화재로부터 방호되는 경우에는 방화유리창호로 설치하지 않을 수 있다. <신설 2021.7.5, 2021.9.3, 2022.2.10, 2024.11.15>","  [제목개정 2021.7.5]"]}],"계단ㆍ복도_및_출입구의_설치":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제48조(계단의 설치기준 및 구조) ①높이 3미터를 넘는 계단은 높이 3미터이내마다 너비 1.2미터이상의 계단참을 설치하여야 한다.","  ②높이 1미터를 넘는 계단 및 계단참의 양옆에는 난간(벽 또는 이에 대치되는 것을 포함한다)을 설치하여야 한다.","  ③너비 3미터를 넘는 계단에는 계단의 중간에 너비 3미터이내마다 난간을 설치하여야 한다. 다만, 계단의 단높이가 15센티미터이하이고, 계단의 단너비가 30센티미터이상인 것은 그러하지 아니하다.","  ④계단 및 계단참의 너비, 계단의 단높이 및 단너비, 계단의 경사도 기타 계단의 구조에 관하여 필요한 사항은 건설부령으로 정한다.","  ⑤제1항 내지 제4항의 규정은 승강기기계실용계단ㆍ망루용계단등 특수한 용도에만 쓰이는 계단에는 이를 적용하지 아니한다."]},{"d":"1996-01-06","m":"[대통령령 제14891호, 1995. 12. 30, 일부개정]","l":["제48조(계단등의 설치기준 및 구조) ①높이 3미터를 넘는 계단은 높이 3미터이내마다 너비 1.2미터이상의 계단참을 설치하여야 한다.","  ②높이 1미터를 넘는 계단 및 계단참의 양옆에는 난간(벽 또는 이에 대치되는 것을 포함한다)을 설치하여야 한다.","  ③너비 3미터를 넘는 계단에는 계단의 중간에 너비 3미터이내마다 난간을 설치하여야 한다. 다만, 계단의 단높이가 15센티미터이하이고, 계단의 단너비가 30센티미터이상인 것은 그러하지 아니하다.","  ④계단 및 계단참의 너비, 계단의 단높이 및 단너비, 계단의 경사도, 계단의 구조와 계단에 대체되는 경사로의 구조에 관하여 필요한 사항은 건설교통부령으로 정한다.<개정 1994ㆍ12ㆍ23, 1995ㆍ12ㆍ30>","  ⑤제1항 내지 제4항의 규정은 승강기기계실용계단ㆍ망루용계단등 특수한 용도에만 쓰이는 계단에는 이를 적용하지 아니한다."]},{"d":"2000-07-01","m":"[대통령령 제16874호, 2000. 6. 27, 일부개정]","l":["제48조(계단 및 복도의 설치) 법 제39조제2항의 규정에 의하여 연면적 200제곱미터를 초과하는 건축물에 설치하는 계단과 문화 및 집회시설중 공연장에 설치하는 복도는 건설교통부령이 정하는 기준에 적합하게 설치하여야 한다.","  [전문개정 1999.4.30]"]},{"d":"2003-07-01","m":"[대통령령 제18044호, 2003. 6. 30, 타법개정]","l":["제48조(계단 및 복도의 설치) 법 제39조제2항의 규정에 의하여 연면적 200제곱미터를 초과하는 건축물에 설치하는 계단과 문화 및 집회시설중 공연장에 설치하는 복도는 건설교통부령이 정하는 기준에 적합하게 설치하여야 한다.","  [전문개정 1999.4.30]"]},{"d":"2005-07-18","m":"[대통령령 제18951호, 2005. 7. 18, 일부개정]","l 출입구의 설치) ① 법 제49조제2항 본문에 따라 연면적 200제곱미터를 초과하는 건축물에 설치하는 계단 및 복도는 국토교통부령으로 정하는 기준에 적합해야 한다. <개정 2013.3.23, 2022.4.29>","  ② 법 제49조제2항 본문에 따라 제39조제1항 각 호에 해당하는 건축물의 출입구는 국토교통부령으로 정하는 기준에 적합해야 한다. <개정 2013.3.23, 2022.4.29>","  [전문개정 2008.10.29]"]}],"계단의_설치기준":[{"d":"2003-01-06","m":"[건설교통부령 제348호, 2003. 1. 6, 일부개정]","l":["제15조 (계단 및 복도의 설치기준) ①영 제48조의 규정에 의하여 건축물에 설치하는 계단은 다음 각호의 기준에 적합하여야 한다.","  1. 높이가 3미터를 넘는 계단에는 높이 3미터이내마다 너비 1.2미터이상의 계단참을 설치할 것","  2. 높이가 1미터를 넘는 계단 및 계단참의 양옆에는 난간(벽 또는 이에 대치되는 것을 포함한다)을 설치할 것","  3. 너비가 3미터를 넘는 계단에는 계단의 중간에 너비 3미터이내마다 난간을 설치할 것. 다만, 계단의 단높이가 15센티미터이하이고, 계단의 단너비가 30센티미터이상인 경우에는 그러하지 아니하다.","  ②제1항의 규정에 의하여 계단을 설치하는 경우 계단 및 계단참의 너비(옥내계단에 한한다), 계단의 단높이 및 단너비의 칫수는 다음 각호의 기준에 적합하여야 한다. 이 경우 돌음계단의 단너비는 그 좁은 너비의 끝부분으로부터 30센티미터의 위치에서 측정한다. <개정 2003.1.6>","  1. 초등학교의 계단인 경우에는 계단 및 계단참의 너비는 150센티미터이상, 단높이는 16센티미터이하, 단너비는 26센티미터이상으로 할 것","  2. 중ㆍ고등학교의 계단인 경우에는 계단 및 계단참의 너비는 150센티미터이상, 단높이는 18센티미터이하, 단너비는 26센티미터이상으로 할 것","  3. 문화 및 집회시설(공연장ㆍ집회장 및 관람장에 한한다)ㆍ판매 및 영업시설(도매시장ㆍ소매시장 및 상점에 한한다) 기타 이와 유사한 용도에 쓰이는 건축물의 계단인 경우에는 계단 및 계단참의 너비를 120센티미터이상으로 할 것","  4. 바로 윗층의 거실의 바닥면적의 합계가 200제곱미터이상이거나 거실의 바닥면적의 합계가 100제곱미터이상인 지하층의 계단인 경우에는 계단 및 계단참의 너비를 120센티미터이상으로 할 것","  5. 기타의 계단인 경우에는 계단 및 계단참의 너비를 60센티미터이상으로 할 것","  6. 산업안전보건법에 의한 작업장에 설치하는 계단인 경우에는 산업안전기준에관한규칙에서 정한 구조로 할 것","  ③공동주택(기숙사를 제외한다)ㆍ제1종 근린생활시설ㆍ제2종 근린생활시설ㆍ문화 및 집회시설ㆍ판매 및 영업시설ㆍ의료시설(장례식장을 제외한다)ㆍ교육연구 및 복지시설(아동관련시설 및 노인복지시설과 다른 용도로 분류되지 아니하는 사회복지시설 및 근로복지시설에 한한다)ㆍ업무시설ㆍ숙박시설ㆍ위락시설 또는 관광휴게시설의 용도에 쓰이는 건축물의 주계단ㆍ피난계단 또는 특별피난계단에 설치하는 난간 및 바닥은 아동의 이용에 안전하고 노약자 및 신체장애인의 이용에 편리한 구조로 하여야 하며, 양쪽에 벽등이 있어 난간이 없는 경우에는 손잡이를 설치하여야 한다.","  ④제3항의 규정에 의한 난간ㆍ벽 등의 손잡이와 바닥마감은 다음 각호의 기준에 적합하게 설치하여야 한다.","  1. 손잡이는 최대지름이 3.2센티미터이상 3.8센티미터이하인 원형 또는 타원형의 단면으로 할 것","  2. 손잡이는 벽등으로부터 5센티미터이상 떨어지도록 하고, 계단으로부터의 높이는 85센티미터가 되도록 할 것","  3. 계단이 끝나는 수평부분에서의 손잡이는 바깥쪽으로 30센티미터이상 나오도록 설치할 것","  ⑤계단을 대체하여 설치하는 경사로는 다음 각호의 기준에 적합하게 설치하여야 한다.","  1. 경사도는 1 : 8을 넘지 아니할 것","  2. 표면을 거친 면으로 하거나 미끄러지지 아니하는 재료로 마감할 것","  ⑥제1항 각호의 규정은 제5항의 규정에 의한 경사로의 설치기준에 관하여 이를 준용한다.","  ⑦제1항 내지 제6항의 규정은 승강기기계실용 계단, 망루용 계단등 특수한 용도에만 쓰이는 계단에 대하여는 이를 적용하지 아니한다.","  ⑧영 제48조의 규정에 의하여 문화 및 집회시설중 공연장에 설치하는 복도는 다음 각호의 기준에 적합하여야 한다.","  1. 공연장의 개별 관람석(바닥면적이 300제곱미터이상인 경우에 한한다)의 바깥쪽에는 그 양쪽 및 뒷쪽에 각각 복도를 설치할 것","  2. 하나의 층에 개별 관람석(바닥면적이 300제곱미터미만인 경우에 한한다)을 2개소이상 연속하여 설치하는 경우에는 그 관람석의 바깥쪽의 앞쪽과 뒷쪽에 각각 복도를 설치할 것"]},{"d":"2005-07-22","m":"[건설교통부령 제461호, 2005. 7. 22, 일부개정]","l":["제15조 (계단의 설치기준 <개정 2005.7.22>) ①영 제48조의 규정에 의하여 건축물에 설치하는 계단은 다음 각호의 기준에 적합하여야 한다.","  1. 높이가 3미터를 넘는 계단에는 높이 3미터이내마다 너비 1.2미터 이상의 계단참을 설치할 것","  2. 높이가 1미터를 넘는 계단 및 계단참의 양옆에는 난간(벽 또는 이에 대치되는 것을 포함한다)을 설치할 것","  3. 너비가 3미터를 넘는 계단에는 계단의 중간에 너비 3미터 이내마다 난간을 설치할 것. 다만, 계단의 단높이가 15센티미터 이하이고, 계단의 단너비가 30센티미터 이상인 경우에는 그러하지 아니하다.","  ②제1항의 규정에 의하여 계단을 설치하는 경우 계단 및 계단참의 너비(옥내계단에 한한다), 계단의 단높이 및 단너비의 칫수는 다음 각호의 기준에 적합하여야 한다. 이 경우 돌음계단의 단너비는 그 좁은 너비의 끝부분으로부터 30센티미터의 위치에서 측정한다. <개정 2003.1.6, 2005.7.22>","  1. 초등학교의 계단인 경우에는 계단 및 계단참의 너비는 150센티미터 이상, 단높이는 16센티미터 이하, 단너비는 26센티미터 이상으로 할 것","  2. 중ㆍ고등학교의 계단인 경우에는 계단 및 계단참의 너비는 150센티미터 이상, 단높이는 18센티미터 이하, 단너비는 26센티미터 이상으로 할 것","  3. 문화 및 집회시설(공연장ㆍ집회장 및 관람장에 한한다)ㆍ판매 및 영업시설(도매시장ㆍ소매시장 및 상점에 한한다) 기타 이와 유사한 용도에 쓰이는 건축물의 계단인 경우에는 계단 및 계단참의 너비를 120센티미터 이상으로 할 것","  4. 바로 윗층의 거실의 바닥면적의 합계가 200제곱미터 이상이거나 거실의 바닥면적의 합계가 100제곱미터 이상인 지하층의 계단인 경우에는 계단 및 계단참의 너비를 120센티미터 이상으로 할 것","  5. 기타의 계단인 경우에는 계단 및 계단참의 너비를 60센티미터 이상으로 할 것","  6. 「산업안전보건법」에 의한 작업장에 설치하는 계단인 경우에는 「산업안전 기준에 관한 규칙」에서 정한 구조로 할 것","  ③공동주택(기숙사를 제외한다)ㆍ제1종 근린생활시설ㆍ제2종 근린생활시설ㆍ문화 및 집회시설ㆍ판매 및 영업시설ㆍ의료시설(장례식장을 제외한다)ㆍ교육연구 및 복지시설(아동관련시설 및 노인복지시설과 다른 용도로 분류되지 아니하는 사회복지시설 및 근로복지시설에 한한다)ㆍ업무시설ㆍ숙박시설ㆍ위락시설 또는 관광휴게시설의 용도에 쓰이는 건축물의 주계단ㆍ피난계단 또는 특별피난계단에 설치하는 난간 및 바닥은 아동의 이용에 안전하고 노약자 및 신체장애인의 이용에 편리한 구조로 하여야 하며, 양쪽에 벽등이 있어 난간이 없는 경우에는 손잡이를 설치하여야 한다.","  ④제3항의 규정에 의한 난간ㆍ벽 등의 손잡이와 바닥마감은 다음 각호의 기준에 적합하게 설치하여야 한다.","  1. 손잡이는 최대지름이 3.2센티미터 이상 3.8센티미터 이하인 원형 또는 타원형의 단면으로 할 것","  2. 손잡이는 벽등으로부터 5센티미터 이상 떨어지도록 하고, 계단으로부터의 높이는 85센티미터가 되도록 할 것","  3. 계단이 끝나는 수평부분에서의 손잡이는 바깥쪽으로 30센티미터 이상 나오도록 설치할 것","  ⑤계단을 대체하여 설치하는 경사로는 다음 각호의 기준에 적합하게 설치하여야 한다.","  1. 경사도는 1 : 8을 넘지 아니할 것","  2. 표면을 거친 면으로 하거나 미끄러지지 아니하는 재료로 마감할 것","  ⑥제1항 각호의 규정은 제5항의 규정에 의한 경사로의 설치기준에 관하여 이를 준용한다.","  ⑦제1항 내지 제6항의 규정은 승강기기계실용 계단, 망루용 계단등 특수한 용도에만 쓰이는 계단에 대하여는 이를 적용하지 아니한다.","  ⑧삭제 <2005.7.22>"]}],"내화구조":[{"d":"1999-05-09","m":"[건설교통부령 제184호, 1999. 5. 7, 제정]","l":["제3조 (내화구조) 영 제2조제1항제7호의2에서 건설교통부령이 정하는 기준에 적합한 구조\"라 함은 다음 각호의 1에 해당하는 것을 말한다.\"","  1. 벽의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터이상의 철망모르타르(그 바름바탕을 불연재료로 한 것에 한한다. 이하 이 조에서 같다) 또는 두께 5센티미터이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터이상인 것","    라. 벽돌조로서 두께가 19센티미터이상인 것","    마. 고온ㆍ고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터이상인 것","  2. 외벽중 비내력벽의 경우에는 제1호의 규정에 불구하고 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 7센티미터이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 3센티미터이상의 철망모르타르 또는 두께 4센티미터이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 4센티미터이상인 것","    라. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조로서 그 두께가 7센티미터이상인 것","  3. 기둥의 경우에는 그 작은 지름이 25센티미터이상인 것으로서 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 7센티미터이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철골을 두께 5센티미터이상의 콘크리트로 덮은 것","  4. 바닥의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터이상인 것","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터이상인 것","    다. 철재의 양면을 두께 5센티미터이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리로 된 것","  7. 계단의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 콘크리트블록조
