에 의한 한국산업규격으로 내화성능이 인정된 구조로 된 것","    나. 「과학기술분야 정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제8조의 규정에 의하여 설립된 한국건설기술연구원의 장(이하 한국건설기술연구원장\"이라 한다)이 내화구조 표준으로 인정한 것\"","    다. 그 밖에 건설교통부장관이 지정하는 자 또는 한국건설기술연구원장이 건설교통부장관이 고시하는 기준에 따라 실시하는 품질시험을 거쳐 내화성능을 인정한 것"]},{"d":"2006-06-29","m":"[건설교통부령 제523호, 2006. 6. 29, 일부개정]","l":["제3조 (내화구조) 영 제2조제1항제7호의2에서 건설교통부령이 정하는 기준에 적합한 구조\"라 함은 다음 각 호의 어느 하나에 해당하는 것을 말한다.<개정 2000.6.3","  1. 벽의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터 이상의 철망모르타르(그 바름바탕을 불연재료로 한 것에 한한다. 이하 이 조에서 같다) 또는 두께 5센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    라. 벽돌조로서 두께가 19센티미터 이상인 것","    마. 고온ㆍ고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터 이상인 것","  2. 외벽중 비내력벽의 경우에는 제1호의 규정에 불구하고 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 7센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 3센티미터 이상의 철망모르타르 또는 두께 4센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 4센티미터 이상인 것","    라. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조로서 그 두께가 7센티미터 이상인 것","  3. 기둥의 경우에는 그 작은 지름이 25센티미터 이상인 것으로서 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 7센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것","  4. 바닥의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    다. 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보(지붕틀을 포함한다)의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터 이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터 이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리로 된 것","  7. 계단의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    라. 철골조","  8. 「과학기술분야 정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제8조에 따라 설립된 한국건설기술연구원의 장(이하 한국건설기술연구원장\"이라 한다)이 건설교통부장관이 정하여 고시하는 시험방법에 따라 품질시험을 한 결과 건설교통부장관이 정하여 고시하는 내화구조의 성능기준에 적합하다고 인정한 것. 다만","    가. 「산업표준화법」에 따른 한국산업규격으로 내화성능이 인정된 구조로 된 것","    나. 한국건설기술연구원장이 인정한 내화구조 표준으로 된 것","    다. 한국건설기술연구원장이 인정한 성능설계에 따라 내화구조의 성능을 검증할 수 있는 구조로 된 것"]},{"d":"2008-03-14","m":"[국토해양부령 제4호, 2008. 3. 14, 타법개정]","l":["제3조 (내화구조) 영 제2조제1항제7호의2에서 국토해양부령이 정하는 기준에 적합한 구조\"라 함은 다음 각 호의 어느 하나에 해당하는 것을 말한다.<개정 2000.6.3","  1. 벽의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터 이상의 철망모르타르(그 바름바탕을 불연재료로 한 것에 한한다. 이하 이 조에서 같다) 또는 두께 5센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    라. 벽돌조로서 두께가 19센티미터 이상인 것","    마. 고온ㆍ고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터 이상인 것","  2. 외벽중 비내력벽의 경우에는 제1호의 규정에 불구하고 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 7센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 3센티미터 이상의 철망모르타르 또는 두께 4센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 4센티미터 이상인 것","    라. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조로서 그 두께가 7센티미터 이상인 것","  3. 기둥의 경우에는 그 작은 지름이 25센티미터 이상인 것으로서 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 7센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것","  4. 바닥의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    다. 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보(지붕틀을 포함한다)의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터 이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터 이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리로 조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    다. 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보(지붕틀을 포함한다)의 경우에는 다음 각목의 1에 해당하는 것. 다만, 고강도 콘크리트를 사용하는 경우에는 국토해양부장관이 정하여 고시하는 고강도 콘크리트내화성능 관리기준에 적합하여야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터 이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터 이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리로 된 것","  7. 계단의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 무근콘크리트조·콘크리트블록조·벽돌조 또는 석조","    다. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조","    라. 철골조","  8. 「과학기술분야 정부출연연구기관 등의 설립·운영 및 육성에 관한 법률」 제8조에 따라 설립된 한국건설기술연구원의 장(이하 한국건설기술연구원장\"이라 한다)이 해당 내화구조에 대하여 다음 각 목의 사항을 모두 인정하는 것. 다만","    가. 생산공장의 품질 관리 상태를 확인할 결과 국토해양부장관이 정하여 고시하는 기준에 적합할 것","    나. 가목에 따라 적합성이 인정된 제품에 대하여 품질시험을 실시한 결과 별표 1에 따른 성능기준에 적합할 것","  9. 다음 각 목의 어느 하나에 해당하는 것으로서 한국건설기술연구원장이 국토해양부장관으로부터 승인받은 기준에 적합한 것으로 인정하는 것","    가. 한국건설기술연구원장이 인정한 내화구조 표준으로 된 것","    나. 한국건설기술연구원장이 인정한 성능설계에 따라 내화구조의 성능을 검증할 수 있는 구조로 된 것","  10. 한국건설기술연구원장이 제27조제1항에 따라 정한 인정기준에 따라 인정하는 것"]},{"d":"2013-03-23","m":"[국토교통부령 제1호, 2013. 3. 23, 타법개정]","l":["제3조(내화구조) 영 제2조제7호에서 국토교통부령으로 정하는 기준에 적합한 구조\"란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2000.6.3","  1. 벽의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터 이상의 철망모르타르(그 바름바탕을 불연재료로 한 것에 한한다. 이하 이 조에서 같다) 또는 두께 5센티미터 이상의 콘크리트블록·벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    라. 벽돌조로서 두께가 19센티미터 이상인 것","    마. 고온·고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터 이상인 것","  2. 외벽중 비내력벽의 경우에는 제1호의 규정에 불구하고 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 7센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 3센티미터 이상의 철망모르타르 또는 두께 4센티미터 이상의 콘크리트블록·벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 4센티미터 이상인 것","    라. 무근콘크리트조·콘크리트블록조·벽돌조 또는 석조로서 그 두께가 7센티미터 이상인 것","  3. 기둥의 경우에는 그 작은 지름이 25센티미터 이상인 것으로서 다음 각목의 1에 해당하는 것. 다만, 고강도 콘크리트(설계기준강도가 50MPa 이상인 콘크리트를 말한다. 이하 이 조에서 같다)를 사용하는 경우에는 국토교통부장관이 정하여 고시하는 고강도 콘크리트 내화성능 관리기준에 적합하여야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 7센티미터 이상의 콘크리트블록·벽돌 또는 석재로 덮은 것","    다. 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것","  4. 바닥의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    다. 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보(지붕틀을 포함한다)의 경우에는 다음 각목의 1에 해당하는 것. 다만, 고강도 콘크리트를 사용하는 경우에는 국토교통부장관이 정하여 고시하는 고강도 콘크리트내화성능 관리기준에 적합하여야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터 이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터 이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리로 된 것","  7. 계단의 경우에는 다음 각목의 1에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 무근콘크리트조·콘크리트블록조·벽돌조 또는 석조","    다. 철재로 보강된 콘크리트블록조·벽돌조 또는 석조","    라. 철골조","  8. 「과학기술분야 정부출연연구기관 등의 설립·운영 및 육성에 관한 법률」 제8조에 따라 설립된 한국건설기술연구원의 장(이하 한국건설기술연구원장\"이라 한다)이 해당 내화구조에 대하여 다음 각 목의 사항을 모두 인정하는 것. 다만","    가. 생산공장의 품질 관리 상태를 확인할 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","    나. 가목에 따라 적합성이 인정된 제품에 대하여 품질시험을 실시한 결과 별표 1에 따른 성능기준에 적합할 것","  9. 다음 각 목의 어느 하나에 해당하는 것으로서 한국건설기술연구원장이 국토교통부장관으로부터 승인받은 기준에 적합한 것으로 인정하는 것","    가. 한국건설기술연구원장이 인정한 내화구조 표준으로 된 것","    나. 한국건설기술연구원장이 인정한 성능설계에 따라 내화구조의 성능을 검증할 수 있는 구조로 된 것","  10. 한국건설기술연구원장이 제27조제1항에 따라 정한 인정기준에 따라 인정하는 것"]},{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제3조(내화구조) 영 제2조제7호에서 국토교통부령으로 정하는 기준에 적합한 구조\"란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2000.6.3","  1. 벽의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터 이상의 철망모르타르(그 바름바탕을 불연재료 술연구원장이 국토교통부장관으로부터 승인받은 기준에 적합한 것으로 인정하는 것","    가. 한국건설기술연구원장이 인정한 내화구조 표준으로 된 것","    나. 한국건설기술연구원장이 인정한 성능설계에 따라 내화구조의 성능을 검증할 수 있는 구조로 된 것","  10. 한국건설기술연구원장이 제27조제1항에 따라 정한 인정기준에 따라 인정하는 것"]},{"d":"2021-08-27","m":"[국토교통부령 제882호, 2021. 8. 27, 타법개정]","l":["제3조(내화구조) 영 제2조제7호에서 국토교통부령으로 정하는 기준에 적합한 구조\"란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2000.6.3","  1. 벽의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터 이상의 철망모르타르(그 바름바탕을 불연재료로 한 것으로 한정한다. 이하 이 조에서 같다) 또는 두께 5센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    라. 벽돌조로서 두께가 19센티미터 이상인 것","    마. 고온ㆍ고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터 이상인 것","  2. 외벽 중 비내력벽인 경우에는 제1호에도 불구하고 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 7센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 3센티미터 이상의 철망모르타르 또는 두께 4센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 4센티미터 이상인 것","    라. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조로서 그 두께가 7센티미터 이상인 것","  3. 기둥의 경우에는 그 작은 지름이 25센티미터 이상인 것으로서 다음 각 목의 어느 하나에 해당하는 것. 다만, 고강도 콘크리트(설계기준강도가 50MPa 이상인 콘크리트를 말한다. 이하 이 조에서 같다)를 사용하는 경우에는 국토교통부장관이 정하여 고시하는 고강도 콘크리트 내화성능 관리기준에 적합해야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 7센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것","  4. 바닥의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    다. 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보(지붕틀을 포함한다)의 경우에는 다음 각 목의 어느 하나에 해당하는 것. 다만, 고강도 콘크리트를 사용하는 경우에는 국토교통부장관이 정하여 고시하는 고강도 콘크리트내화성능 관리기준에 적합해야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터 이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터 이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리(두꺼운 판유리에 철망을 넣은 것을 말한다)로 된 것","  7. 계단의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    라. 철골조","  8. 「과학기술분야 정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제8조에 따라 설립된 한국건설기술연구원의 장(이하 한국건설기술연구원장\"이라 한다)이 해당 내화구조에 대하여 다음 각 목의 사항을 모두 인정하는 것. 다만","    가. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","    나. 가목에 따라 적합성이 인정된 제품에 대하여 품질시험을 실시한 결과 별표 1에 따른 성능기준에 적합할 것","  9. 다음 각 목의 어느 하나에 해당하는 것으로서 한국건설기술연구원장이 국토교통부장관으로부터 승인받은 기준에 적합한 것으로 인정하는 것","    가. 한국건설기술연구원장이 인정한 내화구조 표준으로 된 것","    나. 한국건설기술연구원장이 인정한 성능설계에 따라 내화구조의 성능을 검증할 수 있는 구조로 된 것","  10. 한국건설기술연구원장이 제27조제1항에 따라 정한 인정기준에 따라 인정하는 것"]},{"d":"2021-12-23","m":"[국토교통부령 제931호, 2021. 12. 23, 일부개정]","l":["제3조(내화구조) 영 제2조제7호에서 국토교통부령으로 정하는 기준에 적합한 구조\"란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2000.6.3","  1. 벽의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 4센티미터 이상의 철망모르타르(그 바름바탕을 불연재료로 한 것으로 한정한다. 이하 이 조에서 같다) 또는 두께 5센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    라. 벽돌조로서 두께가 19센티미터 이상인 것","    마. 고온ㆍ고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터 이상인 것","  2. 외벽 중 비내력벽인 경우에는 제1호에도 불구하고 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 7센티미터 이상인 것","    나. 골구를 철골조로 하고 그 양면을 두께 3센티미터 이상의 철망모르타르 또는 두께 4센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 4센티미터 이상인 것","    라. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조로서 그 두께가 7센티미터 이상인 것","  3. 기둥의 경우에는 그 작은 지름이 25센티미터 이상인 것으로서 다음 각 목의 어느 하나에 해당하는 것. 다만, 고강도 콘크리트(설계기준강도가 50MPa 이상인 콘크리트를 말한다. 이하 이 조에서 같다)를 사용하는 경우에는 국토교통부장관이 정하여 고시하는 고강도 콘크리트 내화성능 관리기준에 적합해야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 7센티미터 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","    다. 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것","  4. 바닥의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","    다. 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","  5. 보(지붕틀을 포함한다)의 경우에는 다음 각 목의 어느 하나에 해당하는 것. 다만, 고강도 콘크리트를 사용하는 경우에는 국토교통부장관이 정하여 고시하는 고강도 콘크리트내화성능 관리기준에 적합해야 한다.","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철골을 두께 6센티미터(경량골재를 사용하는 경우에는 5센티미터)이상의 철망모르타르 또는 두께 5센티미터 이상의 콘크리트로 덮은 것","    다. 철골조의 지붕틀(바닥으로부터 그 아랫부분까지의 높이가 4미터 이상인 것에 한한다)로서 바로 아래에 반자가 없거나 불연재료로 된 반자가 있는 것","  6. 지붕의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 유리블록 또는 망입유리(두꺼운 판유리에 철망을 넣은 것을 말한다)로 된 것","  7. 계단의 경우에는 다음 각 목의 어느 하나에 해당하는 것","    가. 철근콘크리트조 또는 철골철근콘크리트조","    나. 무근콘크리트조ㆍ콘크리트블록조ㆍ벽돌조 또는 석조","    다. 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조","    라. 철골조","  8. 「과학기술분야 정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제8조에 따라 설립된 한국건설기술연구원의 장(이하 한국건설기술연구원장\"이라 한다)이 국토교통부장관이 정하여 고시하는 방법에 따라 품질을 시험한 결과 별표 1에 따른 성능기준에 적합할 것\"","  9. 다음 각 목의 어느 하나에 해당하는 것으로서 한국건설기술연구원장이 국토교통부장관으로부터 승인받은 기준에 적합한 것으로 인정하는 것","    가. 한국건설기술연구원장이 인정한 내화구조 표준으로 된 것","    나. 한국건설기술연구원장이 인정한 성능설계에 따라 내화구조의 성능을 검증할 수 있는 구조로 된 것","  10. 한국건설기술연구원장이 제27조제1항에 따라 정한 인정기준에 따라 인정하는 것"]}],"내화구조의_적용이_제외되는_공장건축물":[{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제20조의2(내화구조의 적용이 제외되는 공장건축물) 영 제56조제1항제3호 단서에서 국토교통부령으로 정하는 공장\"이란 별표 2의 업종에 해당하는 공장으로서 주요구조부가 불연재료로 되어 있는 2층 이하의 공장을 말한다. <개정 2005.7.22","  [본조신설 2000.6.3]"]},{"d":"2024-08-26","m":"[국토교통부령 제1384호, 2024. 8. 26, 일부개정]","l":["제20조의2(내화구조의 적용이 제외되는 공장건축물) 영 제56조제1항제3호 단서에서 국토교통부령으로 정하는 공장\"이란 별표 2의 업종에 해당하는 공장으로서 주요구조부가 불연재료로 되어 있는 2층 이하의 공장을 말한다. <개정 2005.7.22","  [본조신설 2000.6.3]"]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제20조의2(내화구조의 적용이 제외되는 공장건축물) 영 제56조제1항제3호 단서에서 국토교통부령으로 정하는 공장\"이란 별표 2의 업종에 해당하는 공장으로서 주요구조부가 불연재료로 되어 있는 2층 이하의 공장을 말한다. <개정 2005.7.22","  [본조신설 2000.6.3]"]},{"d":"2025-09-19","m":"[국토교통부령 제1524호, 2025. 9. 19, 일부개정]","l":["제20조의2(내화구조의 적용이 제외되는 공장건축물) 영 제56조제1항제3호 단서에서 국토교통부령으로 정하는 공장\"이란 별표 2의 업종에 해당하는 공장으로서 주요구조부가 불연재료로 되어 있는 992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제46조(방화구획) ①주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천제곱미터를 넘는 것은 다음 각호의 기준에 의하여 내화구조로 된 바닥ㆍ벽 및 제64조의 규정에 의한 갑종방화문(건설부장관이 정하는 기준에 적합한 자동방화샷다를 포함한다. 이하 이 조에서 같다)으로 구획하여야 한다.","  1. 10층이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층이상의 층과 지하층은 층마다 구획할 것","  3. 11층이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②다음 각호의 1에 해당하는 건축물의 부분에는 제1항의 규정을 적용하지 아니하거나 그 사용에 지장을 초래하지 아니하는 범위에서 제1항의 규정을 완화하여 적용할 수 있다.","  1. 관람집회시설ㆍ종교집회장ㆍ운동시설ㆍ전시시설 및 장례식장의 용도에 쓰이는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조ㆍ가공 및 운반등을 위한 대형기기설비등의 설치ㆍ운영을 위하여 불가피한 부분","  3. 계단실부분ㆍ복도 또는 승강기의 승강로부분(당해 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 당해 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 부분 또는 피난층 부분","  5. 복층형인 공동주택의 세대안의 층간 바닥부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장의 부분","  7. 단독주택ㆍ공관ㆍ수도장ㆍ군사시설ㆍ축사 또는 식물관련시설에 쓰이는 건축물","  ③건축물의 일부가 법 제40조제1항의 규정에 의한 건축물에 해당하는 경우에는 그 부분과 다른부분을 방화구획으로 구획하여야 한다.","  ④제1항 내지 제3항의 규정에 의한 방화구획으로 사용하는 제64조의 규정에 의한 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 하여야 한다.","  ⑤급수관ㆍ배전관 기타의 관이 방화구획으로 되어 있는 부분을 관통하는 경우에는 그 관과 방화구획과의 틈을 시멘트모르터 기타 불연재료로 메워야 한다.","  ⑥환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각호의 기준에 적합한 댐퍼를 설치하여야 한다.","  1. 철재로서 철판의 두께가 1.5밀리미터이상일 것","  2. 화재가 발생한 경우에는 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫힐 것","  3. 닫힌 경우에는 방화에 지장이 있는 틈이 생기지 아니할 것","  4. 제1호 내지 제3호외에 건설부장관이 댐퍼의 기능을 확보하기 위하여 필요하다고 인정하여 정하는 기준에 적합할 것"]},{"d":"1997-09-09","m":"[대통령령 제15476호, 1997. 9. 9, 일부개정]","l":["제46조 (방화구획) ①주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천제곱미터를 넘는 것은 다음 각호의 기준에 의하여 내화구조로 된 바닥·벽 및 제64조의 규정에 의한 갑종방화문(건설교통부장관이 정하는 기준에 적합한 자동방화샷다를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  1. 10층이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층이상의 층과 지하층은 층마다 구획할 것","  3. 11층이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②다음 각호의 1에 해당하는 건축물의 부분에는 제1항의 규정을 적용하지 아니하거나 그 사용에 지장을 초래하지 아니하는 범위에서 제1항의 규정을 완화하여 적용할 수 있다.<개정 1995·12·30>","  1. 관람집회시설·종교집회장·운동시설·전시시설 및 장례식장의 용도에 쓰이는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반등에 필요한 대형기기설비의 설치·운영을 위하여 불가피한 부분","  3. 계단실부분·복도 또는 승강기의 승강로부분(당해 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 당해 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모회의장·강당·스카이라운지·로비등의 용도에 사용하는 부분으로서 당해 용도로의 사용을 위하여 불가피한 부분","  5. 복층형인 공동주택의 세대안의 층간 바닥부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장의 부분","  7. 단독주택·공관·수도장·군사시설·축사 또는 식물관련시설에 쓰이는 건축물","  ③건축물의 일부가 법 제40조제1항의 규정에 의한 건축물에 해당하는 경우에는 그 부분과 다른부분을 방화구획으로 구획하여야 한다.","  ④방화구획의 구조등 기술적 기준은 건설교통부령으로 정한다.<개정 1995·12·30>","  ⑤삭제<1995·12·30>","  ⑥삭제<1995·12·30>"]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제46조(방화구획의 설치<개정 1999.4.30>) ①법 제39조제2항의 규정에 의하여 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천제곱미터를 넘는 것은 건설교통부령이 정하는 기준에 따라 내화구조로 된 바닥ㆍ벽 및 제64조의 규정에 의한 갑종방화문(건설교통부장관이 정하는 기준에 적합한 자동방화샷다를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  1. 삭제<1999.4.30>","  2. 삭제<1999.4.30>","  3. 삭제<1999.4.30>","  ②다음 각호의 1에 해당하는 건축물의 부분에는 제1항의 규정을 적용하지 아니하거나 그 사용에 지장을 초래하지 아니하는 범위에서 제1항의 규정을 완화하여 적용할 수 있다.<개정 1995ㆍ12ㆍ30, 1999.4.30>","  1. 문화 및 집회시설(동ㆍ식물원을 제외한다), 의료시설중 장례식장 또는 운동시설의 용도에 쓰이는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조ㆍ가공ㆍ보관 및 운반등에 필요한 대형기기설비의 설치ㆍ운영을 위하여 불가피한 부분","  3. 계단실부분ㆍ복도 또는 승강기의 승강로부분(당해 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 당해 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모회의장ㆍ강당ㆍ스카이라운지ㆍ로비등의 용도에 사용하는 부분으로서 당해 용도로의 사용을 위하여 불가피한 부분","  5. 복층형인 공동주택의 세대안의 층간 바닥부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장의 부분","  7. 단독주택, 동물 및 식물관련시설 또는 공공용시설중 군사시설에 쓰이는 건축물","  ③건축물의 일부가 법 제40조제1항의 규정에 의한 건축물에 해당하는 경우에는 그 부분과 다른부분을 방화구획으로 구획하여야 한다.","  ④삭제<1999.4.30>","  ⑤삭제<1995ㆍ12ㆍ30>","  ⑥삭제<1995ㆍ12ㆍ30>"]},{"d":"2005-07-18","m":"[대통령령 제18951호, 2005. 7. 18, 일부개정]","l":["제46조(  시설에 한한다)에 쓰이는 건축물","  ③건축물의 일부가 법 제40조제1항의 규정에 의한 건축물에 해당하는 경우에는 그 부분과 다른부분을 방화구획으로 구획하여야 한다.","  ④공동주택 중 아파트로서 4층 이상의 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접세대와 공동으로 설치하는 대피공간은 인접세대를 통하여 2개 이상의 직통계단을 사용할 수 있는 위치에 우선 설치되어야 한다.  <신설 2005.12.2>","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 건설교통부장관이 정하는 기준에 적합할 것","  ⑤제4항의 규정에 불구하고 아파트의 4층 이상의 층에서 발코니에 설치하는 인접세대와의 경계벽이 파괴하기 쉬운 경량구조 등이거나 경계벽에 피난구를 설치한 경우에는 대피공간을 설치하지 아니할 수 있다. <신설 2005.12.2>","  ⑥삭제 <1995.12.30>"]},{"d":"2008-02-22","m":"[대통령령 제20647호, 2008. 2. 22, 일부개정]","l":["제46조 (방화구획의 설치<개정 1999.4.30>) ①법 제39조제2항의 규정에 의하여 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천제곱미터를 넘는 것은 건설교통부령이 정하는 기준에 따라 내화구조로 된 바닥·벽 및 제64조의 규정에 의한 갑종방화문(건설교통부장관이 정하는 기준에 적합한 자동방화셔텨를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  1. 삭제 <1999.4.30>","  2. 삭제 <1999.4.30>","  3. 삭제 <1999.4.30>","  ②다음 각 호의 어느 하나에 해당하는 건축물의 부분에는 제1항을 적용하지 아니하거나 그 사용에 지장을 초래하지 아니하는 범위에서 제1항을 완화하여 적용할 수 있다. <개정 1995.12.30, 1999.4.30, 2005.10.20, 2006.5.8, 2008.2.22>","  1. 문화 및 집회시설(동·식물원을 제외한다), 종교시설, 운동시설 또는 장례식장의 용도에 쓰이는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반등에 필요한 대형기기설비의 설치 및 이동식 물류설비의 작업활동을 위하여 불가피한 부분","  3. 계단실부분·복도 또는 승강기의 승강로부분(당해 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 당해 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모회의장·강당·스카이라운지·로비등의 용도에 사용하는 부분으로서 당해 용도로의 사용을 위하여 불가피한 부분","  5. 복층형인 공동주택의 세대안의 층간 바닥부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장의 부분","  7. 단독주택, 동물 및 식물관련시설 또는 교정 및 군사시설 중 군사시설(집회, 체육, 창고 등의 용도로 사용되는 시설에 한한다)에 쓰이는 건축물","  ③건축물의 일부가 법 제40조제1항의 규정에 의한 건축물에 해당하는 경우에는 그 부분과 다른부분을 방화구획으로 구획하여야 한다.","  ④공동주택 중 아파트로서 4층 이상의 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접세대와 공동으로 설치하는 대피공간은 인접세대를 통하여 2개 이상의 직통계단을 사용할 수 있는 위치에 우선 설치되어야 한다.  <신설 2005.12.2>","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 건설교통부장관이 정하는 기준에 적합할 것","  ⑤제4항의 규정에 불구하고 아파트의 4층 이상의 층에서 발코니에 설치하는 인접세대와의 경계벽이 파괴하기 쉬운 경량구조 등이거나 경계벽에 피난구를 설치한 경우에는 대피공간을 설치하지 아니할 수 있다. <신설 2005.12.2>","  ⑥삭제 <1995.12.30>"]},{"d":"2008-10-29","m":"[대통령령 제21098호, 2008. 10. 29, 일부개정]","l":["제46조 (방화구획의 설치) ① 법 제49조제2항에 따라 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천 제곱미터를 넘는 것은 국토해양부령으로 정하는 기준에 따라 내화구조로 된 바닥·벽 및 제64조에 따른 갑종 방화문(국토해양부장관이 정하는 기준에 적합한 자동방화셔텨를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  ② 다음 각 호의 어느 하나에 해당하는 건축물의 부분에는 제1항을 적용하지 아니하거나 그 사용에 지장이 없는 범위에서 제1항을 완화하여 적용할 수 있다.","  1. 문화 및 집회시설(동·식물원은 제외한다), 종교시설, 운동시설 또는 장례식장의 용도로 쓰는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반 등에 필요한 대형기기 설비의 설치 및 이동식 물류설비의 작업활동을 위하여 불가피한 부분","  3. 계단실부분·복도 또는 승강기의 승강로 부분(해당 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 그 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모 회의장·강당·스카이라운지·로비 등의 용도로 쓰는 부분으로서 그 용도로 사용하기 위하여 불가피한 부분","  5. 복층형 공동주택의 세대별 층간 바닥 부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장","  7. 단독주택, 동물 및 식물 관련 시설 또는 교정 및 군사시설 중 군사시설(집회, 체육, 창고 등의 용도로 사용되는 시설만 해당한다)로 쓰는 건축물","  ③ 건축물의 일부가 법 제50조제1항에 따른 건축물에 해당하는 경우에는 그 부분과 다른 부분을 방화구획으로 구획하여야 한다.","  ④ 공동주택 중 아파트로서 4층 이상인 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접 세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접 세대와 공동으로 설치하는 대피공간은 인접 세대를 통하여 2개 이상의 직통계단을 쓸 수 있는 위치에 우선 설치되어야 한다.","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접 세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 국토해양부장관이 정하는 기준에 적합할 것","  ⑤ 제4항에도 불구하고 아파트의 4층 이상인 층에서 발코니에 설치하는 인접 세대와의 경계벽이 파괴하기 쉬운 경량구조 등이거나 경계벽에 피난구를 설치한 경우에는 대피공간을 설치하지 아니할 수 있다.","  [전문개정 2008.10.29]"]},{"d":"2010-12-13","m":"[대통령령 제22526호, 2010. 12. 13, 일부개정]","l":["제46조(방화구획의 설치) ① 법 제49조제2항에 따라 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천 제곱미터를 넘는 것은 국토해양부령으로 정하는 기준에 따라 내화구조로 된 바닥·벽 및 제64조에 따른 갑종 방화문(국토해양부장관이 정하는 기준에 적합한 자동방화셔텨를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  ② 다음 각 호의 어느 하나에 해당하는 건축물의 부분에는 제1항을 적용하지 아니하거나 그 사용에 지장이 없는 범위에서 제1항을 완화하여 적용할 수 있다. <개정 2010.2.18>","  1. 문화 및 집회시설(동·식물원은 제외한다), 종교시설, 운동시설 또는 장례식장의 용도로 쓰는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반 등에 필요한 고정식 대형기기 설비의 설치를 위하여 불가피한 부분. 다만, 지하층인 경우에는 지하층의 외벽 한쪽 면(지하층의 바닥면에서 지상층 바닥 아래면까지의 외벽 면적 중 4분의 1 이상이 되는 면을 말한다) 전체가 건물 밖으로 개방되어 보행과 자동차의 진입·출입이 가능한 경우에 한정한다.","  3. 계단실부분·복도 또는 승강기의 승강로 부분(해당 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 그 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모 회의장·강당·스카이라운지·로비 또는 피난안전구역 등의 용도로 쓰는 부분으로서 그 용도로 사용하기 위하여 불가피한 부분","  5. 복층형 공동주택의 세대별 층간 바닥 부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장","  7. 단독주택, 동물 및 식물 관련 시설 또는 교정 및 군사시설 중 군사시설(집회, 체육, 창고 등의 용도로 사용되는 시설만 해당한다)로 쓰는 건축물","  ③ 건축물의 일부가 법 제50조제1항에 따른 건축물에 해당하는 경우에는 그 부분과 다른 부분을 방화구획으로 구획하여야 한다.","  ④ 공동주택 중 아파트로서 4층 이상인 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접 세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접 세대와 공동으로 설치하는 대피공간은 인접 세대를 통하여 2개 이상의 직통계단을 쓸 수 있는 위치에 우선 설치되어야 한다.","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접 세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 국토해양부장관이 정하는 기준에 적합할 것","  ⑤ 제4항에도 불구하고 아파트의 4층 이상인 층에서 발코니에 다음 각 호와 같은 구조를 설치한 경우에는 대피공간을 설치하지 아니할 수 있다. <개정 2010.2.18>","  1. 인접 세대와의 경계벽이 파괴하기 쉬운 경량구조 등인 경우","  2. 경계벽에 피난구를 설치한 경우","  3. 발코니의 바닥에 국토해양부령으로 정하는 하향식 피난구를 설치한 경우","  [전문개정 2008.10.29]"]},{"d":"2012-03-17","m":"[대통령령 제23469호, 2011. 12. 30, 일부개정]","l":["제46조(방화구획의 설치) ① 법 제49조제2항에 따라 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천 제곱미터를 넘는 것은 국토해양부령으로 정하는 기준에 따라 내화구조로 된 바닥·벽 및 제64조에 따른 갑종 방화문(국토해양부장관이 정하는 기준에 적합한 자동방화셔텨를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  ② 다음 각 호의 어느 하나에 해당하는 건축물의 부분에는 제1항을 적용하지 아니하거나 그 사용에 지장이 없는 범위에서 제1항을 완화하여 적용할 수 있다. <개정 2010.2.18>","  1. 문화 및 집회시설(동·식물원은 제외한다), 종교시설, 운동시설 또는 장례식장의 용도로 쓰는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반 등에 필요한 고정식 대형기기 설비의 설치를 위하여 불가피한 부분. 다만, 지하층인 경우에는 지하층의 외벽 한쪽 면(지하층의 바닥면에서 지상층 바닥 아래면까지의 외벽 면적 중 4 ","  7. 단독주택, 동물 및 식물 관련 시설 또는 교정 및 군사시설 중 군사시설(집회, 체육, 창고 등의 용도로 사용되는 시설만 해당한다)로 쓰는 건축물","  ③ 건축물의 일부가 법 제50조제1항에 따른 건축물에 해당하는 경우에는 그 부분과 다른 부분을 방화구획으로 구획하여야 한다.","  ④ 공동주택 중 아파트로서 4층 이상인 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접 세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접 세대와 공동으로 설치하는 대피공간은 인접 세대를 통하여 2개 이상의 직통계단을 쓸 수 있는 위치에 우선 설치되어야 한다. <개정 2013.3.23>","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접 세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 국토교통부장관이 정하는 기준에 적합할 것","  ⑤ 제4항에도 불구하고 아파트의 4층 이상인 층에서 발코니에 다음 각 호의 어느 하나에 해당하는 구조 또는 시설을 설치한 경우에는 대피공간을 설치하지 아니할 수 있다. <개정 2010.2.18, 2013.3.23, 2014.8.27>","  1. 인접 세대와의 경계벽이 파괴하기 쉬운 경량구조 등인 경우","  2. 경계벽에 피난구를 설치한 경우","  3. 발코니의 바닥에 국토교통부령으로 정하는 하향식 피난구를 설치한 경우","  4. 국토교통부장관이 중앙건축위원회의 심의를 거쳐 제4항에 따른 대피공간과 동일하거나 그 이상의 성능이 있다고 인정하여 고시하는 구조 또는 시설을 설치한 경우","  ⑥ 요양병원, 정신병원, 「노인복지법」 제34조제1항제1호에 따른 노인요양시설(이하 노인요양시설\"이라 한다)","  1. 각 층마다 별도로 방화구획된 대피공간","  2. 거실에 직접 접속하여 바깥 공기에 개방된 피난용 발코니","  3. 계단을 이용하지 아니하고 건물 외부 지표면 또는 인접 건물로 수평으로 피난할 수 있도록 설치하는 구름다리 형태의 구조물","  [전문개정 2008.10.29]","  [제목개정 2015.9.22]"]},{"d":"2016-05-17","m":"[대통령령 제27175호, 2016. 5. 17, 일부개정]","l":["제46조(방화구획 등의 설치) ① 법 제49조제2항에 따라 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천 제곱미터를 넘는 것은 국토교통부령으로 정하는 기준에 따라 내화구조로 된 바닥·벽 및 제64조에 따른 갑종 방화문(국토교통부장관이 정하는 기준에 적합한 자동방화셔텨를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  ② 다음 각 호의 어느 하나에 해당하는 건축물의 부분에는 제1항을 적용하지 아니하거나 그 사용에 지장이 없는 범위에서 제1항을 완화하여 적용할 수 있다. <개정 2010.2.18>","  1. 문화 및 집회시설(동·식물원은 제외한다), 종교시설, 운동시설 또는 장례식장의 용도로 쓰는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반 등에 필요한 고정식 대형기기 설비의 설치를 위하여 불가피한 부분. 다만, 지하층인 경우에는 지하층의 외벽 한쪽 면(지하층의 바닥면에서 지상층 바닥 아래면까지의 외벽 면적 중 4분의 1 이상이 되는 면을 말한다) 전체가 건물 밖으로 개방되어 보행과 자동차의 진입·출입이 가능한 경우에 한정한다.","  3. 계단실부분·복도 또는 승강기의 승강로 부분(해당 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 그 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모 회의장·강당·스카이라운지·로비 또는 피난안전구역 등의 용도로 쓰는 부분으로서 그 용도로 사용하기 위하여 불가피한 부분","  5. 복층형 공동주택의 세대별 층간 바닥 부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장","  7. 단독주택, 동물 및 식물 관련 시설 또는 교정 및 군사시설 중 군사시설(집회, 체육, 창고 등의 용도로 사용되는 시설만 해당한다)로 쓰는 건축물","  ③ 건축물의 일부가 법 제50조제1항에 따른 건축물에 해당하는 경우에는 그 부분과 다른 부분을 방화구획으로 구획하여야 한다.","  ④ 공동주택 중 아파트로서 4층 이상인 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접 세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접 세대와 공동으로 설치하는 대피공간은 인접 세대를 통하여 2개 이상의 직통계단을 쓸 수 있는 위치에 우선 설치되어야 한다. <개정 2013.3.23>","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접 세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 국토교통부장관이 정하는 기준에 적합할 것","  ⑤ 제4항에도 불구하고 아파트의 4층 이상인 층에서 발코니에 다음 각 호의 어느 하나에 해당하는 구조 또는 시설을 설치한 경우에는 대피공간을 설치하지 아니할 수 있다. <개정 2010.2.18, 2013.3.23, 2014.8.27>","  1. 인접 세대와의 경계벽이 파괴하기 쉬운 경량구조 등인 경우","  2. 경계벽에 피난구를 설치한 경우","  3. 발코니의 바닥에 국토교통부령으로 정하는 하향식 피난구를 설치한 경우","  4. 국토교통부장관이 중앙건축위원회의 심의를 거쳐 제4항에 따른 대피공간과 동일하거나 그 이상의 성능이 있다고 인정하여 고시하는 구조 또는 시설을 설치한 경우","  ⑥ 요양병원, 정신병원, 「노인복지법」 제34조제1항제1호에 따른 노인요양시설(이하 노인요양시설\"이라 한다)","  1. 각 층마다 별도로 방화구획된 대피공간","  2. 거실에 직접 접속하여 바깥 공기에 개방된 피난용 발코니","  3. 계단을 이용하지 아니하고 건물 외부 지표면 또는 인접 건물로 수평으로 피난할 수 있도록 설치하는 구름다리 형태의 구조물","  [전문개정 2008.10.29][제목개정 2015.9.22]"]},{"d":"2017-02-04","m":"[대통령령 제27832호, 2017. 2. 3, 일부개정]","l":["제46조(방화구획 등의 설치) ① 법 제49조제2항에 따라 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1천 제곱미터를 넘는 것은 국토교통부령으로 정하는 기준에 따라 내화구조로 된 바닥·벽 및 제64조에 따른 갑종 방화문(국토교통부장관이 정하는 기준에 적합한 자동방화셔텨를 포함한다. 이하 이 조에서 같다)으로 구획(이하 방화구획\"이라 한다)하여야 한다. 다만","  ② 다음 각 호의 어느 하나에 해당하는 건축물의 부분에는 제1항을 적용하지 아니하거나 그 사용에 지장이 없는 범위에서 제1항을 완화하여 적용할 수 있다. <개정 2010.2.18, 2017.2.3>","  1. 문화 및 집회시설(동·식물원은 제외한다), 종교시설, 운동시설 또는 장례시설의 용도로 쓰는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","  2. 물품의 제조·가공·보관 및 운반 등에 필요한 고정식 대형기기 설비의 설치를 위하여 불가피한 부분. 다만, 지하층인 경우에는 지하층의 외벽 한쪽 면(지하층의 바닥면에서 지상층 바닥 아래면까지의 외벽 면적 중 4분의 1 이상이 되는 면을 말한다) 전체가 건물 밖으로 개방되어 보행과 자동차의 진입·출입이 가능한 경우에 한정한다.","  3. 계단실부분·복도 또는 승강기의 승강로 부분(해당 승강기의 승강을 위한 승강로비 부분을 포함한다)으로서 그 건축물의 다른 부분과 방화구획으로 구획된 부분","  4. 건축물의 최상층 또는 피난층으로서 대규모 회의장·강당·스카이라운지·로비 또는 피난안전구역 등의 용도로 쓰는 부분으로서 그 용도로 사용하기 위하여 불가피한 부분","  5. 복층형 공동주택의 세대별 층간 바닥 부분","  6. 주요구조부가 내화구조 또는 불연재료로 된 주차장","  7. 단독주택, 동물 및 식물 관련 시설 또는 교정 및 군사시설 중 군사시설(집회, 체육, 창고 등의 용도로 사용되는 시설만 해당한다)로 쓰는 건축물","  ③ 건축물의 일부가 법 제50조제1항에 따른 건축물에 해당하는 경우에는 그 부분과 다른 부분을 방화구획으로 구획하여야 한다.","  ④ 공동주택 중 아파트로서 4층 이상인 층의 각 세대가 2개 이상의 직통계단을 사용할 수 없는 경우에는 발코니에 인접 세대와 공동으로 또는 각 세대별로 다음 각 호의 요건을 모두 갖춘 대피공간을 하나 이상 설치하여야 한다. 이 경우 인접 세대와 공동으로 설치하는 대피공간은 인접 세대를 통하여 2개 이상의 직통계단을 쓸 수 있는 위치에 우선 설치되어야 한다. <개정 2013.3.23>","  1. 대피공간은 바깥의 공기와 접할 것","  2. 대피공간은 실내의 다른 부분과 방화구획으로 구획될 것","  3. 대피공간의 바닥면적은 인접 세대와 공동으로 설치하는 경우에는 3제곱미터 이상, 각 세대별로 설치하는 경우에는 2제곱미터 이상일 것","  4. 국토교통부장관이 정하는 기준에 적합할 것","  ⑤ 제4항에도 불구하고 아파트의 4층 이상인 층에서 발코니에 다음 각 호의 어느 하나에 해당하는 구조 또는 시설을 설치한 경우에는 대피공간을 설치하지 아니할 수 있다. <개정 2010.2.18, 2013.3.23, 2014.8.27>","  1. 인접 세대와의 경계벽이 파괴하기 쉬운 경량구조 등인 경우","  2. 경계벽에 피난구를 설치한 경우","  3. 발코니의 바닥에 국토교통부령으로 정하는 하향식 피난구를 설치한 경우","  4. 국토교통부장관이 중앙건축위원회의 심의를 거쳐 제4항에 따른 대피공간과 동일하거나 그 이상의 성능이 있다고 인정하여 고시하는 구조 또는 시설을 설치한 경우","  ⑥ 요양병원, 정신병원, 「노인복지법」 제34조제1항제1호에 따른 노인요양시설(이하 노인요양시설\"이라 한다)","  1. 각 층마다 별도로 방화구획된 대피공간","  2. 거실에 직접 접속하여 바깥 공기에 개방된 피난용 발코니","  3. 계단을 이용하지 아니하고 건물 외부 지표면 또는 인접 건물로 수평으로 피난할 수 있도록 설치하는 구름다리 형태의 구조물","  [전문개정 2008.10.29]","  [제목개정 2015.9.22]"]}],"방화구획의_설치기준":[{"d":"1999-05-09","m":"[건설교통부령 제184호, 1999. 5. 7, 제정]","l":["제14조 (방화구획의 설치기준) ①영 제46조의 규정에 의하여 건축물에 설치하는 방화구획은 다음 각호의 기준에 적합하여야 한다.","  1. 10층이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층이상의 층과 지하층은 층마다 구획할 것","  3. 11층이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②제1항의 규정에 의한 방화구획은 다음 각호의 기준에 적합하게 설치하여야 한다.","  1. 영 제46조의 규정에 의한 방화구획으로 사용하는 제26조제1항의 규정에 의한 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 할 것","  2. 급수관ㆍ배전관 기타의 관이 방화구획으로 되어 있는 부분을 관통하는 경우에는 그 관과 방화구획과의 틈을 시멘트모르타르 기타 불연재료로 메울 것","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각목의 기준에 적합한 댐퍼를 설치할 것","    가. 철재로서 철판의 두께가 1.5밀리미터이상일 것","    나. 화재가 발생한 경우에는 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫힐 것","    다. 닫힌 경우에는 방화에 지장이 있는 틈이 생기지 아니할 것","    라. 산업표준화법에 의한 한국산업규격상의 방화댐퍼의 방연시험방법에 적합할 것"]},{"d":"2003-01-06","m":"[건설교통부령 제348호, 2003. 1. 6, 일부개정]","l":["제14조 (방화구획의 설치기준) ①영 제46조의 규정에 의하여 건축물에 설치하는 방화구획은 다음 각호의 기준에 적합하여야 한다.","  1. 10층이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층이상의 층과 지하층은 층마다 구획할 것","  3. 11층이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②제1항의 규정에 의한 방화구획은 다음 각호의 기준에 적합하게 설치하여야 한다. <개정 2003.1.6>","  1. 영 제46조의 규정에 의한 방화구획으로 사용하는 제26조제1항의 규정에 의한 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 할 것","  2. 급수관ㆍ배전관 기타의 관이 방화구획으로 되어 있는 부분을 관통하는 경우에는 그 관과 방화구획과의 틈을 시멘트모르타르 기타 불연재료로 메울 것","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그러하지 아니하다.","    가. 철재로서 철판의 두께가 1.5밀리미터이상일 것","    나. 화재가 발생한 경우에는 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫힐 것","    다. 닫힌 경우에는 방화에 지장이 있는 틈이 생기지 아니할 것","    라. 산업표준화법에 의한 한국산업규격상의 방화댐퍼의 방연시험방법에 적합할 것"]},{"d":"2005-07-22","m":"[건설교통부령 제461호, 2005. 7. 22, 일부개정]","l":["제14조 (방화구획의 설치기준) ①영 제46조의 규정에 의하여 건축물에 설치하는 방화구획은 다음 각호의 기준에 적합하여야 한다.","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층 이상의 층과 지하층은 층마다 구획할 것","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②제1항의 규정에 의한 방화구획은 다음 각호의 기준에 적합하게 설치하여야 한다. <개정 2003.1.6, 2005.7.22>","  1. 영 제46조의 규정에 의한 방화구획으로 사용하는 제26조제1항의 규정에 의한 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 할 것","  2. 급수관ㆍ배전관 기타의 관이 방화구획으로 되어 있는 부분을 관통 는 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫힐 것","    다. 닫힌 경우에는 방화에 지장이 있는 틈이 생기지 아니할 것","    라. 「산업표준화법」에 의한 한국산업규격상의 방화댐퍼의 방연시험방법에 적합할 것","  ③ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치하여야 한다. <신설 2010.4.7>","  1. 피난구의 덮개는 제26조에 따른 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층·하층간 피난구의 설치위치는 수직방향 간격을 15센티미터 이상 띄어서 설치할 것","  3. 아래층에서는 바로 윗층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것"]},{"d":"2012-03-17","m":"[국토해양부령 제433호, 2012. 1. 6, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조에 따라 건축물에 설치하는 방화구획은 다음 각호의 기준에 적합하여야 한다. <개정 2010.4.7>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층 이상의 층과 지하층은 층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6>","  1. 영 제46조의 규정에 의한 방화구획으로 사용하는 제26조에 따른 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기, 온도, 불꽃 등을 가장 신속하게 감지하여 자동적으로 닫히는 구조로 할 것","  2. 외벽과 바닥 사이에 틈이 생긴 때나 급수관·배전관 그 밖의 관이 방화구획으로 되어 있는 부분을 관통하는 경우 그로 인하여 방화구획에 틈이 생긴 때에는 그 틈을  다음 각 목의 어느 하나에 해당하는 것으로 메울 것","    가. 「산업표준화법」에 따른 한국산업규격에서 내화충전성능을 인정한 구조로 된 것","    나. 한국건설기술연구원장이 국토해양부장관이 정하여 고시하는 기준에 따라 내화충전성능을 인정한 구조로 된 것","  3. 환기·난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그러하지 아니하다.","    가. 철재로서 철판의 두께가 1.5밀리미터 이상일 것","    나. 화재가 발생한 경우에는 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫힐 것","    다. 닫힌 경우에는 방화에 지장이 있는 틈이 생기지 아니할 것","    라. 「산업표준화법」에 의한 한국산업규격상의 방화댐퍼의 방연시험방법에 적합할 것","  ③ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치하여야 한다. <신설 2010.4.7>","  1. 피난구의 덮개는 제26조에 따른 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층·하층간 피난구의 설치위치는 수직방향 간격을 15센티미터 이상 띄어서 설치할 것","  3. 아래층에서는 바로 윗층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ④ 제2항제2호에 따른 건축물의 외벽과 바닥 사이의 내화충전방법에 필요한 사항은 국토해양부장관이 정하여 고시한다. <신설 2012.1.6>"]},{"d":"2013-03-23","m":"[국토교통부령 제1호, 2013. 3. 23, 타법개정]","l":["제14조(방화구획의 설치기준) ①영 제46조에 따라 건축물에 설치하는 방화구획은 다음 각호의 기준에 적합하여야 한다. <개정 2010.4.7>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 3층 이상의 층과 지하층은 층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치하여야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23>","  1. 영 제46조의 규정에 의한 방화구획으로 사용하는 제26조에 따른 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기, 온도, 불꽃 등을 가장 신속하게 감지하여 자동적으로 닫히는 구조로 할 것","  2. 외벽과 바닥 사이에 틈이 생긴 때나 급수관·배전관 그 밖의 관이 방화구획으로 되어 있는 부분을 관통하는 경우 그로 인하여 방화구획에 틈이 생긴 때에는 그 틈을  다음 각 목의 어느 하나에 해당하는 것으로 메울 것","    가. 「산업표준화법」에 따른 한국산업규격에서 내화충전성능을 인정한 구조로 된 것","    나. 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 기준에 따라 내화충전성능을 인정한 구조로 된 것","  3. 환기·난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그러하지 아니하다.","    가. 철재로서 철판의 두께가 1.5밀리미터 이상일 것","    나. 화재가 발생한 경우에는 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫힐 것","    다. 닫힌 경우에는 방화에 지장이 있는 틈이 생기지 아니할 것","    라. 「산업표준화법」에 의한 한국산업규격상의 방화댐퍼의 방연시험방법에 적합할 것","  ③ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치하여야 한다. <신설 2010.4.7>","  1. 피난구의 덮개는 제26조에 따른 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층·하층간 피난구의 설치위치는 수직방향 간격을 15센티미터 이상 띄어서 설치할 것","  3. 아래층에서는 바로 윗층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ④ 제2항제2호에 따른 건축물의 외벽과 바닥 사이의 내화충전방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23>"]},{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6>","  1. 영 제46조에 따른 방화구획으로 사용하는 제26조에 따른 갑종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 외벽과 바닥 사이에 틈이 생긴 때나 급수관ㆍ배전관 그 밖의 관이 방화구획으로 되어 있는 부분을 관통하는 경우 그로 인하여 방화구획에 틈이 생긴 때에는 그 틈을  다음 각 목의 어느 하나에 해당하는 것으로 메울 것","    가. 「산업표준화법」에 따른 한국산업표준에서 내화충전성능을 인정한 구조로 된 것","    나. 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 기준에 따라 내화충전성능을 인정한 구조로 된 것","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  ③ 영 제46조제1항에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6>\"","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6>","  1. 피난구의 덮개는 제26조에 따른 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 설치위치는 수직방향 간격을 15센티미터 이상 띄어서 설치할 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 건축물의 외벽과 바닥 사이의 내화충전방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6>"]},{"d":"2021-08-07","m":"[국토교통부령 제832호, 2021. 3. 26, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 각 호 외의 부분 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6, 2021.3.26>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26>","  1. 영 제46조에 따른 방화구획으로 사용하는 60+방화문 또는 60분방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 외벽과 바닥 사이에 틈이 생긴 때나 급수관ㆍ배전관 그 밖의 관이 방화구획으로 되어 있는 부분을 관통하는 경우 그로 인하여 방화구획에 틈이 생긴 때에는 그 틈을 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 기준에 따라 내화채움성능을 인정한 구조로 메울 것","    가. 삭제 <2021.3.26>","    나. 삭제 <2021.3.26>","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  4. 영 제46조제1항제2호와 제81조제5항제5호에 따라 설치되는 자동방화셔터는 피난이 가능한 60+방화문 또는 60분방화문으로부터 3미터 이내에 별도로 설치할 것","  ③ 영 제46조제1항제2호에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6, 2021.3.26>","  1. 피난구의 덮개는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 설치위치는 수직방향 간격을 15센티미터 이상 띄어서 설치할 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 건축물의 외벽과 바닥 사이의 내화채움방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26>"]},{"d":"2021-12-23","m":"[국토교통부령 제931호, 2021. 12. 23, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 각 호 외의 부분 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6, 2021.3.26>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2021.12.23>","  1. 영 제46조에 따른 방화구획으로 사용하는 60+방화문 또는 60분방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 외벽과 바닥 사이에 틈이 생긴 때나 급수관ㆍ배전관 그 밖의 관이 방화구획으로 되어 있는 부분을 관통하는 경우 그로 인하여 방화구획에 틈이 생긴 때에는 그 틈을 별표 1 제1호에 따른 내화시간(내화채움성능이 인정된 구조로 메워지는 구성 부재에 적용되는 내화시간을 말한다) 이상 견딜 수 있는 내화채움성능이 인정된 구조로 메울 것","    가. 삭제 <2021.3.26>","    나. 삭제 <2021.3.26>","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  4. 영 제46조제1항제2호 및 제81조제5항제5호에 따라 설치되는 자동방화셔터는 다음 각 목의 요건을 모두 갖출 것. 이 경우 자동방화셔터의 구조 및 성능기준 등에 관한 세부사항은 국토교통부장관이 정하여 고시한다.","    가. 피난이 가능한 60분+ 방화문 또는 60분 방화문으로부터 3미터 이내에 별도로 설치할 것","    나. 전동방식이나 수동방식으로 개폐할 수 있을 것","    다. 불꽃감지기 또는 연기감지기 중 하나와 열감지기를 설치할 것","    라. 불꽃이나 연기를 감지한 경우 일부 폐쇄되는 구조일 것","    마. 열을 감지한 경우 완전 폐쇄되는 구조일 것","  ③ 영 제46조제1항제2호에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6, 2021.3.26>","  1. 피난구의 덮개는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 설치위치는 수직방향 간격을 15센티미터 이상 띄어서 설치할 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 건축물의 외벽과 바닥 사이의 내화채움방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26>"]},{"d":"2022-04-29","m":"[국토교통부령 제1123호, 2022. 4. 29, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 각 호 외의 부분 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6, 2021.3.26>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2021.12.23>","  1. 영 제46조에 따른 방화구획으로 사용하는 60+방화문 또는 60분방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 외벽과 바닥 사이에 틈이 생긴 때나 급수관ㆍ배전관 그 밖의 관이 방화구획으로 되어 있는 부분을 관통하는 경우 그로 인하여 방화구획에 틈이 생긴 때에는 그 틈을 별표 1 제1호에 따른 내화시간(내화채움성능이 인정된 구조로 메워지는 구성 부재에 적용되는 내화시간을 말한다) 이상 견딜 수 있는 내화채움성능이 인정된 구조로 메울 것","    가. 삭제 <2021.3.26>","    나. 삭제 <2021.3.26>","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  4. 영 제46조제1항제2호 및 제81조제5항제5호에 따라 설치되는 자동방화셔터는 다음 각 목의 요건을 모두 갖출 것. 이 경우 자동방화셔터의 구조 및 성능기준 등에 관한 세부사항은 국토교통부장관이 정하여 고시한다.","    가. 피난이 가능한 60분+ 방화문 또는 60분 방화문으로부터 3미터 이내에 별도로 설치할 것","    나. 전동방식이나 수동방식으로 개폐할 수 있을 것","    다. 불꽃감지기 또는 연기감지기 중 하나와 열감지기를 설치할 것","    라. 불꽃이나 연기를 감지한 경우 일부 폐쇄되는 구조일 것","    마. 열을 감지한 경우 완전 폐쇄되는 구조일 것","  ③ 영 제46조제1항제2호에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 승강식피난기 및 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6, 2021.3.26, 2022.4.29>","  1. 피난구의 덮개(덮개와 사다리, 승강식피난기 또는 경보시스템이 일체형으로 구성된 경우에는 그 사다리, 승강식피난기 또는 경보시스템을 포함한다)는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 수평거리는 15센티미터 이상 떨어져 있을 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 건축물의 외벽과 바닥 사이의 내화채움방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26>","  ⑥ 법 제49조제2항 단서에 따라 영 제46조제7항에 따른 창고시설 중 같은 조 제2항제2호에 해당하여 같은 조 제1항을 적용하지 않거나 완화하여 적용하는 부분에는 다음 각 호의 구분에 따른 설비를 추가로 설치해야 한다. <신설 2022.4.29>","  1. 개구부의 경우: 「화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법률」 제9조제1항 전단에 따라 소방청장이 정하여 고시하는 화재안전기준(이하 이 조에서 화재안전기준\"이라 한다)을 충족하는 설비로서 수막(水幕)을 형성하여 화재확산을 방지하는 설비\"","  2. 개구부 외의 부분의 경우: 화재안전기준을 충족하는 설비로서 화재를 조기에 진화할 수 있도록 설계된 스프링클러"]},{"d":"2024-08-26","m":"[국토교통부령 제1384호, 2024. 8. 26, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 각 호 외의 부분 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6, 2021.3.26>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2021.12.23, 2024.8.26>","  1. 영 제46조에 따른 방화구획으로 사용하는 60+방화문 또는 60분방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 다음 각 목에 해당하는 경우 그 부분을 별표 1 제1호에 따른 내화시간(내화채움성능이 인정된 구조로 메워지는 구성 부재에 적용되는 내화시간을 말한다) 이상 견딜 수 있는 내화채움성능이 인정된 구조로 메울 것","    가. 급수관ㆍ배전관 또는 그 밖의 관이나 전선 등이 방화구획을 관통하여 관통부가 생기는 경우","    나. 방화구획의 벽과 벽, 벽과 바닥, 바닥과 바닥 사이에 접합부가 생기는 경우","    다. 방화구획과 외벽 사이에 접합부가 생기는 경우","    라. 방화구획에 그 밖의 틈이 생기는 경우","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  4. 영 제46조제1항제2호 및 제81조제5항제5호에 따라 설치되는 자동방화셔터는 다음 각 목의 요건을 모두 갖출 것. 이 경우 자동방화셔터의 구조 및 성능기준 등에 관한 세부사항은 국토교통부장관이 정하여 고시한다.","    가. 피난이 가능한 60분+ 방화문 또는 60분 방화문으로부터 3미터 이내에 별도로 설치할 것","    나. 전동방식이나 수동방식으로 개폐할 수 있을 것","    다. 불꽃감지기 또는 연기감지기 중 하나와 열감지기를 설치할 것","    라. 불꽃이나 연기를 감지한 경우 일부 폐쇄되는 구조일 것","    마. 열을 감지한 경우 완전 폐쇄되는 구조일 것","  ③ 영 제46조제1항제2호에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 승강식피난기 및 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6, 2021.3.26, 2022.4.29>","  1. 피난구의 덮개(덮개와 사다리, 승강식피난기 또는 경보시스템이 일체형으로 구성된 경우에는 그 사다리, 승강식피난기 또는 경보시스템을 포함한다)는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 수평거리는 15센티미터 이상 떨어져 있을 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 내화채움방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2024.8.26>","  ⑥ 법 제49조제2항 단서에 따라 영 제46조제7항에 따른 창고시설 중 같은 조 제2항제2호에 해당하여 같은 조 제1항을 적용하지 않거나 완화하여 적용하는 부분에는 다음 각 호의 구분에 따른 설비를 추가로 설치해야 한다. <신설 2022.4.29, 2024.8.26>","  1. 개구부의 경우: 「소방시설 설치 및 관리에 관한 법률」 제12조제1항에 따른 화재안전기준(이하 이 조에서 화재안전기준\"이라 한다)을 충족하는 설비로서 수막(水幕)을 형성하여 화재확산을 방지하는 설비\"","  2. 개구부 외의 부분의 경우: 화재안전기준을 충족하는 설비로서 화재를 조기에 진화할 수 있도록 설계된 스프링클러"]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 각 호 외의 부분 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6, 2021.3.26>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2021.12.23, 2024.8.26, 2024.11.15>","  1. 영 제46조에 따른 방화구획으로 사용하는 60분+ 방화문 또는 60분 방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 다음 각 목에 해당하는 경우 그 부분을 별표 1 제1호에 따른 내화시간(내화채움성능이 인정된 구조로 메워지는 구성 부재에 적용되는 내화시간을 말한다) 이상 견딜 수 있는 내화채움성능이 인정된 구조로 메울 것","    가. 급수관ㆍ배전관 또는 그 밖의 관이나 전선 등이 방화구획을 관통하여 관통부가 생기는 경우","    나. 방화구획의 벽과 벽, 벽과 바닥, 바닥과 바닥 사이에 접합부가 생기는 경우","    다. 방화구획과 외벽 사이에 접합부가 생기는 경우","    라. 방화구획에 그 밖의 틈이 생기는 경우","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  4. 영 제46조제1항제2호 및 제81조제5항제5호에 따라 설치되는 자동방화셔터는 다음 각 목의 요건을 모두 갖출 것. 이 경우 자동방화셔터의 구조 및 성능기준 등에 관한 세부사항은 국토교통부장관이 정하여 고시한다.","    가. 피난이 가능한 60분+ 방화문 또는 60분 방화문으로부터 3미터 이내에 별도로 설치할 것","    나. 전동방식이나 수동방식으로 개폐할 수 있을 것","    다. 불꽃감지기 또는 연기감지기 중 하나와 열감지기를 설치할 것","    라. 불꽃이나 연기를 감지한 경우 일부 폐쇄되는 구조일 것","    마. 열을 감지한 경우 완전 폐쇄되는 구조일 것","  ③ 영 제46조제1항제2호에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 승강식피난기 및 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6, 2021.3.26, 2022.4.29>","  1. 피난구의 덮개(덮개와 사다리, 승강식피난기 또는 경보시스템이 일체형으로 구성된 경우에는 그 사다리, 승강식피난기 또는 경보시스템을 포함한다)는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 수평거리는 15센티미터 이상 떨어져 있을 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 내화채움방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2024.8.26>","  ⑥ 법 제49조제2항 단서에 따라 영 제46조제7항에 따른 창고시설 중 같은 조 제2항제2호에 해당하여 같은 조 제1항을 적용하지 않거나 완화하여 적용하는 부분에는 다음 각 호의 구분에 따른 설비를 추가로 설치해야 한다. <신설 2022.4.29, 2024.8.26>","  1. 개구부의 경우: 「소방시설 설치 및 관리에 관한 법률」 제12조제1항에 따른 화재안전기준(이하 이 조에서 화재안전기준\"이라 한다)을 충족하는 설비로서 수막(水幕)을 형성하여 화재확산을 방지하는 설비\"","  2. 개구부 외의 부분의 경우: 화재안전기준을 충족하는 설비로서 화재를 조기에 진화할 수 있도록 설계된 스프링클러"]},{"d":"2026-10-06","m":"[국토교통부령 제1631호, 2026. 10. 6, 일부개정]","l":["제14조(방화구획의 설치기준) ①영 제46조제1항 각 호 외의 부분 본문에 따라 건축물에 설치하는 방화구획은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2019.8.6, 2021.3.26>","  1. 10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획할 것","  2. 매층마다 구획할 것. 다만, 지하 1층에서 지상으로 직접 연결하는 경사로 부위는 제외한다.","  3. 11층 이상의 층은 바닥면적 200제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 600제곱미터)이내마다 구획할 것. 다만, 벽 및 반자의 실내에 접하는 부분의 마감을 불연재료로 한 경우에는 바닥면적 500제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 1천500제곱미터)이내마다 구획하여야 한다.","  4. 필로티나 그 밖에 이와 비슷한 구조(벽면적의 2분의 1 이상이 그 층의 바닥면에서 위층 바닥 아래면까지 공간으로 된 것만 해당한다)의 부분을 주차장으로 사용하는 경우 그 부분은 건축물의 다른 부분과 구획할 것","  ②제1항에 따른 방화구획은 다음 각 호의 기준에 적합하게 설치해야 한다. <개정 2003.1.6, 2005.7.22, 2006.6.29, 2008.3.14, 2010.4.7, 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2021.12.23, 2024.8.26, 2024.11.15, 2026.10.6>","  1. 영 제46조에 따른 방화구획으로 사용하는 60분+ 방화문 또는 60분 방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","  2. 다음 각 목에 해당하는 경우 그 부분을 별표 1 제1호에 따른 내화시간(내화채움성능이 인정된 구조로 메워지는 구성 부재에 적용되는 내화시간을 말한다) 이상 견딜 수 있는 내화채움성능이 인정된 구조로 메울 것","    가. 급수관ㆍ배전관 또는 그 밖의 관이나 전선 등이 방화구획을 관통하여 관통부가 생기는 경우","    나. 방화구획의 벽과 벽, 벽과 바닥, 바닥과 바닥 사이에 접합부가 생기는 경우","    다. 방화구획과 외벽 사이에 접합부가 생기는 경우","    라. 방화구획에 그 밖의 틈이 생기는 경우","  3. 환기ㆍ난방 또는 냉방시설의 풍도가 방화구획을 관통하는 경우에는 그 관통부분 또는 이에 근접한 부분에 다음 각 목의 기준에 적합한 댐퍼를 설치할 것. 다만, 반도체공장건축물로서 방화구획을 관통하는 풍도의 주위에 스프링클러헤드를 설치하는 경우에는 그렇지 않다.","    가. 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 것. 다만, 주방 등 연기가 항상 발생하는 부분에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    나. 국토교통부장관이 정하여 고시하는 비차열(非遮熱) 성능 및 방연성능 등의 기준에 적합할 것","    다. 삭제 <2019.8.6>","    라. 삭제 <2019.8.6>","  4. 영 제46조제1항제2호 및 제81조제5항제5호에 따라 설치되는 자동방화셔터는 다음 각 목의 요건을 모두 갖출 것. 이 경우 자동방화셔터의 구조 및 성능기준 등에 관한 세부사항은 국토교통부장관이 정하여 고시한다.","    가. 피난이 가능한 60분+ 방화문 또는 60분 방화문으로부터 3미터 이내에 별도로 설치할 것. 다만, 복합 방화셔터(피난을 위한 방화문이 설치된 자동방화셔터를 말한다)를 설치하는 경우에는 그렇지 않다.","    나. 전동방식이나 수동방식으로 개폐할 수 있을 것","    다. 불꽃감지기 또는 연기감지기 중 하나와 열감지기를 설치할 것","    라. 불꽃이나 연기를 감지한 경우 일부 폐쇄되는 구조일 것","    마. 열을 감지한 경우 완전 폐쇄되는 구조일 것","  ③ 영 제46조제1항제2호에서 국토교통부령으로 정하는 기준에 적합한 것\"이란 한국건설기술연구원장이 국토교통부장관이 정하여 고시하는 바에 따라 다음 각 호의 사항을 모두 인정한 것을 말한다. <신설 2019.8.6","  1. 생산공장의 품질 관리 상태를 확인한 결과 국토교통부장관이 정하여 고시하는 기준에 적합할 것","  2. 해당 제품의 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 확보하였을 것","  ④ 영 제46조제5항제3호에 따른 하향식 피난구(덮개, 사다리, 승강식피난기 및 경보시스템을 포함한다)의 구조는 다음 각 호의 기준에 적합하게 설치해야 한다. <신설 2010.4.7, 2019.8.6, 2021.3.26, 2022.4.29>","  1. 피난구의 덮개(덮개와 사다리, 승강식피난기 또는 경보시스템이 일체형으로 구성된 경우에는 그 사다리, 승강식피난기 또는 경보시스템을 포함한다)는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 하며, 피난구의 유효 개구부 규격은 직경 60센티미터 이상일 것","  2. 상층ㆍ하층간 피난구의 수평거리는 15센티미터 이상 떨어져 있을 것","  3. 아래층에서는 바로 위층의 피난구를 열 수 없는 구조일 것","  4. 사다리는 바로 아래층의 바닥면으로부터 50센터미터 이하까지 내려오는 길이로 할 것","  5. 덮개가 개방될 경우에는 건축물관리시스템 등을 통하여 경보음이 울리는 구조일 것","  6. 피난구가 있는 곳에는 예비전원에 의한 조명설비를 설치할 것","  ⑤ 제2항제2호에 따른 내화채움방법에 필요한 사항은 국토교통부장관이 정하여 고시한다. <신설 2012.1.6, 2013.3.23, 2019.8.6, 2021.3.26, 2024.8.26>","  ⑥ 법 제49조제2항 단서에 따라 영 제46조제7항에 따른 창고시설 중 같은 조 제2항제2호에 해당하여 같은 조 제1항을 적용하지 않거나 완화하여 적용하는 부분에는 다음 각 호의 구분에 따른 설비를 추가로 설치해야 한다. <신설 2022.4.29, 2024.8.26>","  1. 개구부의 경우: 「소방시설 설치 및 관리에 관한 법률」 제12조제1항에 따른 화재안전기준(이하 이 조에서 화재안전기준\"이라 한다)을 충족하는 설비로서 수막(水幕)을 형성하여 화재확산을 방지하는 설비\"","  2. 개구부 외의 부분의 경우: 화재안전기준을 충족하는 설비로서 화재를 조기에 진화할 수 있도록 설계된 스프링클러"]}],"방화벽의_구조":[{"d":"1999-05-09","m":"[건설교통부령 제184호, 1999. 5. 7, 제정]","l":["제21조 (방화벽의 구조) ①영 제57조제2항의 규정에 의하여 건축물에 설치하는 방화벽은 다음 각호의 기준에 적합하여야 한다.","  1. 내화구조로서 홀로 설 수 있는 구조일 것","  2. 방화벽의 양쪽 끝과 윗쪽 끝을 건축물의 외벽면 및 지붕면으로부터 0.5미터이상 튀어 나오게 할 것","  3. 방화벽에 설치하는 출입문의 너비 및 높이는 각각 2.5미터이하로 하고, 당해출입문에는 제26조제1항의 규정에 의한 갑종방화문을 설치할 것","  ②제14조제2항의 규정은 제1항의 규정에 의한 방화벽의 구조에 관하여 이를 준용한다."]},{"d":"2010-04-07","m":"[국토해양부령 제238호, 2010. 4. 7, 일부개정]","l":["제21조(방화벽의 구조) ①영 제57조제2항에 따라 건축물에 설치하는 방화벽은 다음 각호의 기준에 적합하여야 한다. <개정 2010.4.7>","  1. 내화구조로서 홀로 설 수 있는 구조일 것","  2. 방화벽의 양쪽 끝과 윗쪽 끝을 건축물의 외벽면 및 지붕면으로부터 0.5미터 이상 튀어 나오게 할 것","  3. 방화벽에 설치하는 출입문의 너비 및 높이는 각각 2.5미터 이하로 하고, 해당 출입문에는 제26조에 따른 갑종방화문을 설치할 것","  ②제14조제2항의 규정은 제1항의 규정에 의한 방화벽의 구조에 관하여 이를 준용한다."]},{"d":"2021-08-07","m":"[국토교통부령 제832호, 2021. 3. 26, 일부개정]","l":["제21조(방화벽의 구조) ①영 제57조제2항에 따라 건축물에 설치하는 방화벽은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2021.3.26>","  1. 내화구조로서 홀로 설 수 있는 구조일 것","  2. 방화벽의 양쪽 끝과 윗쪽 끝을 건축물의 외벽면 및 지붕면으로부터 0.5미터 이상 튀어 나오게 할 것","  3. 방화벽에 설치하는 출입문의 너비 및 높이는 각각 2.5미터 이하로 하고, 해당 출입문에는 60+방화문 또는 60분방화문을 설치할 것","  ②제14조제2항의 규정은 제1항의 규정에 의한 방화벽의 구조에 관하여 이를 준용한다."]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제21조(방화벽의 구조) ①영 제57조제2항에 따라 건축물에 설치하는 방화벽은 다음 각 호의 기준에 적합해야 한다. <개정 2010.4.7, 2021.3.26, 2024.11.15>","  1. 내화구조로서 홀로 설 수 있는 구조일 것","  2. 방화벽의 양쪽 끝과 윗쪽 끝을 건축물의 외벽면 및 지붕면으로부터 0.5미터 이상 튀어 나오게 할 것","  3. 방화벽에 설치하는 출입문의 너비 및 높이는 각각 2.5미터 이하로 하고, 해당 출입문에는 6  관람실(바닥면적이 300제곱미터 이상인 경우에 한정한다)의 바깥쪽에는 그 양쪽 및 뒤쪽에 각각 복도를 설치할 것","  2. 하나의 층에 개별 관람실(바닥면적이 300제곱미터 미만인 경우에 한정한다)을 2개소 이상 연속하여 설치하는 경우에는 그 관람실의 바깥쪽의 앞쪽과 뒤쪽에 각각 복도를 설치할 것","  [본조신설 2005.7.22]"]},{"d":"2026-10-06","m":"[국토교통부령 제1631호, 2026. 10. 6, 일부개정]","l":["제15조의2(복도의 너비 및 설치기준) ①영 제48조의 규정에 의하여 건축물에 설치하는 복도의 유효너비는 다음 표와 같이 하여야 한다","  ②문화 및 집회시설(공연장ㆍ집회장ㆍ관람장ㆍ전시장에 한정한다), 종교시설 중 종교집회장, 노유자시설 중 아동 관련 시설ㆍ노인복지시설, 수련시설 중 생활권수련시설, 위락시설 중 유흥주점 및 장례식장의 관람실 또는 집회실과 접하는 복도의 유효너비는 제1항에도 불구하고 다음 각 호에서 정하는 너비로 해야 한다. <개정 2010.4.7, 2019.8.6>","  1. 해당 층에서 해당 용도로 쓰는 바닥면적의 합계가 500제곱미터 미만인 경우 1.5미터 이상","  2. 해당 층에서 해당 용도로 쓰는 바닥면적의 합계가 500제곱미터 이상 1천제곱미터 미만인 경우 1.8미터 이상","  3. 해당 층에서 해당 용도로 쓰는 바닥면적의 합계가 1천제곱미터 이상인 경우 2.4미터 이상","  ③문화 및 집회시설 중 공연장에 설치하는 복도는 다음 각 호의 기준에 적합해야 한다. <개정 2019.8.6>","  1. 공연장의 개별 관람실(바닥면적이 300제곱미터 이상인 경우에 한정한다)의 바깥쪽에는 그 양쪽 및 뒤쪽에 각각 복도를 설치할 것","  2. 하나의 층에 개별 관람실(바닥면적이 300제곱미터 미만인 경우에 한정한다)을 2개소 이상 연속하여 설치하는 경우에는 그 관람실의 바깥쪽의 앞쪽과 뒤쪽에 각각 복도를 설치할 것","  ④ 법 제19조에 따라 「공공주택 특별법 시행령」 제37조제1항제3호에 해당하는 건축물을 「주택법 시행령」 제4조의 준주택으로 용도변경하려는 경우로서 다음 각 호의 요건을 모두 갖춘 경우에는 용도변경한 건축물의 복도 중 양 옆에 거실이 있는 복도의 유효너비는 제1항에도 불구하고 1.5미터 이상으로 할 수 있다. <신설 2021.10.15, 2026.10.6>","  1. 용도변경의 목적이 해당 건축물을 「공공주택 특별법」 제43조제1항에 따라 공공매입임대주택으로 공급하려는 공공주택사업자에게 매도하려는 것일 것","  2. 둘 이상의 직통계단이 지상까지 직접 연결되어 있을 것","  3. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비가 0.9미터 이상일 것","  4. 제3호의 출입구에는 영 제64조제1항제1호 또는 제2호에 따른 방화문을 피난하려는 방향으로 열리도록 설치하되, 해당 방화문은 항상 닫힌 상태를 유지하거나 화재로 인한 연기나 불꽃을 감지하여 자동으로 닫히는 구조일 것. 다만, 연기나 불꽃을 감지하여 자동으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동으로 닫히는 구조로 할 수 있다.","  ⑤ 제1항에도 불구하고 영 제48조제3항에 따라 숙박시설 중 생활숙박시설(양 옆에 거실이 있는 복도의 유효너비를 1.8미터 이상으로 하여 건축허가를 신청한 경우는 제외한다)을 업무시설 중 오피스텔로 용도를 변경하는 경우에는 오피스텔의 복도 중 양 옆에 거실이 있는 복도의 유효너비를 1.5미터 이상으로 할 수 있다. <신설 2025.4.24>","  [본조신설 2005.7.22]"]}],"복합건축물의_피난시설":[{"d":"2003-01-06","m":"[건설교통부령 제348호, 2003. 1. 6, 일부개정]","l":["제14조의2 (복합건축물의 피난시설 등) 영 제47조제1항 단서의 규정에 의하여 같은 건축물안에 공동주택ㆍ의료시설ㆍ아동시설ㆍ노인시설ㆍ다중주택ㆍ기숙사 또는 오피스텔(이하 이 조에서 공동주택등\"이라 한다)중 하나 이상과 위락시설ㆍ공연장ㆍ위험물저장 및 처리시설ㆍ숙박시설ㆍ유스호스텔ㆍ공장 또는 자동차정비공장(이하 이 조에서 \"위락시설등\"이라 한다)중 하나 이상을 함께 설치하고자 하는 경우에는 다음 각호의 기준에 적합하여야 한다.\"","  1. 공동주택등의 출입구와 위락시설등의 출입구는 서로 그 보행거리가 30미터 이상이 되도록 설치할 것","  2. 공동주택등(당해 공동주택등에 출입하는 통로를 포함한다)과 위락시설등(당해 위락시설등에 출입하는 통로를 포함한다)은 내화구조로 된 바닥 및 벽으로 구획하여 서로 차단할 것","  3. 공동주택등과 위락시설등은 서로 이웃하지 아니하도록 배치할 것","  4. 건축물의 주요 구조부를 내화구조로 할 것","  5. 거실의 벽 및 반자가 실내에 면하는 부분(반자돌림대ㆍ창대 그 밖에 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하고, 그 거실로부터 지상으로 통하는 주된 복도ㆍ계단 그밖에 통로의 벽 및 반자가 실내에 면하는 부분의 마감은 불연재료 또는 준불연재료로 할 것","  [본조신설 2003.1.6]"]},{"d":"2005-07-22","m":"[건설교통부령 제461호, 2005. 7. 22, 일부개정]","l":["제14조의2 (복합건축물의 피난시설 등) 영 제47조제1항 단서의 규정에 의하여 같은 건축물안에 공동주택ㆍ의료시설ㆍ아동관련시설 또는 노인복지시설(이하 이 조에서 공동주택등\"이라 한다)중 하나 이상과 위락시설ㆍ위험물저장 및 처리시설ㆍ공장 또는 자동차정비공장(이하 이 조에서 \"위락시설등\"이라 한다)중 하나 이상을 함께 설치하고자 하는 경우에는 다음 각 호의 기준에 적합하여야 한다. <개정 2005.7.22>\"","  1. 공동주택등의 출입구와 위락시설등의 출입구는 서로 그 보행거리가 30미터 이상이 되도록 설치할 것","  2. 공동주택등(당해 공동주택등에 출입하는 통로를 포함한다)과 위락시설등(당해 위락시설등에 출입하는 통로를 포함한다)은 내화구조로 된 바닥 및 벽으로 구획하여 서로 차단할 것","  3. 공동주택등과 위락시설등은 서로 이웃하지 아니하도록 배치할 것","  4. 건축물의 주요 구조부를 내화구조로 할 것","  5. 거실의 벽 및 반자가 실내에 면하는 부분(반자돌림대ㆍ창대 그 밖에 이와 유사한 것을 제외한다. 이하 이 조에서 같다)의 마감은 불연재료ㆍ준불연재료 또는 난연재료로 하고, 그 거실로부터 지상으로 통하는 주된 복도ㆍ계단 그밖에 통로의 벽 및 반자가 실내에 면하는 부분의 마감은 불연재료 또는 준불연재료로 할 것","  [본조신설 2003.1.6]"]}],"비상용_승강기의_설치":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제90조(비상용승강기의 설치) ①법 제57조제2항의 규정에 의하여 높이 31미터를 넘는 건축물에는 다음 각호의 기준에 의한 대수이상의 비상용승강기를 설치하여야 한다. 다만, 제89조의 규정에 의하여 설치되는 승용승강기를 비상용승강기의 구조로 하는 경우에는 그러하지 아니하다.","  1. 높이 31미터를 넘는 각층의 바닥면적중 최대바닥면적이 1천500제곱미터이하인 건축물에는 1대이상","  2. 높이 31미터를 넘는 각층의 바닥면적중 최대바닥면적이 1천500제곱미터를 넘는 건축물에는 1대에 1천500제곱미터를 넘는 매 3천제곱미터이내마다 1대씩 가산한 대수이상","  ②제1항의 규정에 의하여 2대이상의 비상용승강기를 설치하는 경우에는 화재시 소화에 지장이 없도록 일정한 간격을 두고 설치하여야 한다.","  ③건축물에 설치하는 비상용승강기 및 그 승강장의 구조등은 건설부령으로 정하되, 산업안전보건에 관한 법령이 정하는 기준에 적합하여야 한다."]},{"d":"1994-12-23","m":"[대통령령 제14447호, 1994. 12. 23, 타법개정]","l":["제90조(비상용승강기의 설치) ①법 제57조제2항의 규정에 의하여 높이 31미터를 넘는 건축물에는 다음 각호의 기준에 의한 대수이상의 비상용승강기를 설치하여야 한다. 다만, 제89조의 규정에 의하여 설치되는 승용승강기를 발생시키도록 하되, 수동으로 전원을 바꿀 수 있도록 할 것.","      (2) 2시간이상 작동할 수 있도록 할 것","    라. 승강기의 운행속도는 분당 60미터이상으로할 것","  2. 비상용승강기 승강장의 구조","    가. 승강장의 창문·출입구 기타 개구부를 제외한 부분은 당해 건축물의 다른 부분과 내화구조의 바닥 및 벽으로 구획할 것","    나. 승강장은 피난층을 제외한 각층의 내부와 연결될 수 있도록 하되, 그 출입구(승강로의 출입구를 제외한다)에는 갑종방화문을 설치할 것","    다. 노대 또는 외부를 향하여 열 수 있는 창문이나 제14조제2항의 규정에 의한 배연설비를 설치할 것","    라. 벽 및 반자가 실내에 접하는 부분의 마감재료(마감을 위한 바탕을 포함한다)는 불연재료로 할 것","    마. 채광이 되는 창문이 있거나 예비전원에 의한 조명설비를 할 것","    바. 승강장의 바닥면적은 비상용승강기 1대에 대하여 6제곱미터이상으로 할 것. 다만, 옥외에 승강장을 설치하는 경우에는 그러하지 아니하다.","    사. 피난층이 있는 승강장의 출입구(승강장이 없는 경우에는 승강로의 출입구)로부터 도로 또는 공지(공원·광장 기타 이와 유사한 것으로서 피난 및 소화를 위한 당해 대지에의 출입에 지장이 없는 것을 말한다)에 이르는 거리가 30미터이하일 것","    아. 승강장 출입구 부근의 잘 보이는 곳에 당해 승강기가 비상용승강기임을 알 수 있는 표지를 할 것"]},{"d":"1996-02-09","m":"[건설교통부령 제51호, 1996. 2. 9, 일부개정]","l":["제10조 (비상용승강기의 승강장 및 승강로의 구조<개정 1996.2.9>) 영 제90조제3항의 규정에 의한 비상용승강기의 승강장 및 승강로의 구조는 다음 각호의 기준에 적합하여야 한다.<개정 1996.2.9>","  1.삭제<1996.2.9>","  2. 비상용승강기 승강장의 구조","    가. 승강장의 창문·출입구 기타 개구부를 제외한 부분은 당해 건축물의 다른 부분과 내화구조의 바닥 및 벽으로 구획할 것","    나. 승강장은 피난층을 제외한 각층의 내부와 연결될 수 있도록 하되, 그 출입구(승강로의 출입구를 제외한다)에는 갑종방화문을 설치할 것","    다. 노대 또는 외부를 향하여 열 수 있는 창문이나 제14조제2항의 규정에 의한 배연설비를 설치할 것","    라. 벽 및 반자가 실내에 접하는 부분의 마감재료(마감을 위한 바탕을 포함한다)는 불연재료로 할 것","    마. 채광이 되는 창문이 있거나 예비전원에 의한 조명설비를 할 것","    바. 승강장의 바닥면적은 비상용승강기 1대에 대하여 6제곱미터이상으로 할 것. 다만, 옥외에 승강장을 설치하는 경우에는 그러하지 아니하다.","    사. 피난층이 있는 승강장의 출입구(승강장이 없는 경우에는 승강로의 출입구)로부터 도로 또는 공지(공원·광장 기타 이와 유사한 것으로서 피난 및 소화를 위한 당해 대지에의 출입에 지장이 없는 것을 말한다)에 이르는 거리가 30미터이하일 것","    아. 승강장 출입구 부근의 잘 보이는 곳에 당해 승강기가 비상용승강기임을 알 수 있는 표지를 할 것","  3. 비상용승강기의 승강로의 구조","    가. 승강로는 당해 건축물의 다른 부분과 내화구조로 구획할 것","    나. 승강로는 전층을 단일구조로서 연결하여 설치할 것"]},{"d":"1999-05-11","m":"[건설교통부령 제188호, 1999. 5. 11, 일부개정]","l":["제10조 (비상용승강기의 승강장 및 승강로의 구조<개정 1996.2.9>) 법 제57조제2항의 규정에 의한 비상용승강기의 승강장 및 승강로의 구조는 다음 각호의 기준에 적합하여야 한다.<개정 1996.2.9, 1999.5.11>","  1. 삭제 <1996.2.9>","  2. 비상용승강기 승강장의 구조","    가. 승강장의 창문·출입구 기타 개구부를 제외한 부분은 당해 건축물의 다른 부분과 내화구조의 바닥 및 벽으로 구획할 것. 다만, 공동주택의 경우에는 승강장과 특별피난 서 피난 및 소화를 위한 당해 대지에의 출입에 지장이 없는 것을 말한다)에 이르는 거리가 30미터 이하일 것","    아. 승강장 출입구 부근의 잘 보이는 곳에 당해 승강기가 비상용승강기임을 알 수 있는 표지를 할 것","  3. 비상용승강기의 승강로의 구조","    가. 승강로는 당해 건축물의 다른 부분과 내화구조로 구획할 것","    나. 각층으로부터 피난층까지 이르는 승강로를 단일구조로 연결하여 설치할 것"]},{"d":"2024-08-07","m":"[국토교통부령 제1375호, 2024. 8. 7, 일부개정]","l":["제10조(비상용승강기의 승강장 및 승강로의 구조) 법 제64조제2항에 따른 비상용승강기의 승강장 및 승강로의 구조는 다음 각 호의 기준에 적합하여야 한다. <개정 1996.2.9, 1999.5.11, 2002.8.31, 2006.2.13, 2008.7.10, 2024.8.7>","  1. 삭제 <1996.2.9>","  2. 비상용승강기 승강장의 구조","    가. 승강장의 창문ㆍ출입구 기타 개구부를 제외한 부분은 당해 건축물의 다른 부분과 내화구조의 바닥 및 벽으로 구획할 것. 다만, 공동주택의 경우에는 승강장과 특별피난계단(「건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙」 제9조의 규정에 의한 특별피난계단을 말한다. 이하 같다)의 부속실과의 겸용부분을 특별피난계단의 계단실과 별도로 구획하는 때에는 승강장을 특별피난계단의 부속실과 겸용할 수 있다.","    나. 승강장은 각층의 내부와 연결될 수 있도록 하되, 그 출입구(승강로의 출입구를 제외한다)에는 60분+ 방화문 또는 60분 방화문을 설치할 것. 다만, 피난층에는 60분+ 방화문 또는 60분 방화문을 설치하지 않을 수 있다.","    다. 노대 또는 외부를 향하여 열 수 있는 창문이나 제14조제2항의 규정에 의한 배연설비를 설치할 것","    라. 벽 및 반자가 실내에 접하는 부분의 마감재료(마감을 위한 바탕을 포함한다)는 불연재료로 할 것","    마. 채광이 되는 창문이 있거나 예비전원에 의한 조명설비를 할 것","    바. 승강장의 바닥면적은 비상용승강기 1대에 대하여 6제곱미터 이상으로 할 것. 다만, 옥외에 승강장을 설치하는 경우에는 그러하지 아니하다.","    사. 피난층이 있는 승강장의 출입구(승강장이 없는 경우에는 승강로의 출입구)로부터 도로 또는 공지(공원ㆍ광장 기타 이와 유사한 것으로서 피난 및 소화를 위한 당해 대지에의 출입에 지장이 없는 것을 말한다)에 이르는 거리가 30미터 이하일 것","    아. 승강장 출입구 부근의 잘 보이는 곳에 당해 승강기가 비상용승강기임을 알 수 있는 표지를 할 것","  3. 비상용승강기의 승강로의 구조","    가. 승강로는 당해 건축물의 다른 부분과 내화구조로 구획할 것","    나. 각층으로부터 피난층까지 이르는 승강로를 단일구조로 연결하여 설치할 것","  [제목개정 1996.2.9]"]}],"소방관_진입창의_기준":[{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제18조의2(소방관 진입창의 기준) 법 제49조제3항에서 국토교통부령으로 정하는 기준\"이란 다음 각 호의 요건을 모두 충족하는 것을 말한다.\"","  1. 2층 이상 11층 이하인 층에 각각 1개소 이상 설치할 것. 이 경우 소방관이 진입할 수 있는 창의 가운데에서 벽면 끝까지의 수평거리가 40미터 이상인 경우에는 40미터 이내마다 소방관이 진입할 수 있는 창을 추가로 설치해야 한다.","  2. 소방차 진입로 또는 소방차 진입이 가능한 공터에 면할 것","  3. 창문의 가운데에 지름 20센티미터 이상의 역삼각형을 야간에도 알아볼 수 있도록 빛 반사 등으로 붉은색으로 표시할 것","  4. 창문의 한쪽 모서리에 타격지점을 지름 3센티미터 이상의 원형으로 표시할 것","  5. 창문의 크기는 폭 90센티미터 이상, 높이 1.2미터 이상으로 하고, 실내 바닥면으로부터 창의 아랫부분까지의 높이는 80센티미터 이내로 할 것","  6. 다음 각 목의 어느 하나에 해당하는 유리를 사용할 것","    가. 플로트판유리로서 그 두께가 6밀리미터 이하인 것","    나. 강화유리 또는 배강도유리로서 그 두께가 5밀리미터 이하인 것","    다. 가목 또는 나목에 해당하는 유리로 구성된 이중 유리로서 그 두께가 24밀리미터 이하인 것","  [본조신설 2019.8.6]"]},{"d":"2024-08-26","m":"[국토교통부령 제1384호, 2024. 8. 26, 일부개정]","l":["제18조의2(소방관 진입창의 기준) 법 제49조제3항에서 국토교통부령으로 정하는 기준\"이란 다음 각 호의 요건을 모두 충족하는 것을 말한다. <개정 2024.8.26>\"","  1. 2층 이상 11층 이하인 층에 각각 1개소 이상 설치할 것. 이 경우 소방관이 진입할 수 있는 창의 가운데에서 벽면 끝까지의 수평거리가 40미터 이상인 경우에는 40미터 이내마다 소방관이 진입할 수 있는 창을 추가로 설치해야 한다.","  2. 소방차 진입로 또는 소방차 진입이 가능한 공터에 면할 것","  3. 창문의 가운데에 지름 20센티미터 이상의 역삼각형을 야간에도 알아볼 수 있도록 빛 반사 등으로 붉은색으로 표시할 것","  4. 창문의 한쪽 모서리에 타격지점을 지름 3센티미터 이상의 원형으로 표시할 것","  5. 창문 유리의 크기는 폭 90센티미터 이상, 높이 1미터 이상으로 하고, 실내 바닥면으로부터 창의 아랫부분까지의 높이는 80센티미터[난간이 설치된 노대등(영 제40조제1항에 따른 노대등을 말한다)에 불가피하게 소방관 진입창을 설치하는 경우에는 120센티미터] 이내로 할 것","  6. 다음 각 목의 어느 하나에 해당하는 유리를 사용할 것","    가. 플로트판유리로서 그 두께가 6밀리미터 이하인 것","    나. 강화유리 또는 배강도유리로서 그 두께가 5밀리미터 이하인 것","    다. 가목 또는 나목에 해당하는 유리로 구성된 이중 유리","    라. 가목 또는 나목에 해당하는 유리로 구성된 삼중 유리. 이 경우 각각의 유리에 비산방지필름을 부착하는 경우에는 그 필름 두께를 50마이크로미터 이하로 해야 한다.","  [본조신설 2019.8.6]"]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제18조의2(소방관 진입창의 기준) 법 제49조제3항에서 국토교통부령으로 정하는 기준\"이란 다음 각 호의 요건을 모두 충족하는 것을 말한다. <개정 2024.8.26","  1. 2층 이상 11층 이하인 층(직접 지상으로 통하는 출입구가 있는 층은 제외한다)에 각각 1개소 이상 설치할 것. 이 경우 소방관이 진입할 수 있는 창의 가운데에서 벽면 끝까지의 수평거리가 40미터 이상인 경우에는 40미터 이내마다 소방관이 진입할 수 있는 창을 추가로 설치해야 한다.","  2. 소방차 진입로 또는 소방차 진입이 가능한 공터에 면할 것","  3. 창문의 가운데에 지름 20센티미터 이상의 역삼각형을 야간에도 알아볼 수 있도록 빛 반사 등으로 붉은색으로 표시할 것","  4. 창문의 한쪽 모서리에 타격지점을 지름 3센티미터 이상의 원형으로 표시할 것","  5. 창문 유리의 크기는 폭 90센티미터 이상, 높이 1미터 이상으로 하고, 실내 바닥면으로부터 창의 아랫부분까지의 높이는 80센티미터[난간이 설치된 노대등(영 제40조제1항에 따른 노대등을 말한다)에 불가피하게 소방관 진입창을 설치하는 경우에는 120센티미터] 이내로 할 것","  6. 다음 각 목의 어느 하나에 해당하는 유리를 사용할 것","    가. 플로트판유리로서 그 두께가 6밀리미터 이하인 것","    나. 강화유리 또는 배강도유리로서 그 두께가 5밀리미터 이하인 것","    다. 가목 또는 나목에 해당하는 유리로 구성된 이중 유리","    라. 가목 또는 나목에 해당하는 유리로 구성된 삼중 유리. 이 경우 각각의 유리에 비산방지필름을 부착하는 경우에는 그 필름 두께를 50마이크로미터 이하로 해야 한다.","  [본조신설 2019.8.6]"]},{"d":"2025-09-19","m":"[국토교통부령 제1524호, 2025. 9. 19, 일부개정]","l":["제18조의2(소방관 진입창의 기준) 법 제49조제3항에서 국토교통부령으로 정하는 기준\"이란 다음 각 호의 요건을 모두 충족하는 것을 말한다. <개정 2024.8.26","  1. 2층 이상 11층 이하인 층에 각각 1개소 이상 설치할 것. 다만, 직접 지상으로 통하는 출입구가 있는 층 및 바닥구조체 윗면의 높이가 지표면으로부터 44미터를 초과하는 층에는 설치하지 않을 수 있다.","  1의2. 소방관이 진입할 수 있는 창의 가운데에서 벽면 끝까지의 수평거리가 40미터 이상인 경우에는 40미터 이내마다 소방관이 진입할 수 있는 창을 추가로 설치할 것. 다만, 불가피한 경우에는 「소방시설 설치 및 관리에 관한 법률」 제6조제5항에 따른 소방본부장 또는 소방서장의 검토 자료 또는 의견서에 따라 완화하여 적용할 수 있다.","  2. 소방차 진입로 또는 소방차 진입이 가능한 공터에 면할 것","  3. 창문의 가운데에 지름 20센티미터 이상의 역삼각형을 야간에도 알아볼 수 있도록 빛 반사 등으로 붉은색으로 표시할 것","  4. 창문의 한쪽 모서리에 타격지점을 지름 3센티미터 이상의 원형으로 표시할 것","  5. 창문 유리의 크기는 폭 90센티미터 이상, 높이 1미터 이상으로 하고, 실내 바닥면으로부터 창의 아랫부분까지의 높이는 80센티미터[난간이 설치된 노대등(영 제40조제1항에 따른 노대등을 말한다)에 불가피하게 소방관 진입창을 설치하는 경우에는 120센티미터] 이내로 할 것","  6. 다음 각 목의 어느 하나에 해당하는 유리를 사용할 것","    가. 플로트판유리로서 그 두께가 6밀리미터 이하인 것","    나. 강화유리 또는 배강도유리로서 그 두께가 5밀리미터 이하인 것","    다. 가목 또는 나목에 해당하는 유리로 구성된 이중 유리","    라. 가목 또는 나목에 해당하는 유리로 구성된 삼중 유리. 이 경우 각각의 유리에 비산방지필름을 부착하는 경우에는 그 필름 두께를 50마이크로미터 이하로 해야 한다.","  [본조신설 2019.8.6]"]}],"옥외_피난계단의_설치":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제36조(옥외피난계단의 설치기준) 건축물의 피난층을 제외한 3층이상의 층으로서 다음 각호의 1에 해당하는 용도에 쓰이는 층의 경우에는 제34조의 규정에 의한 직통계단외에 그 층으로부터 지상으로 통하는 옥외피난계단을 따로 설치하여야 한다.","  1. 공연ㆍ무도등의 용도에 쓰이는 바닥면적의 합계가 300제곱미터이상인 공연장 및 무도유흥음식점","  2. 집회의 용도에 쓰이는 바닥면적의 합계가 1천제곱미터이상인 집회장"]},{"d":"1996-01-06","m":"[대통령령 제14891호, 1995. 12. 30, 일부개정]","l":["제36조(옥외피난계단의 설치기준) 건축물의 피난층을 제외한 3층이상의 층으로서 다음 각호의 1에 해당하는 용도에 쓰이는 층의 경우에는 제34조의 규정에 의한 직통계단외에 그 층으로부터 지상으로 통하는 옥외피난계단을 따로 설치하여야 한다.<개정 1995ㆍ12ㆍ30>","  1. 공연ㆍ무도등의 용도에 쓰이는 바닥면적의 합계가 300제곱미터이상인 공연장 및 유흥주점","  2. 집회의 용도에 쓰이는 바닥면적의 합계가 1천제곱미터이상인 집회장"]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제36조(옥외피난계단의 설치<개정 1999.4.30>) 건축물의 3층이상의 층(피난층을 제외한다)으로서 다음 각호의 1에 해당하는 용도에 쓰이는 층의 경우에는 제34조의 규정에 의한 직통계단외에 그 층으로부터 지상으로 통하는 옥외피난계단을 따로 설치하여야 한다.<개정 1995ㆍ12ㆍ30, 1997ㆍ9ㆍ9, 1999ㆍ4ㆍ30>","  1. 공연ㆍ무도등의 용도에 쓰이는 층의 거실의 바닥면적의 합계가 300제곱미
