[전문개정 2008.10.29]"]},{"d":"2009-07-16","m":"[대통령령 제21629호, 2009. 7. 16, 일부개정]","l":["제34조 (직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토해양부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토해양부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16>","  1. 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제2종 근린생활시설 중 학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔, 숙박시설 또는 장례식장의 용도로 쓰는 3층 이상의 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(초고층 건축물의 피난·안전을 위하여 지상층으로부터 최대 30개 층마다 설치하는 대피공간을 말한다. 이하 같다)을 설치하여야 한다. <신설 2009.7.16>","  ④ 제3항에 따른 피난안전구역의 규모와 설치기준은 국토해양부령으로 정한다. <신설 2009.7.16>","  [전문개정 2008.10.29]"]},{"d":"2010-02-18","m":"[대통령령 제22052호, 2010. 2. 18, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항에 따른 초고층 건축물의 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토해양부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토해양부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16>","  1. 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제2종 근린생활시설 중 학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔, 숙박시설 또는 장례식장의 용도로 쓰는 3층 이상의 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(초고층 건축물의 피난·안전을 위하여 지상층으로부터 최대 30개 층마다 설치하는 대피공간을 말한다. 이하 같다)을 설치하여야 한다. <신설 2009.7.16>","  ④ 제3항에 따른 피난안전구역의 규모와 설치기준은 국토해양부령으로 정한다. <신설 2009.7.16>","  [전문개정 2008.10.29]"]},{"d":"2012-03-17","m":"[대통령령 제23469호, 2011. 12. 30, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토해양부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토해양부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16>","  1. 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제2종 근린생활시설 중 학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔, 숙박시설 또는 장례식장의 용도로 쓰는 3층 이상의 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(건축물의 피난·안전을 위하여 건축물 중간층에 설치하는 대피공간을 말한다. 이하 같다)을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다. <신설 2009.7.16, 2011.12.30>","  ④ 준초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 해당 건축물 전체 층수의 2분의 1에 해당하는 층으로부터 상하 5개층 이내에 1개소 이상 설치하여야 한다. 다만, 국토해양부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 설치하는 경우에는 그러하지 아니하다. <신설 2011.12.30>","  ⑤ 제3항 및 제4항에 따른 피난안전구역의 규모와 설치기준은 국토해양부령으로 정한다. <신설 2009.7.16, 2011.12.30>","  [전문개정 2008.10.29]"]},{"d":"2013-03-23","m":"[대통령령 제24443호, 2013. 3. 23, 타법개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장ㆍ집회장ㆍ관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토교통부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30, 2013.3.23>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16, 2013.3.23>","  1. 문화 및 집회시설(전시장 및 동ㆍ식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터 이상인 것","  2. 단독주택 중 다중주택ㆍ다가구주택, 제2종 근린생활시설 중 학원ㆍ독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설ㆍ노인복지시설, 수련시설 중 유스호스텔, 숙박시설 또는 장례식장의 용도로 쓰는 3층 이상의 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(건축물의 피난ㆍ안전을 위하여 건축물 중간층에 설치하는 대피공간을 말한다. 이하 같다)을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다. <신설 2009.7.16, 2011.12.30>","  ④ 준초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 해당 건축물 전체 층수의 2분의 1에 해당하는 층으로부터 상하 5개층 이내에 1개소 이상 설치하여야 한다. 다만, 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 설치하는 경우에는 그러하지 아니하다. <신설 2011.12.30, 2013.3.23>","  ⑤ 제3항 및 제4항에 따른 피난안전구역의 규모와 설치기준은 국토교통부령으로 정한다. <신설 2009.7.16, 2011.12.30, 2013.3.23>","  [전문개정 2008.10.29]"]},{"d":"2014-03-24","m":"[대통령령 제25273호, 2014. 3. 24, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토교통부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30, 2013.3.23>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16, 2013.3.23, 2014.3.24>","  1. 제2종 근린생활시설 중 공연장·종교집회장, 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터(제2종 근린생활시설 중 공연장·종교집회장은 각각 300제곱미터) 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제2종 근린생활시설 중 인터넷컴퓨터게임시설제공업소(해당 용도로 쓰는 바닥면적의 합계가 300제곱미터 이상인 경우만 해당한다)·학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설, 수련시설 중 유스호스텔 또는 숙박시설의 용도로 쓰는 3층 이상의 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(건축물의 피난·안전을 위하여 건축물 중간층에 설치하는 대피공간을 말한다. 이하 같다)을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다. <신설 2009.7.16, 2011.12.30>","  ④ 준초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 해당 건축물 전체 층수의 2분의 1에 해당하는 층으로부터 상하 5개층 이내에 1개소 이상 설치하여야 한다. 다만, 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 설치하는 경우에는 그러하지 아니하다. <신설 2011.12.30, 2013.3.23>","  ⑤ 제3항 및 제4항에 따른 피난안전구역의 규모와 설치기준은 국토교통부령으로 정한다. <신설 2009.7.16, 2011.12.30, 2013.3.23>","  [전문개정 2008.10.29]"]},{"d":"2015-09-22","m":"[대통령령 제26542호, 2015. 9. 22, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토교통부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30, 2013.3.23>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16, 2013.3.23, 2014.3.24, 2015.9.22>","  1. 제2종 근린생활시설 중 공연장·종교집회장, 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례식장의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터(제2종 근린생활시설 중 공연장·종교집회장은 각각 300제곱미터) 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제1종 근린생활시설 중 정신과의원(입원실이 있는 경우로 한정한다), 제2종 근린생활시설 중 인터넷컴퓨터게임시설제공업소(해당 용도로 쓰는 바닥면적의 합계가 300제곱미터 이상인 경우만 해당한다)·학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설·장애인 거주시설(「장애인복지법」 제58조제1항제1호에 따른 장애인 거주시설 중 국토교통부령으로 정하는 시설을 말한다. 이하 같다) 및 「장애인복지법」 제58조제1항제4호에 따른 장애인 의료재활시설(이하 장애인 의료재활시설\"이라 한다)","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(건축물의 피난·안전을 위하여 건축물 중간층에 설치하는 대피공간을 말한다. 이하 같다)을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다. <신설 2009.7.16, 2011.12.30>","  ④ 준초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 해당 건축물 전체 층수의 2분의 1에 해당하는 층으로부터 상하 5개층 이내에 1개소 이상 설치하여야 한다. 다만, 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 설치하는 경우에는 그러하지 아니하다. <신설 2011.12.30, 2013.3.23>","  ⑤ 제3항 및 제4항에 따른 피난안전구역의 규모와 설치기준은 국토교통부령으로 정한다. <신설 2009.7.16, 2011.12.30, 2013.3.23>","  [전문개정 2008.10.29]"]},{"d":"2017-02-04","m":"[대통령령 제27832호, 2017. 2. 3, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치하여야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토교통부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30, 2013.3.23>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16, 2013.3.23, 2014.3.24, 2015.9.22, 2017.2.3>","  1. 제2종 근린생활시설 중 공연장·종교집회장, 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례시설의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터(제2종 근린생활시설 중 공연장·종교집회장은 각각 300제곱미터) 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제1종 근린생활시설 중 정신과의원(입원실이 있는 경우로 한정한다), 제2종 근린생활시설 중 인터넷컴퓨터게임시설제공업소(해당 용도로 쓰는 바닥면적의 합계가 300제곱미터 이상인 경우만 해당한다)·학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설·장애인 거주시설(「장애인복지법」 제58조제1항제1호에 따른 장애인 거주시설 중 국토교통부령으로 정하는 시설을 말한다. 이하 같다) 및 「장애인복지법」 제58조제1항제4호에 따른 장애인 의료재활시설(이하 장애인 의료재활시설\"이라 한다)","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(건축물의 피난·안전을 위하여 건축물 중간층에 설치하는 대피공간을 말한다. 이하 같다)을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다. <신설 2009.7.16, 2011.12.30>","  ④ 준초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 해당 건축물 전체 층수의 2분의 1에 해당하는 층으로부터 상하 5개층 이내에 1개소 이상 설치하여야 한다. 다만, 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 설치하는 경우에는 그러하지 아니하다. <신설 2011.12.30, 2013.3.23>","  ⑤ 제3항 및 제4항에 따른 피난안전구역의 규모와 설치기준은 국토교통부령으로 정한다. <신설 2009.7.16, 2011.12.30, 2013.3.23>","  [전문개정 2008.10.29]"]},{"d":"2019-08-06","m":"[대통령령 제30030호, 2019. 8. 6, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 1개소의 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치해야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장ㆍ집회장ㆍ관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택은 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토교통부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30, 2013.3.23, 2019.8.6>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16, 2013.3.23, 2014.3.24, 2015.9.22, 2017.2.3>","  1. 제2종 근린생활시설 중 공연장ㆍ종교집회장, 문화 및 집회시설(전시장 및 동ㆍ식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례시설의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터(제2종 근린생활시설 중 공연장ㆍ종교집회장은 각각 300제곱미터) 이상인 것","  2. 단독주택 중 다중주택ㆍ다가구주택, 제1종 근린생활시설 중 정신과의원(입원실이 있는 경우로 한정한다), 제2종 근린생활시설 중 인터넷컴퓨터게임시설제공업소(해당 용도로 쓰는 바닥면적의 합계가 300제곱미터 이상인 경우만 해당한다)ㆍ학원ㆍ독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설ㆍ노인복지시설ㆍ장애인 거주시설(「장애인복지법」 제58조제1항제1호에 따른 장애인 거주시설 중 국토교통부령으로 정하는 시설을 말한다. 이하 같다) 및 「장애인복지법」 제58조제1항제4호에 따른 장애인 의료재활시설(이하 장애인 의료재활시설\"이라 한다)","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1호부터 제3호까지의 용도로 쓰지 아니하는 3층 이상의 층으로서 그 층 거실의 바닥면적의 합계가 400제곱미터 이상인 것","  5. 지하층으로서 그 층 거실의 바닥면적의 합계가 200제곱미터 이상인 것","  ③ 초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역(건축물의 피난ㆍ안전을 위하여 건축물 중간층에 설치하는 대피공간을 말한다. 이하 같다)을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다. <신설 2009.7.16, 2011.12.30>","  ④ 준초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 해당 건축물 전체 층수의 2분의 1에 해당하는 층으로부터 상하 5개층 이내에 1개소 이상 설치하여야 한다. 다만, 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 설치하는 경우에는 그러하지 아니하다. <신설 2011.12.30, 2013.3.23>","  ⑤ 제3항 및 제4항에 따른 피난안전구역의 규모와 설치기준은 국토교통부령으로 정한다. <신설 2009.7.16, 2011.12.30, 2013.3.23>","  [전문개정 2008.10.29]"]},{"d":"2020-10-08","m":"[대통령령 제31100호, 2020. 10. 8, 일부개정]","l":["제34조(직통계단의 설치) ① 건축물의 피난층(직접 지상으로 통하는 출입구가 있는 층 및 제3항과 제4항에 따른 피난안전구역을 말한다. 이하 같다) 외의 층에서는 피난층 또는 지상으로 통하는 직통계단(경사로를 포함한다. 이하 같다)을 거실의 각 부분으로부터 계단(거실로부터 가장 가까운 거리에 있는 1개소의 계단을 말한다)에 이르는 보행거리가 30미터 이하가 되도록 설치해야 한다. 다만, 건축물(지하층에 설치하는 것으로서 바닥면적의 합계가 300제곱미터 이상인 공연장·집회장·관람장 및 전시장은 제외한다)의 주요구조부가 내화구조 또는 불연재료로 된 건축물은 그 보행거리가 50미터(층수가 16층 이상인 공동주택의 경우 16층 이상인 층에 대해서는 40미터) 이하가 되도록 설치할 수 있으며, 자동화 생산시설에 스프링클러 등 자동식 소화설비를 설치한 공장으로서 국토교통부령으로 정하는 공장인 경우에는 그 보행거리가 75미터(무인화 공장인 경우에는 100미터) 이하가 되도록 설치할 수 있다. <개정 2009.7.16, 2010.2.18, 2011.12.30, 2013.3.23, 2019.8.6, 2020.10.8>","  ② 법 제49조제1항에 따라 피난층 외의 층이 다음 각 호의 어느 하나에 해당하는 용도 및 규모의 건축물에는 국토교통부령으로 정하는 기준에 따라 피난층 또는 지상으로 통하는 직통계단을 2개소 이상 설치하여야 한다. <개정 2009.7.16, 2013.3.23, 2014.3.24, 2015.9.22, 2017.2.3>","  1. 제2종 근린생활시설 중 공연장·종교집회장, 문화 및 집회시설(전시장 및 동·식물원은 제외한다), 종교시설, 위락시설 중 주점영업 또는 장례시설의 용도로 쓰는 층으로서 그 층에서 해당 용도로 쓰는 바닥면적의 합계가 200제곱미터(제2종 근린생활시설 중 공연장·종교집회장은 각각 300제곱미터) 이상인 것","  2. 단독주택 중 다중주택·다가구주택, 제1종 근린생활시설 중 정신과의원(입원실이 있는 경우로 한정한다), 제2종 근린생활시설 중 인터넷컴퓨터게임시설제공업소(해당 용도로 쓰는 바닥면적의 합계가 300제곱미터 이상인 경우만 해당한다)·학원·독서실, 판매시설, 운수시설(여객용 시설만 해당한다), 의료시설(입원실이 없는 치과병원은 제외한다), 교육연구시설 중 학원, 노유자시설 중 아동 관련 시설·노인복지시설·장애인 거주시설(「장애인복지법」 제58조제1항제1호에 따른 장애인 거주시설 중 국토교통부령으로 정하는 시설을 말한다. 이하 같다) 및 「장애인복지법」 제58조제1항제4호에 따른 장애인 의료재활시설(이하 장애인 의료재활시설\"이라 한다)","  3. 공동주택(층당 4세대 이하인 것은 제외한다) 또는 업무시설 중 오피스텔의 용도로 쓰는 층으로서 그 층의 해당 용도로 쓰는 거실의 바닥면적의 합계가 300제곱미터 이상인 것","  4. 제1 바닥면적의 20분의 1 이상이어야 한다. 다만, 기계환기장치 및 중앙관리방식의 공기조화설비를 설치하는 경우에는 그러하지 아니하다.","  ③제1항 및 제2항의 규정을 적용함에 있어서 수시로 개방할 수 있는 미닫이로 구획된 2개의 거실은 이를 1개의 거실로 본다.","  ④ 영 제51조제3항에서 국토해양부령으로정하는 기준\"이란 높이 1.2미터 이상의 난간이나 그 밖에 이와 유사한 추락방지를 위한 안전시설을 말한다. <신설 2010.4.7>\""]},{"d":"2013-03-23","m":"[국토교통부령 제1호, 2013. 3. 23, 타법개정]","l":["제17조(채광 및 환기를 위한 창문등) ①영 제51조에 따라 채광을 위하여 거실에 설치하는 창문등의 면적은 그 거실의 바닥면적의 10분의 1 이상이어야 한다. 다만, 거실의 용도에 따라 별표 1의3에 따라 조도 이상의 조명장치를 설치하는 경우에는 그러하지 아니하다. <개정 2000.6.3, 2010.4.7, 2012.1.6>","  ②영 제51조의 규정에 의하여 환기를 위하여 거실에 설치하는 창문등의 면적은 그 거실의 바닥면적의 20분의 1 이상이어야 한다. 다만, 기계환기장치 및 중앙관리방식의 공기조화설비를 설치하는 경우에는 그러하지 아니하다.","  ③제1항 및 제2항의 규정을 적용함에 있어서 수시로 개방할 수 있는 미닫이로 구획된 2개의 거실은 이를 1개의 거실로 본다.","  ④ 영 제51조제3항에서 국토교통부령으로정하는 기준\"이란 높이 1.2미터 이상의 난간이나 그 밖에 이와 유사한 추락방지를 위한 안전시설을 말한다. <신설 2010.4.7"]}],"피난계단_및_특별피난계단의_구조":[{"d":"1999-05-09","m":"[건설교통부령 제184호, 1999. 5. 7, 제정]","l":["제9조 (피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층이상 또는 지하 2층이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항의 규정에 의한 피난계단 및 특별피난계단의 구조는 다음 각호의 기준에 적합하여야 한다.","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실 및 반자의 실내에 접하는 부분의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 채광이 될 수 있는 창문등을 설치하거나 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 당해건축물의 다른 부분에 설치하는 창문등으로부터 2미터이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재시 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 된 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)으로부터 2미터이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터이상인 창문(바닥으로부터 1미터이상의 높이에 설치한 것에 한한다) 또는 건축물의설비기준등에관한규칙 제14조의 규정에 적합한 구조의 배연설비가 있는 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(공동주택에 있어서 부속실과 건축물의설비기준등에관한규칙 제10조의 규정에 의한 비상용승강기의 승강장을 겸용하는 경우의 그 부속실 또는 승강장을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 벽 및 반자로서 실내에 접하는 부분의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실 및 부속실에는 채광이 될 수 있는 창문등을 설치하거나 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해건축물의 다른 부분에 설치하는 창문등으로부터 2미터이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조제1항의 규정에 의한 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터이상으로 할 것","  ③영 제35조제1항의 규정에 의한 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조제2항의 규정에 의하여 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 당해건축물의 옥상으로 통하도록 설치하여야 한다."]},{"d":"2000-06-03","m":"[건설교통부령 제241호, 2000. 6. 3, 일부개정]","l":["제9조 (피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층이상 또는 지하 2층이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항의 규정에 의한 피난계단 및 특별피난계단의 구조는 다음 각호의 기준에 적합하여야 한다.<개정 2000.6.3>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실 및 반자의 실내에 접하는 부분의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 채광이 될 수 있는 창문등을 설치하거나 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 당해건축물의 다른 부분에 설치하는 창문등으로부터 2미터이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재시 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 된 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)으로부터 2미터이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터이상인 창문(바닥으로부터 1미터이상의 높이에 설치한 것에 한한다) 또는 건축물의설비기준등에관한규칙 제14조의 규정에 적합한 구조의 배연설비가 있는 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(건축물의설비기준등에관한규칙 제10조제2호가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 벽 및 반자로서 실내에 접하는 부분의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실 및 부속실에는 채광이 될 수 있는 창문등을 설치하거나 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해건축물의 다른 부분에 설치하는 창문등으로부터 2미터이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조제1항의 규정에 의한 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항의 규정에 의한 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조제2항의 규정에 의하여 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 당해건축물의 옥상으로 통하도록 설치하여야 한다."]},{"d":"2003-01-06","m":"[건설교통부령 제348호, 2003. 1. 6, 일부개정]","l":["제9조 (피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층이상 또는 지하 2층이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항의 규정에 의한 피난계단 및 특별피난계단의 구조는 다음 열 수 있을 것","  ③영 제35조제1항의 규정에 의한 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조제2항의 규정에 의하여 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 당해건축물의 옥상으로 통하도록 설치하여야 한다."]},{"d":"2005-07-22","m":"[건설교통부령 제461호, 2005. 7. 22, 일부개정]","l":["제9조 (피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항의 규정에 의한 피난계단 및 특별피난계단의 구조는 다음 각호의 기준에 적합하여야 한다.<개정 2000.6.3, 2003.1.6, 2005.7.22>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재시 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 된 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조제1항의 규정에 의한 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항의 규정에 의한 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조제2항의 규정에 의하여 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 당해 건축물의 옥상으로 통하도록 설치하여야 한다."]},{"d":"2006-06-29","m":"[건설교통부령 제523호, 2006. 6. 29, 일부개정]","l":["제9조 (피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항의 규정에 의한 피난계단 및 특별피난계단의 구조는 다음 각호의 기준에 적합하여야 한다.<개정 2000.6.3, 2003.1.6, 2005.7.22>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재시 연기의 발생 또는 온도의 상승에 의하여 자동적으로 닫히는 구조로 된 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조제1항의 규정에 의한 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항의 규정에 의한 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조제2항의 규정에 의하여 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 당해 건축물의 옥상으로 통하도록 설치하여야 한다.","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기(外氣)에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29>\""]},{"d":"2010-04-07","m":"[국토해양부령 제238호, 2010. 4. 7, 일부개정]","l":["제9조(피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항에 따른 피난계단 및 특별피난계단의 구조는 다음 각호의 기준에 적합하여야 한다. <개정 2000.6.3, 2003.1.6, 2005.7.22, 2010.4.7>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문·출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재로 인한 연기, 온도, 불꽃 등을 가장 신속하게 감지하여 자동적으로 닫히는 구조로 된 제26조에 따른 갑종방화문을 설치할 것","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조에 따른 갑종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 부속실을 통하여 연결할 것","    나. 계단실·노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실·노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실·노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조에 따른 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조의 규정에 의한 갑종방화문 또는 을종방화문을 설치할 것","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항에 따른 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조에 따라 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 해당 건축물의 옥상으로 통하도록 설치하여야 한다. 이 경우 옥상으로 통하는 출입문은 피난방향으로 열리는 구조로서 피난시 이용에 장애가 없어야 한다. <개정 2010.4.7>","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기(外氣)에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29>\""]},{"d":"2012-03-17","m":"[국토해양부령 제433호, 2012. 1. 6, 일부개정]","l":["제9조(피난계단 및 특별피난계단의 구조) ①영 제35조제1항의 규정에 의하여 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다.","  ②제1항에 따른 피난계단 및 특별피난계단의 구조는 다음 각호의 기준에 적합하여야 한다. <개정 2000.6.3, 2003.1.6, 2005.7.22, 2010.4.7, 2012.1.6>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문·출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재로 인한 연기, 온도, 불꽃 등을 가장 신속하게 감지하여 자동적으로 닫히는 구조로 된 제26조에 따른 갑종방화문을 설치할 것","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조에 따른 갑종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 면적 3제곱미터 이상인 부속실을 통하여 연결할 것","    나. 계단실·노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실·노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실·노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조에 따른 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조에 따른 갑종방화문 또는 을종방화문을 설치할 것. 이 경우 갑종방화문 또는 을종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기, 온도, 불꽃 등을 가장 신속하게 감지하여 자동적으로 닫히는 구조로 하여야 한다.","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항에 따른 피난계단 또는 특별피난계단은 돌음계단으로 하여서는 아니되며, 영 제40조에 따라 옥상광장을 설치하여야 하는 건축물의 피난계단 또는 특별피난계단은 해당 건축물의 옥상으로 통하도록 설치하여야 한다. 이 경우 옥상으로 통하는 출입문은 피난방향으로 열리는 구조로서 피난시 이용에 장애가 없어야 한다. <개정 2010.4.7>","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기(外氣)에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29>\""]},{"d":"2019-08-06","m":"[국토교통부령 제641호, 2019. 8. 6, 일부개정]","l":["제9조(피난계단 및 특별피난계단의 구조) ①영 제35조제1항 각 호 외의 부분 본문에 따라 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치해야 한다. <개정 2019.8.6>","  ②제1항에 따른 피난계단 및 특별피난계단의 구조는 다음 각 호의 기준에 적합해야 한다. <개정 2000.6.3, 2003.1.6, 2005.7.22, 2010.4.7, 2012.1.6, 2019.8.6>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 된 제26조에 따른 갑종방화문을 설치할 것. 다만, 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 제26조에 따른 갑종방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 면적 3제곱미터 이상인 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 제26조에 따른 갑종방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 제26조에 따른 갑종방화문 또는 을종방화문을 설치할 것. 이 경우 갑종방화문 또는 을종방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 해야 하고, 연기 또는 불꽃으로 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항 각 호 외의 부분 본문에 따른 피난계단 또는 특별피난계단은 돌음계단으로 해서는 안 되며, 영 제40조에 따라 옥상광장을 설치해야 하는 건축물의 피난계단 또는 특별피난계단은 해당 건축물의 옥상으로 통하도록 설치해야 한다. 이 경우 옥상으로 통하는 출입문은 피난방향으로 열리는 구조로서 피난 시 이용에 장애가 없어야 한다. <개정 2010.4.7, 2019.8.6>","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기(外氣)에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29>\""]},{"d":"2021-08-07","m":"[국토교통부령 제832호, 2021. 3. 26, 일부개정]","l":["제9조(피난계단 및 특별피난계단의 구조) ①영 제35조제1항 각 호 외의 부분 본문에 따라 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치해야 한다. <개정 2019.8.6>","  ②제1항에 따른 피난계단 및 특별피난계단의 구조는 다음 각 호의 기준에 적합해야 한다. <개정 2000.6.3, 2003.1.6, 2005.7.22, 2010.4.7, 2012.1.6, 2019.8.6, 2021.3.26>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 된 영 제64조제1항제1호의 60+ 방화문(이하 60+방화문\"이라 한다) 또는 같은 항 제2호의 방화문(이하 \"60분방화문\"이라 한다)을 설치할 것. 다만","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 60+방화문 또는 60분방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 면적 3제곱미터 이상인 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 60+방화문 또는 60분방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 60+방화문, 60분방화문 또는 영 제64조제1항제3호의 30분 방화문을 설치할 것. 이 경우 방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 해야 하고, 연기 또는 불꽃으로 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항 각 호 외의 부분 본문에 따른 피난계단 또는 특별피난계단은 돌음계단으로 해서는 안 되며, 영 제40조에 따라 옥상광장을 설치해야 하는 건축물의 피난계단 또는 특별피난계단은 해당 건축물의 옥상으로 통하도록 설치해야 한다. 이 경우 옥상으로 통하는 출입문은 피난방향으로 열리는 구조로서 피난 시 이용에 장애가 없어야 한다. <개정 2010.4.7, 2019.8.6>","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기(外氣)에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29>\""]},{"d":"2022-02-11","m":"[국토교통부령 제884호, 2021. 9. 3, 일부개정]","l":["제9조(피난계단 및 특별피난계단의 구조) ①영 제35조제1항 각 호 외의 부분 본문에 따라 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치해야 한다. <개정 2019.8.6>","  ②제1항에 따른 피난계단 및 특별피난계단의 구조는 다음 각 호의 기준에 적합해야 한다. <개정 2000.6.3, 2003.1.6, 2005.7.22, 2010.4.7, 2012.1.6, 2019.8.6, 2021.3.26>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 된 영 제64조제1항제1호의 60+ 방화문(이하 60+방화문\"이라 한다) 또는 같은 항 제2호의 방화문(이하 \"60분방화문\"이라 한다)을 설치할 것. 다만","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 60+방화문 또는 60분방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 면적 3제곱미터 이상인 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 60+방화문 또는 60분방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 60+방화문, 60분방화문 또는 영 제64조제1항제3호의 30분 방화문을 설치할 것. 이 경우 방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 해야 하고, 연기 또는 불꽃으로 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항 각 호 외의 부분 본문에 따른 피난계단 또는 특별피난계단은 돌음계단으로 해서는 안 되며, 영 제40조에 따라 옥상광장을 설치해야 하는 건축물의 피난계단 또는 특별피난계단은 해당 건축물의 옥상으로 통하도록 설치해야 한다. 이 경우 옥상으로 통하는 출입문은 피난방향으로 열리는 구조로서 피난 시 이용에 장애가 없어야 한다. <개정 2010.4.7, 2019.8.6>","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29"]},{"d":"2024-11-15","m":"[국토교통부령 제1404호, 2024. 11. 15, 일부개정]","l":["제9조(피난계단 및 특별피난계단의 구조) ①영 제35조제1항 각 호 외의 부분 본문에 따라 건축물의 5층 이상 또는 지하 2층 이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(지하 1층인 건축물의 경우에는 5층 이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하 1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치해야 한다. <개정 2019.8.6>","  ②제1항에 따른 피난계단 및 특별피난계단의 구조는 다음 각 호의 기준에 적합해야 한다. <개정 2000.6.3, 2003.1.6, 2005.7.22, 2010.4.7, 2012.1.6, 2019.8.6, 2021.3.26, 2024.11.15>","  1. 건축물의 내부에 설치하는 피난계단의 구조","    가. 계단실은 창문ㆍ출입구 기타 개구부(이하 창문등\"이라 한다)를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것\"","    나. 계단실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    다. 계단실에는 예비전원에 의한 조명설비를 할 것","    라. 계단실의 바깥쪽과 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)은 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    마. 건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    바. 건축물의 내부에서 계단실로 통하는 출입구의 유효너비는 0.9미터 이상으로 하고, 그 출입구에는 피난의 방향으로 열 수 있는 것으로서 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 된 영 제64조제1항제1호의 60분+ 방화문(이하 60분+ 방화문\"이라 한다) 또는 같은 항 제2호의 60분 방화문(이하 \"60분 방화문\"이라 한다)을 설치할 것. 다만","    사. 계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","  2. 건축물의 바깥쪽에 설치하는 피난계단의 구조","    가. 계단은 그 계단으로 통하는 출입구외의 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터 이하인 것을 제외한다)으로부터 2미터 이상의 거리를 두고 설치할 것","    나. 건축물의 내부에서 계단으로 통하는 출입구에는 60분+ 방화문 또는 60분 방화문을 설치할 것","    다. 계단의 유효너비는 0.9미터 이상으로 할 것","    라. 계단은 내화구조로 하고 지상까지 직접 연결되도록 할 것","  3. 특별피난계단의 구조","    가. 건축물의 내부와 계단실은 노대를 통하여 연결하거나 외부를 향하여 열 수 있는 면적 1제곱미터 이상인 창문(바닥으로부터 1미터 이상의 높이에 설치한 것에 한한다) 또는 「건축물의 설비기준 등에 관한 규칙」 제14조의 규정에 적합한 구조의 배연설비가 있는 면적 3제곱미터 이상인 부속실을 통하여 연결할 것","    나. 계단실ㆍ노대 및 부속실(「건축물의 설비기준 등에 관한 규칙」 제10조제2호 가목의 규정에 의하여 비상용승강기의 승강장을 겸용하는 부속실을 포함한다)은 창문등을 제외하고는 내화구조의 벽으로 각각 구획할 것","    다. 계단실 및 부속실의 실내에 접하는 부분(바닥 및 반자 등 실내에 면한 모든 부분을 말한다)의 마감(마감을 위한 바탕을 포함한다)은 불연재료로 할 것","    라. 계단실에는 예비전원에 의한 조명설비를 할 것","    마. 계단실ㆍ노대 또는 부속실에 설치하는 건축물의 바깥쪽에 접하는 창문등(망이 들어 있는 유리의 붙박이창으로서 그 면적이 각각 1제곱미터이하인 것을 제외한다)은 계단실ㆍ노대 또는 부속실외의 당해 건축물의 다른 부분에 설치하는 창문등으로부터 2미터 이상의 거리를 두고 설치할 것","    바. 계단실에는 노대 또는 부속실에 접하는 부분외에는 건축물의 내부와 접하는 창문등을 설치하지 아니할 것","    사. 계단실의 노대 또는 부속실에 접하는 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","    아. 노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문등(출입구를 제외한다)을 설치하지 아니할 것","    자. 건축물의 내부에서 노대 또는 부속실로 통하는 출입구에는 60분+ 방화문 또는 60분 방화문을 설치하고, 노대 또는 부속실로부터 계단실로 통하는 출입구에는 60분+ 방화문, 60분 방화문 또는 영 제64조제1항제3호의 30분 방화문을 설치할 것. 이 경우 방화문은 언제나 닫힌 상태를 유지하거나 화재로 인한 연기 또는 불꽃을 감지하여 자동적으로 닫히는 구조로 해야 하고, 연기 또는 불꽃으로 감지하여 자동적으로 닫히는 구조로 할 수 없는 경우에는 온도를 감지하여 자동적으로 닫히는 구조로 할 수 있다.","    차. 계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것","    카. 출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","  ③영 제35조제1항 각 호 외의 부분 본문에 따른 피난계단 또는 특별피난계단은 돌음계단으로 해서는 안 되며, 영 제40조에 따라 옥상광장을 설치해야 하는 건축물의 피난계단 또는 특별피난계단은 해당 건축물의 옥상으로 통하도록 설치해야 한다. 이 경우 옥상으로 통하는 출입문은 피난방향으로 열리는 구조로서 피난 시 이용에 장애가 없어야 한다. <개정 2010.4.7, 2019.8.6>","  ④영 제35조제2항에서 갓복도식 공동주택\"이라 함은 각 층의 계단실 및 승강기에서 각 세대로 통하는 복도의 한쪽 면이 외기에 개방된 구조의 공동주택을 말한다. <신설 2006.6.29"]}],"피난계단의_설치":[{"d":"1992-06-01","m":"[대통령령 제13655호, 1992. 5. 30, 전부개정]","l":["제35조(피난계단의 설치기준) ①건축물의 5층이상 또는 지하 2층이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(5층이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하1층의 계단을 포함한다)은 제37조의 규정에 의한 피난계단 또는 특별피난계단으로 설치하여야 한다. 다만, 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 5층이상의 층의 바닥면적의 합계가 200제곱미터이하이거나 그 이상이더라도 매 200제곱미터 이내마다 방화구획이 되어 있는 경우에는 그러하지 아니하다.","  ②건축물(갓복도식 공동주택을 제외한다)의 11층(공동주택의 경우에는 16층)이상 또는 지하 3층이하의 층(바닥면적이 400제곱미터미만인 층을 제외한다)으로부터 피난층 또는 지상으로 통하는 직통계단은 제1항의 규정에 불구하고 제37조의 규정에 의한 특별피난계단으로 설치하여야 한다.","  ③제1항의 경우에 판매시설의 용도에 쓰이는 층으로부터의 직통계단은 그 중 1개소이상을 제37조제3항의 규정에 의한 특별피난계단으로 설치하여야 한다.","  ④제40조제2항의 규정에 의하여 옥상광장을 설치하여야 하는 건축물에 제1항 내지 제3항의 규정에 의하여 설치하는 피난계단 또는 특별피난계단은 당해건축물의 옥상광장으로 통하도록 설치하여야 한다.","  ⑤건축물의 5층이상의 층으로서 운동시설ㆍ위락시설ㆍ전시시설ㆍ운수시설(다중이 이용하는 시설에 한한다)ㆍ관광휴게시설(다중이 이용하는 시설에 한한다)ㆍ생활권청소년시설 및 판매시설의 용도에 쓰이는 층에는 제34조의 규정에 의한 직통계단외에 그 층의 당해 용도에 쓰이는 바닥면적의 합계가 2천제곱미터를 넘는 경우에는 그 넘는 매 2천제곱미터이내마다 1개소의 제37조의 규정에 의한 피난계단 또는 특별피난계단(4층이하의 층에 쓰이지 아니하는 것에 한한다)을 설치하여야 한다."]},{"d":"1996-01-06","m":"[대통령령 제14891호, 1995. 12. 30, 일부개정]","l":["제35조(피난계단의 설치기준) ①건축물의 5층이상 또는 지하 2층이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(5층이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다. 다만, 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 5층이상의 층의 바닥면적의 합계가 200제곱미터이하이거나 그 이상이더라도 매 200제곱미터 이내마다 방화구획이 되어 있는 경우에는 그러하지 아니하다.<개정 1995ㆍ12ㆍ30>","  ②건축물(갓복도식 공동주택을 제외한다)의 11층(공동주택의 경우에는 16층)이상 또는 지하 3층이하의 층(바닥면적이 400제곱미터미만인 층을 제외한다)으로부터 피난층 또는 지상으로 통하는 직통계단은 제1항의 규정에 불구하고 특별피난계단으로 설치하여야 한다.<개정 1995ㆍ12ㆍ30>","  ③제1항의 경우에 판매시설의 용도에 쓰이는 층으로부터의 직통계단은 그 중 1개소이상을 특별피난계단으로 설치하여야 한다.<개정 1995ㆍ12ㆍ30>","  ④삭제<1995ㆍ12ㆍ30>","  ⑤건축물의 5층이상의 층으로서 운동시설ㆍ위락시설ㆍ전시시설ㆍ운수시설(다중이 이용하는 시설에 한한다)ㆍ관광휴게시설(다중이 이용하는 시설에 한한다)ㆍ생활권청소년시설 및 판매시설의 용도에 쓰이는 층에는 제34조의 규정에 의한 직통계단외에 그 층의 당해 용도에 쓰이는 바닥면적의 합계가 2천제곱미터를 넘는 경우에는 그 넘는 매 2천제곱미터이내마다 1개소의 피난계단 또는 특별피난계단(4층이하의 층에 쓰이지 아니하는 것에 한한다)을 설치하여야 한다.<개정 1995ㆍ12ㆍ30>","  ⑥피난계단 및 특별피난계단의 구조등에 관하여 필요한 사항은 건설교통부령으로 정한다.<신설 1995ㆍ12ㆍ30>"]},{"d":"1997-09-09","m":"[대통령령 제15476호, 1997. 9. 9, 일부개정]","l":["제35조 (피난계단의 설치기준) ①건축물의 5층이상 또는 지하 2층이하의 층으로부터 피난층 또는 지상으로 통하는 직통계단(5층이상의 층으로부터 피난층 또는 지상으로 통하는 직통계단과 직접 연결된 지하1층의 계단을 포함한다)은 피난계단 또는 특별피난계단으로 설치하여야 한다. 다만, 주요구조부가 내화구조 또는 불연재료로 된 건축물로서 5층이상의 층의 바닥면적의 합계가 200제곱미터이하이거나 그 이상이더라도 매 200제곱미터 이내마다 방화구획이 되어 있는 경우에는 그러하지 아니하다.<개정 1995·12·30>","  ②건축물(갓복도식 공동주택을 제외한다)의 11층(공동주택의 경우에는 16층)이상 또는 지하 3층이하의 층(바닥면적이 400제곱미터미만인 층을 제외한다)으로부터 피난층 또는 지상으로 통하는 직통계단은 제1항의 규정에 불구하고 특별피난계단으로 설치하여야 한다.<개정 1995·12·30>","  ③제1항의 경우에 판매시설의 용도에 쓰이는 층으로부터의 직통계단은 그 중 1개소이상을 특별피난계단으로 설치하여야 한다.<개정 1995·12·30>","  ④삭제<1995·12·30>","  ⑤건축물의 5층이상의 층으로서 운동시설·위락시설·전시시설·운수시설(다중이 이용하는 시설에 한한다)·관광휴게시설(다중이 이용하는 시설에 한한다)·생활권청소년시설 및 판매시설의 용도에 쓰이는 층에는 제34조의 규정에 의한 직통계단외에 그 층의 당해 용도에 쓰이는 바닥면적의 합계가 2천제곱미터를 넘는 경우에는 그 넘는 매 2천제곱미터이내마다 1개소의 피난계단 또는 특별피난계단(4층이하의 층에 쓰이지 아니하는 것에 한한다)을 설치하여야 한다.<개정 1995·12·30>","  ⑥피난계단 및 특별피난계단의 구조등에 관하여 필요한 사항은 건설교통부령으로 정한다.<신설 1995·12·30>"]},{"d":"1999-05-09","m":"[대통령령 제16284호, 1999. 4. 30, 일부개정]","l":["제35조(피난계단의 설치<개정 1999.4.30>) ①법 제39조제1항의 규정에 의하여 5층이상 또는 지하2층이하의 층에 설치하는 직통계단은 건설교통부령이 정하는 기준에 따라 피난계단 또는 특별피난계단으로 설치하여야 한다. 다만, 건축물의 주요구조부가 내화구조 또는 불연재료로 되어 있는 경우로서 다음 각호의 1에 해당하는 경우에는 그러하지 아니하다.<개정 1999.4.30>","  1. 5층이상의 층의 바닥면적의 합계가 200제곱미터이하인 경우","  2. 5층이상의 층의 바닥면적 매 200제곱미터이내마다 방화구획이 되어 있는 경우","  ②건축물(갓복도식 공동주택을 제외한다)의 11층(공동주택의 경우에는 16층)이상의 층(바닥면적이 400제곱미터미만인 층을 제외한다) 또는 지하 3층이하의 층(바닥면적이 400제곱미터미만인 층을 제외한다)으로부터 피난층 또는 지상으로 통하는 직통계단은 제1항의 규정에 불구하고 특별피난계단으로 설치하여야 한다.<개정 1995ㆍ12ㆍ30, 1999.4.30>","  ③제1항의 경우에 판매 및 영업시설중 도매시장ㆍ소매시장 및 상점의 용도에 쓰이는 층으로부터의 직통계단은 그 중 1개소이상을 특별피난계단으로 설치하여야 한다.<개정 1995ㆍ12ㆍ30,  {t:'방화구획 등의 설치',k:'방화구획_등의_설치',s:[S('방화구획의 설치기준','방화구획의_설치기준')]},
 {t:'방화에 장애가 되는 용도의 제한',k:'방화에_장애가_되는_용도의_제한',s:[S('복합건축물의 피난시설','복합건축물의_피난시설')]},
 {t:'계단ㆍ복도 및 출입구의 설치',k:'계단ㆍ복도_및_출입구의_설치',s:[S('계단의 설치기준','계단의_설치기준'),S('복도의 너비 및 설치기준','복도의_너비_및_설치기준')]},
 {t:'거실반자의 설치',k:'거실반자의_설치',s:[S('거실의 반자높이','거실의_반자높이')]},
 {t:'거실의 채광 등',k:'거실의_채광',s:[S('채광 및 환기를 위한 창문등','채광_및_환기를_위한_창문등'),S('소방관 진입창의 기준','소방관_진입창의_기준')]}]},
{n:'마감재료',it:[
 {t:'건축물의 마감재료 등',k:'건축물의_마감재료_등',s:[S('건축물의 마감재료 등','건축물의_마감재료_등_1'),S('화재 위험이 적은 공장과 인접한 건축물의 마감재료','화재_위험이_적은_공장과_인접한_건축물의_마감재료')]}]},
{n:'피난시설',it:[
 {t:'직통계단의 설치',k:'직통계단의_설치',s:[S('직통계단의 설치기준','직통계단의_설치기준')]},
 {t:'피난계단의 설치',k:'피난계단의_설치',s:[S('피난계단 및 특별피난계단의 구조','피난계단_및_특별피난계단의_구조')]},
 {t:'옥외 피난계단의 설치',k:'옥외_피난계단의_설치',s:[]},
 {t:'건축물 바깥쪽으로의 출구 설치',k:'건축물_바깥쪽으로의_출구_설치',s:[S('건축물의 바깥쪽으로의 출구의 설치기준','건축물_바깥쪽으로의_출구의_설치기준')]},
 {t:'대지 안의 피난 및 소화에 필요한 통로 설치',k:'대지_안의_피난_및_소화에_필요한_통로_설치',s:[]},
 {t:'비상용승강기의 설치',k:'비상용_승강기의_설치',s:[S('비상용승강기를 설치하지 아니할 수 있는 건축물','비상용승강기를_설치하지_아니할_수_있는_건축물','s'),S('비상용승강기의 승강장 및 승강로의 구조','비상용승강기의_승강장_및_승강로의_구조','s')]}]}
];
const KO='가나다라마바사아';
const IC={cal:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h3"/></svg>',his:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',ch:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',dn:'<svg class="cv" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-top:4px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(/(공장|창고)/g,'<mark>$1</mark>');
const fd=d=>{const[a,b,c]=d.split('-');return a+'. '+(+b)+'. '+(+c)+'.'};
const tg=l=>'<span class="tg tg-'+l+'">'+LAW[l].tg+'</span>';
const mparts=m=>(m||'').replace(/^\[|\]$/g,'').split(',').map(s=>s.trim()).filter(Boolean);
const app=document.getElementById('app');
let st={screen:'home',mode:null,date:'',open:-1,item:null,law:null};
const stack=[];
function go(p){stack.push({...st});st={...st,...p};render();window.scrollTo(0,0)}
function back(){if(st.law){st.law=null;render();return}if(stack.length){st=stack.pop();render()}}
function home(){stack.length=0;st={screen:'home',mode:null,date:'',open:-1,item:null,law:null};render();window.scrollTo(0,0)}
function leaf(ci,ii,si){const it=CATS[ci].it[ii];return si<0?{t:it.t,k:it.k,l:'r'}:it.s[si]}
function pick(lf){const vs=D[lf.k]||[];let r=null;for(const v of vs){if(v.d<=st.date)r=v}return r}
function bar(title){return '<div class="bar"><button class="ib" onclick="back()">'+'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>이전</button><h1>'+hl(title)+'</h1></div>'}
function lawView(){
 const v=st.law.v,lf=st.law.lf,p=mparts(v.m);
 const note=st.mode==='date'?'<div class="ban" style="margin:0 0 14px">'+IC.cal.replace('24','18').replace('24','18')+'<span>건축허가일 <b>'+fd(st.date)+'</b> 기준 적용 법령</span></div>':'';
 const body=v.l.map(x=>{const n=x.match(/^ */)[0].length,s=x.trim(),ar=/^제\d+조(의\d+)?\s*[\(（]/.test(s);
  return '<div class="'+(ar?'ar':'')+'" style="'+(ar?'':'padding-left:'+Math.min(n,8)*.55+'em')+'">'+hl(s)+'</div>'}).join('');
 return '<div class="ov" role="dialog" aria-modal="true"><div class="in"><div class="ovh"><button class="ib" onclick="back()">✕ 닫기</button><button class="ib" onclick="home()">처음으로</button></div>'+
 '<div class="lt"><div class="ln">'+tg(lf.l)+hl(LAW[lf.l].n)+'</div><h2>시행 '+fd(v.d)+'</h2><div class="mt">'+hl(lf.t)+(p.length?' · '+esc(p[0])+(p[1]?' · 공포 '+esc(p[1]):'')+(p[2]?' · '+esc(p.slice(2).join(', ')):''):'')+'</div></div>'+note+'<div class="law">'+body+'</div></div></div>';
}
function row(ci,ii,si){
 const lf=leaf(ci,ii,si),has=!!lf.k&&!!D[lf.k];let bd,cls='',off=!has;
 if(!has){bd='준비 중';cls=' wt'}
 else if(st.mode==='date'){const v=pick(lf);if(v)bd=fd(v.d)+IC.ch.replace(/18/g,'13');else{bd='해당없음';cls=' no2';off=true}}
 else bd=D[lf.k].length+'개 시행일'+IC.ch.replace(/18/g,'13');
 const label=si<0?KO[ii]+'. '+hl(lf.t):(si+1)+') '+hl(lf.t);
 return '<button class="it'+(si<0?'':' sb')+(off?' off':'')+'" '+(off?'aria-disabled="true"':'onclick="openRef('+ci+','+ii+','+si+')"')+'><span class="t">'+tg(lf.l)+label+'</span><span class="pl'+cls+'">'+bd+'</span></button>';
}
function render(){
 let h='';
 if(st.screen==='home'){
  const ks=Object.keys(D),tot=ks.reduce((a,k)=>a+D[k].length,0),last=ks.reduce((a,k)=>{const d=D[k][D[k].length-1].d;return d>a?d:a},'');
  h='<div class="hero"><div class="eb">경상남도 건축과</div><h2>'+hl('공장‧창고 화재안전실태조사 관계법령')+'</h2><p>건축허가일 당시의 법령과 시행일별 연혁을 현장에서 바로 확인하세요.</p></div>'+
  '<button class="act" onclick="go({screen:\'date\',mode:\'date\'})"><span class="ico">'+IC.cal+'</span><span><b>건축허가일 기준 법령검색</b><span class="d">허가일 직전에 시행된 법령만 표시</span></span><span class="ch">'+IC.ch+'</span></button>'+
  '<button class="act" onclick="go({screen:\'cats\',mode:\'hist\',open:-1})"><span class="ico">'+IC.his+'</span><span><b>연혁 법령 검색</b><span class="d">시행일별 법령을 가로로 넘겨 비교</span></span><span class="ch">'+IC.ch+'</span></button>'+
  '<div class="stats"><div class="st"><b>'+ks.length+'</b><span>수록 조문</span></div><div class="st"><b>'+tot+'</b><span>시행일 연혁</span></div><div class="st"><b>'+last.slice(0,4)+'</b><span>최신 시행</span></div></div>'+
  '<div class="foot">'+IC.info+'<span>수록 내용은 현장 참고용입니다. 처분·법적 판단에는 국가법령정보센터의 공식 법령을 확인하세요.</span></div>';
 }else if(st.screen==='date'){
  h=bar('건축허가일 기준 법령검색')+'<div class="card" style="margin-top:16px"><label for="dt">건축허가일</label><input id="dt" type="date" min="1900-01-01" max="2100-12-31" value="'+st.date+'" oninput="document.getElementById(\'ok\').disabled=!this.value"><p>허가일 직전에 시행된 법령을 항목별로 보여줍니다.</p><button id="ok" class="go" '+(st.date?'':'disabled')+' onclick="go({screen:\'cats\',date:document.getElementById(\'dt\').value,open:-1})">법령 확인</button></div>';
 }else if(st.screen==='cats'){
  h=bar(st.mode==='date'?'건축허가일 기준 법령':'연혁 법령 검색');
  if(st.mode==='date')h+='<div class="ban">'+IC.cal.replace(/24/g,'18')+'<span>건축허가일 <b>'+fd(st.date)+'</b> 기준 · 직전 시행 법령</span></div>';
  CATS.forEach((c,ci)=>{
   const on=st.open===ci;
   h+='<div class="cat'+(on?' on':'')+'"><button aria-expanded="'+on+'" onclick="st.open='+(on?-1:ci)+';render()"><span class="no">'+(ci+1)+'</span><strong>'+hl(c.n)+'</strong><small>'+c.it.length+'개 항목</small>'+IC.dn+'</button>';
   if(on){h+='<div class="items">';
    c.it.forEach((it,ii)=>{h+=row(ci,ii,-1);it.s.forEach((s,si)=>{h+=row(ci,ii,si)})});
    h+='</div>'}
   h+='</div>';
  });
 }else if(st.screen==='hist'){
  const lf=st.item,vs=[...D[lf.k]].reverse();
  h=bar('연혁 확인')+'<div class="cap">'+tg(lf.l)+hl(lf.t)+'</div><p class="hint">옆으로 밀어 이전 시행일을 확인하고, 누르면 전문이 열립니다.</p><div class="rail">'+
   vs.map((v,i)=>{const p=mparts(v.m),[y,m,d]=v.d.split('-');
    return '<button class="vc" onclick="showLaw('+(vs.length-1-i)+')"><em>'+(i===0?'최신':'')+'</em><b>'+y+'</b><span>'+(+m)+'. '+(+d)+'. 시행</span><small>'+esc(p.length>2?p[p.length-1]:'')+'&nbsp;</small></button>'}).join('')+'</div>';
 }
 app.innerHTML=h+(st.law?lawView():'');
 document.body.style.overflow=st.law?'hidden':'';
}
function openRef(ci,ii,si){
 const lf=leaf(ci,ii,si);
 if(st.mode==='date'){const v=pick(lf);if(v){st={...st,law:{lf,v}};render()}}
 else go({screen:'hist',item:lf});
}
function showLaw(i){const lf=st.item;st={...st,law:{lf,v:D[lf.k][i]}};render()}
render();
</script>
</body>
</html>
